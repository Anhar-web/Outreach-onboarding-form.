<title>Living Plan Agency</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a single working column under a sticky 9-step tracker; each step is one view, the specialist's report sits under "Your action". */
:root{
  --bg:#F6F3EB; --surface:#FFFFFF; --sunk:#EEE9DD; --line:#DDD5C4;
  --fg:#10303A; --muted:#5B6E73; --sea:#005A70; --teal:#00A9A5; --gold:#C9935A;
  --done:#1F8A6E; --work:#D9A441; --work-bg:#FBF1DC; --you:#005A70; --you-bg:#E3EFF2;
  --bar:#00A9A5; --bar-bg:#E4DFD3; --dark-card:#0E2E37; --dark-card-fg:#F6F3EB;
  --f-ui:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"El Messiri","Tajawal",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1D23; --surface:#11272E; --sunk:#0E2228; --line:#23414A;
  --fg:#E9EEEC; --muted:#93A8AC; --sea:#5CC3D6; --teal:#2CC9C4; --gold:#D9A773;
  --done:#3DBE96; --work:#E2B356; --work-bg:#2C2614; --you:#7FD2E2; --you-bg:#12333C;
  --bar:#2CC9C4; --bar-bg:#1C363E; --dark-card:#E9EEEC; --dark-card-fg:#0B1D23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1D23; --surface:#11272E; --sunk:#0E2228; --line:#23414A;
  --fg:#E9EEEC; --muted:#93A8AC; --sea:#5CC3D6; --teal:#2CC9C4; --gold:#D9A773;
  --done:#3DBE96; --work:#E2B356; --work-bg:#2C2614; --you:#7FD2E2; --you-bg:#12333C;
  --bar:#2CC9C4; --bar-bg:#1C363E; --dark-card:#E9EEEC; --dark-card-fg:#0B1D23; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

/* tracker */
.track{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.track-in{display:flex;align-items:flex-start;gap:4px;overflow-x:auto;padding-block:14px 10px;scrollbar-width:none}
.track-in::-webkit-scrollbar{display:none}
.st{flex:1 0 64px;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;cursor:pointer;color:var(--muted);font:inherit;font-size:12px;padding:2px 0;position:relative}
.st::after{content:"";position:absolute;top:17px;inset-inline-start:calc(50% + 20px);width:calc(100% - 40px);height:2px;background:var(--line)}
.st:last-child::after{display:none}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;border:2px solid var(--line);background:var(--surface);color:var(--muted);transition:transform .15s}
.st[data-s="done"] .dot{background:var(--done);border-color:var(--done);color:#fff}
.st[data-s="working"] .dot{background:var(--work);border-color:var(--work);color:#3a2a08}
.st[data-s="you"] .dot{background:var(--you);border-color:var(--you);color:var(--surface)}
.st[aria-current="step"] .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.st[aria-current="step"]{color:var(--fg);font-weight:700}
.st:focus-visible{outline:2px solid var(--sea);outline-offset:3px;border-radius:8px}

/* step view */
main{padding-block:36px 80px}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;font-weight:500}
.pill.done{background:color-mix(in srgb,var(--done) 16%,transparent);color:var(--done)}
.pill.working{background:var(--work-bg);color:var(--work)}
.pill.you{background:var(--you);color:var(--surface)}
.pill.todo{background:var(--sunk);color:var(--muted)}
h1.title{font-size:clamp(30px,6vw,44px);line-height:1.1;margin-top:10px;letter-spacing:-.01em;font-weight:800}
.lede{font-size:18px;color:var(--muted);margin:10px 0 0;max-width:62ch}
.idea-btn{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--fg);cursor:pointer}
.idea{margin-top:14px;background:var(--dark-card);color:var(--dark-card-fg);border-radius:14px;padding:26px 24px}
.idea h3{font-size:24px;margin-top:6px}
.idea p{margin:8px 0 0;opacity:.85;max-width:60ch}

.action{margin-top:26px;border:2px solid var(--you);border-radius:14px;padding:16px 18px;background:var(--surface)}
.action.quiet{border-color:var(--line)}
.action-row{display:flex;gap:12px;align-items:flex-start;margin-top:8px}
.ring{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:0 0 auto;margin-top:3px}
.action.quiet .ring{border-style:dashed}
.copy{margin-top:12px;display:inline-flex;align-items:center;gap:10px;background:var(--you);color:var(--surface);border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.copy span{font-size:11px;background:color-mix(in srgb,var(--surface) 25%,transparent);padding:2px 8px;border-radius:6px}
.copy:focus-visible,.idea-btn:focus-visible,.nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.report{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.report-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;background:var(--sunk);border-bottom:1px solid var(--line);color:var(--sea)}
.report-b{padding:20px 18px;display:grid;gap:18px}
.report-b.working{background:var(--work-bg)}
.report + .report{margin-top:16px}

.big{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.gauge{width:112px;height:112px;flex:0 0 auto}
.big h3{font-size:22px}
.big p{margin:4px 0 0;color:var(--muted)}

.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 52px;gap:12px;align-items:center;font-size:14px}
.bar .track2{height:10px;border-radius:5px;background:var(--bar-bg);overflow:hidden}
.bar .fill{height:100%;background:var(--bar);border-radius:5px}
.bar .fill.low{background:var(--gold)}
.bar b{font-variant-numeric:tabular-nums;text-align:end}
@media (max-width:520px){.bar{grid-template-columns:1fr 52px}.bar .track2{grid-column:1/-1;grid-row:2}}

.leaks{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:l}
.leaks li{counter-increment:l;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.leaks li::before{content:counter(l);width:24px;height:24px;border-radius:50%;background:var(--gold);color:#2a1a08;font-weight:800;font-size:13px;display:grid;place-items:center;margin-top:2px}
.leaks b{display:block}
.leaks span{color:var(--muted);font-size:15px}

.quote{border-inline-start:3px solid var(--teal);padding:4px 14px;margin:0}
.quote p{margin:0;font-size:19px;line-height:1.7}
.quote p.en{font-family:var(--f-ui);font-size:16px;font-style:italic}
.quote cite{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:4px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg);min-width:0}
.tile h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.tile h4 .ar{font-size:15px;color:var(--sea)}
.tile p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted);letter-spacing:.05em}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:700;font-size:12.5px}
tr:last-child td{border-bottom:0}
td.hl{color:var(--sea);font-weight:700}

.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}

.note{font-size:14px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 14px}
.flag{font-size:14px;background:var(--work-bg);border-radius:10px;padding:10px 14px}

/* workflow map */
.flow{overflow-x:auto;padding-bottom:6px}
.flow-in{display:flex;align-items:center;gap:10px;min-width:max-content;padding:8px 2px}
.col{display:flex;flex-direction:column;gap:8px;position:relative}
.col.par{padding:22px 10px 8px;border:1px dashed var(--line);border-radius:12px}
.col.par::before{content:attr(data-label);position:absolute;top:4px;inset-inline-start:10px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.node{width:118px;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;background:var(--surface);font-size:12px;line-height:1.35}
.node.client{border:2px dashed var(--you)}
.node .av{width:30px;height:30px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:800;font-size:11px;border:1.5px solid var(--line);color:var(--muted)}
.node[data-s="done"] .av{background:var(--done);border-color:var(--done);color:#fff}
.node[data-s="working"] .av{background:var(--work);border-color:var(--work);color:#3a2a08}
.node[data-s="you"] .av{background:var(--you);border-color:var(--you);color:var(--surface)}
.node b{display:block;font-size:12.5px}
.node small{color:var(--muted)}
.arrow{color:var(--line);font-size:18px;flex:0 0 auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);justify-content:center;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}

.nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.nav button{font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.nav button.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nav button:disabled{opacity:.35;cursor:default}

.dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.dir{border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);cursor:pointer;text-align:start;font:inherit;color:var(--fg);display:flex;flex-direction:column;gap:8px}
.dir[aria-pressed="true"]{border-color:var(--you);box-shadow:0 0 0 3px color-mix(in srgb,var(--you) 20%,transparent);background:var(--surface)}
.dir .nm{font-weight:800;font-size:14px}
.dir .rec{font-family:var(--f-mono);font-size:10px;background:var(--gold);color:#2a1a08;padding:2px 7px;border-radius:5px;align-self:flex-start}
.dir .h{font-family:var(--f-ar);direction:rtl;font-size:17px;line-height:1.6}
.dir .sc{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.phone-wrap{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:640px){.phone-wrap{grid-template-columns:1fr}}
.phone{border-radius:30px;border:8px solid #0d1b20;overflow:hidden;background:#004556;max-width:300px;width:100%;margin-inline:auto}
.phone .scr{direction:rtl;padding:26px 20px 28px;color:#F6F3EB;background:linear-gradient(170deg,#005A70 0%,#003B49 100%);min-height:400px;display:flex;flex-direction:column;gap:14px}
.phone .eb{font-family:var(--f-ar);font-size:12px;color:#7fd9d5;letter-spacing:.02em}
.phone .hd{font-family:var(--f-ar);font-weight:700;font-size:23px;line-height:1.5;margin:0}
.phone .sb{font-size:14px;line-height:1.8;color:rgba(246,243,235,.85);margin:0}
.phone .bt{margin-top:6px;background:#C9935A;color:#2b1a08;border-radius:12px;padding:12px;text-align:center;font-weight:800;font-size:14px}
.phone .ft{font-size:11.5px;color:rgba(246,243,235,.6);text-align:center}
.ctl{display:grid;gap:14px}
.ctl .lbl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hlist{display:grid;gap:8px}
.hrow{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hrow.top{border-color:var(--teal)}
.hrow .s{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px;color:var(--sea)}
.hrow .a{font-family:var(--f-ar);direction:rtl;font-size:16px}
.hrow .w{font-size:13px;color:var(--muted);margin-top:2px}
.view{animation:in .25s ease}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
</style>

<div class="track"><div class="wrap"><nav class="track-in" id="track" aria-label="Agency steps"></nav></div></div>
<main class="wrap"><div id="view"></div></main>

<script>

const RUN = {

        <div class="tile"><h4>Deep links <span class="tag">new</span></h4><p><code>?focus=sleep</code>, <code>?focus=food</code> etc. so TikTok and email links open a personalized landing too.</p></div>
      </div>
    </div>
  </div></div>`,

  audit: () => {
    const total = AUDIT.reduce((s,a)=>s+a[1],0);
    return `
  <div class="report"><div class="report-h"><span class="mono">Auditor's report</span><span class="pill done">Done</span></div>
  <div class="report-b">
    <div class="big">${gauge(total,100)}<div><h3>Before score: ${total} / 100</h3><p>Audited at 58. You confirmed the 10 places are real, so honest urgency moves from 1 to 4 (one point off because it's stated twice in one block).</p></div></div>
    <div class="bars">${AUDIT.map(([l,s,m,n])=>`<div class="bar"><span>${l}${n?` <span class="tag">${n}</span>`:''}</span><div class="track2"><div class="fill ${s/m<.6?'low':''}" style="width:${s/m*100}%"></div></div><b>${s}/${m}</b></div>`).join('')}</div>
  </div></div>
  <div class="report"><div class="report-h"><span class="mono">Biggest leaks</span></div>
  <div class="report-b">
    <ol class="leaks">
      <li><div><b>Personalization stops after the headline</b><span>The problem section is always about bedtime, even if she chose food or anger. The headline can use a different "gap" than the one her results card just told her. Her own Q15 words never appear on the landing, and <code>?focus=</code> doesn't exist yet.</span></div></li>
      <li><div><b>The things that lower her risk are missing</b><span>"Monthly, cancel anytime" is never said. Nothing tells her what happens after the Google Form. The «أنا» in «أنا والقروب معاك» is never introduced. The hero asks her to book before she has seen the price.</span></div></li>
      <li><div><b>The mechanism is generic</b><span>"A personal plan + reviews" is something any coach could claim. The real difference (looking at the child's whole day, not only the behaviour) shows up in a case story but is never named.</span></div></li>
      <li><div><b>Arabic slips and length</b><span>The FAQ slides into formal Arabic («ماذا لو», «لا توجد», «يمكن أن تكون»), there are about a dozen typos, and the email-link subheadline is broken. The landing is about 14 phone screens and says «كل أسبوعين» 14 times.</span></div></li>
    </ol>
    <div>
      <div class="mono" style="color:var(--muted);margin-bottom:8px">Keep these</div>
      <div class="grid2">
        <div class="tile"><h4>Real value first</h4><p>The results help her whether or not she ever joins.</p></div>
        <div class="tile"><h4>Honest objections</h4><p>«هل أنا السبب؟» and «ولو ما ضبط؟» are strong and kind.</p></div>
        <div class="tile"><h4>The strongest proof</h4><p class="ar" style="text-align:start">«كان يصحى معصب كل يوم. هالأسبوع صحى معصب مرة وحدة.»</p></div>
      </div>
    </div>
  </div></div>`;},

  research: () => `
  <div class="report"><div class="report-h"><span class="mono">Researcher's report</span><span class="pill done">Done</span></div>
  <div class="report-b">
    <div class="big"><div><h3>The gap no one fills: a daily plan that ties everything together</h3><p>Mothers have sessions, tips and forum "programs". What's missing is someone helping them turn it into one plan for home.</p></div></div>
    <figure class="quote"><p class="en">"My daughter was getting PT/OT/Speech, but who was there with an everyday plan to put it together?"</p><cite>Parent on r/Autism_Parenting (English; closest real statement of your exact gap)</cite></figure>
    <figure class="quote"><p class="ar">«حرجهم من قبول دعوة عشاء… امتناعهم عن كل أشكال الزيارات»</p><cite>Al Jazeera blog on autism families (search snippet, to verify)</cite></figure>
    <figure class="quote"><p class="ar">«كان يصحى معصب كل يوم. هالأسبوع صحى معصب مرة وحدة.»</p><cite>Your own case: the best Saudi voice we have</cite></figure>
    <div class="flag"><b>Honest limit:</b> very few real Saudi mothers' words are on the open web (they talk on TikTok, Snap and WhatsApp, which search can't reach). Anything the researcher wrote as a suggested Saudi phrasing is marked as a suggestion and will not be presented as a quote. Your TikTok comments and Q15 answers are the best source to add.</div>
  </div></div>

  <div class="report"><div class="report-h"><span class="mono">Her situations</span></div>
  <div class="report-b"><div class="grid2">
    ${[
      ["Bedtime","وقت النوم","Long time to fall asleep, night waking, very early waking. Sleep is her exhaustion too, not only his."],
      ["Visits","الزيارات والعزايم","Turning down invitations, stares, relatives reading it as bad parenting. Eid and grandma's house are the heavy moments."],
      ["Communication","التواصل","Guessing all day what he wants; frustration turns into crying. Your communication case fits here."],
      ["Food","الأكل","A short list of safe foods, same plate and brand, family pressure to 'just make him eat'. Your food case fits exactly."],
      ["Transitions","الانتقال","Turning off the iPad, leaving the park. Warnings and timers get used, but not consistently."],
      ["Anger","الانفعال","Sudden outbursts; mothers often describe anger, sleep and food together. That supports the whole-day view."]
    ].map(([e,a,t])=>`<div class="tile"><h4>${e} <span class="ar">${a}</span></h4><p>${t}</p></div>`).join('')}
  </div></div></div>

  <div class="report"><div class="report-h"><span class="mono">What else she can buy</span></div>
  <div class="report-b">
    <div class="tbl"><table>
      <tr><th>Alternative</th><th>Price</th><th>What's missing</th></tr>
      <tr><td>Online freelance sessions (Khamsat)</td><td>$5–20 a session</td><td>One-off, no follow-up</td></tr>
      <tr><td>Home therapy sessions</td><td>~150 ريال a session</td><td>Works with the child, not her day</td></tr>
      <tr><td>Private centres</td><td>100,000+ ريال a year</td><td>Expensive; skills stay at the centre</td></tr>
      <tr><td>Charities, WHO caregiver training</td><td>Free</td><td>Generic, not continuous</td></tr>
      <tr><td>Tips accounts, forum diets and "programs"</td><td>Free</td><td>More tips, promises of "شفاء"</td></tr>
      <tr><td class="hl">الخطة الحية</td><td class="hl">٧٤٩ ريال / month</td><td class="hl">Ongoing, personal, home-based, reviewed every 2 weeks</td></tr>
    </table></div>
    <div class="note">No Arabic ongoing, personal home-plan subscription with public pricing turned up in search. The open lane is continuity + personalization + someone with her between appointments.</div>
  </div></div>

  <div class="report"><div class="report-h"><span class="mono">Market Analyst's report</span><span class="pill done">Done</span></div>
  <div class="report-b">
    <div class="big">${gauge(3,5)}<div><h3>Market level 3: lead with the "how"</h3><p>She has heard the promises ("شفاء" diets, tip lists, sessions that don't carry home) and stopped believing them. A new promise won't land. A believable <i>how</i> will.</p></div></div>
    <div class="grid2">
      <div class="tile"><h4>The headline leads with</h4><p>Her own repeating moment, in Saudi words, then the how: one plan built from her child's <b>whole day, not the moment alone</b>, one area at a time, adjusted every two weeks.</p></div>
      <div class="tile"><h4>Avoid leading with</h4><p>Promised results, cure wording, "more tips", "first of its kind", a bare «خطة مخصصة», blame, labels on the child, fear.</p></div>
    </div>
    <div>
      <div class="mono" style="color:var(--muted);margin-bottom:8px">Her lowest dimension picks which part of the "how" to stress</div>
      <div class="grid2">
        <div class="tile"><h4>Patterns <span class="ar">فهم الأنماط</span></h4><p>Seeing what builds up to the moment.</p></div>
        <div class="tile"><h4>Personalizing <span class="ar">تخصيص الطريقة</span></h4><p>Built from this child, not a rule for every child.</p></div>
        <div class="tile"><h4>Consistency <span class="ar">وضوح الخطة</span></h4><p>The two-week review rhythm, worded differently per situation.</p></div>
      </div>
    </div>
    <div class="tbl"><table>
      <tr><th>Situation</th><th>How the headline should lean</th></tr>
      <tr><td>Bedtime</td><td>Bedtime as the end of his whole day</td></tr>
      <tr><td>Visits</td><td>Her scene and feelings first; keep it short</td></tr>
      <tr><td>Communication</td><td>The moments at home between sessions; never promise speech</td></tr>
      <tr><td>Food</td><td>Questions first, keep his safe foods, add new ones gradually</td></tr>
      <tr><td>Transitions</td><td>Which changes are hard for him and what comes before them</td></tr>
      <tr><td>Anger</td><td>The whole-day view plus your real quote; self-harm always points to a specialist</td></tr>
    </table></div>
  </div></div>
  <div class="report" id="positioning" style="border:2px solid var(--you)"><div class="report-h"><span class="mono">Positioning Strategist's report</span><span class="pill done">Approved</span></div>
  <div class="report-b">
    <div class="big"><div><h3>Whole day. One area. Every two weeks.</h3><p>The mechanism the page stands on. No invented jargon: the product's own name explains it. The plan is "living" because it's adjusted every two weeks.</p></div></div>
    <figure class="quote"><p class="ar">يومه كامل، مجال واحد، مراجعة كل أسبوعين.</p><p class="ar" style="font-size:16px;color:var(--muted)">نشوف يوم طفلك كامل، مو الموقف وحده. نختار مجال واحد نشتغل عليه. وكل أسبوعين نراجعه معاكي ونعدّله حسب استجابته.</p><cite>The mechanism, as it will read on the page</cite></figure>
    <div>
      <div class="mono" style="color:var(--muted);margin-bottom:8px">Core positioning</div>
      <p style="margin:0">Personal, ongoing guidance from you for Saudi mothers who already have tips, sessions and programs but nobody turning their child's real day into one plan. It works <b>alongside</b> his specialists, not instead of them.</p>
      <p class="ar" style="margin:8px 0 0;font-size:17px">الخطة الحية متابعة شخصية مع أنهار، لكل أم جربت نصائح وجلسات وبرامج وما زالت نفس المواقف تتكرر. نبدأ من يوم طفلك كامل، نشتغل على مجال واحد، ونعدّل الخطة معاكي كل أسبوعين، مع جلساته مو بدالها.</p>
    </div>
    <figure class="quote"><p class="ar">انتي مو محتاجة تجمعي نصائح أكثر. تحتاجي خطة تبدأ من يوم طفلك، وتتعدل معاكي كل أسبوعين.</p><cite>Core message: your locked line, finished with the mechanism</cite></figure>
    <div class="tbl"><table>
      <tr><th>She's tried…</th><th>…which gives her</th><th>The Living Plan gives her</th></tr>
      <tr><td>Tips and articles</td><td>More information</td><td class="hl">One priority and the next step</td></tr>
      <tr><td>Sessions and centres</td><td>An hour with the child</td><td class="hl">Help with the other 23 hours at home</td></tr>
      <tr><td>Programs and diets</td><td>A fixed plan that promises a result</td><td class="hl">A plan that changes with her child, and no false promise</td></tr>
    </table></div>
    <div>
      <div class="mono" style="color:var(--muted);margin-bottom:8px">Five differentiators</div>
      <ol class="leaks">
        <li><div><b>His whole day, not the behaviour alone</b><span>Bedtime is the end of his day; anger builds up before it. Your angry-child case is the proof.</span></div></li>
        <li><div><b>One area at a time</b><span>Not ten tips a week. She leaves each review knowing the next step.</span></div></li>
        <li><div><b>Reviewed every two weeks</b><span>Adjusted for hard days, setbacks and routine changes. Not a one-off session, not a fixed program.</span></div></li>
        <li><div><b>A real person, in her dialect</b><span>You, plus a small group of mothers. The first group takes 10 mothers, said once.</span></div></li>
        <li><div><b>Low risk for her</b><span>Works alongside his therapy. Monthly, cancel anytime, no promised outcome.</span></div></li>
      </ol>
    </div>
    <div class="grid2">
      <div class="tile"><h4>Use</h4><p>Her moment first, then the how · "you see what no session sees" · "the problem isn't effort" · introduce you early so «أنا» means someone · say what happens after the form.</p></div>
      <div class="tile"><h4>Avoid</h4><p>Promised results (ينام، يهدأ، يتكلم) · cure words · "more tips" · "first of its kind" · blame · labels on the child · a second mention of the 10 places.</p></div>
    </div>
    <div class="flag"><b>Two decisions in this positioning:</b> it names you as the person behind the plan, and it says plainly who it's <i>not</i> for (anyone looking for a cure or a guaranteed result). If you'd rather stay in the background, say so now.</div>
  </div></div>`
};

function gauge(v,max){
  const r=48,c=2*Math.PI*r,p=v/max;
  return `<svg class="gauge" viewBox="0 0 112 112" role="img" aria-label="${v} out of ${max}">
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--bar-bg)" stroke-width="9"/>
    <circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c*p} ${c}" transform="rotate(-90 56 56)"/>
    <text x="56" y="58" text-anchor="middle" font-family="Tajawal,sans-serif" font-weight="800" font-size="28" fill="var(--fg)">${v}</text>
    <text x="56" y="76" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="9" fill="var(--muted)">/ ${max}</text></svg>`;
}
function node(t){return `<div class="node ${t.client?'client':''}" data-s="${t.s}"><div class="av">${t.k}</div><b>${t.name}</b><small>${t.what}</small></div>`}
function flowMap(){
  const parts = RUN.team.map(t=> t.group ? `<div class="col par" data-label="${t.group}">${t.items.map(node).join('')}</div>` : node(t));
  return `<div class="report"><div class="report-h"><span class="mono">The agency's plan</span><span class="mono" style="color:var(--muted)">Updated ${RUN.updated}</span></div>
  <div class="report-b"><div class="flow"><div class="flow-in">${parts.join('<span class="arrow" aria-hidden="true">←</span>'.replace('←','→'))}</div></div>
  <div class="legend"><span><i style="border:1.5px solid var(--line)"></i>Not started</span><span><i style="background:var(--work)"></i>Working</span><span><i style="background:var(--you)"></i>Needs you</span><span><i style="background:var(--done)"></i>Done</span></div></div></div>`;
}
const PILL = {done:["done","Done"],working:["working","Working"],you:["you","Needs you"],todo:["todo","Not started"]};

/* ===== Render ===== */
const track = document.getElementById('track'), view = document.getElementById('view');
const S = RUN.steps;
function activeDefault(){ return (S.find(s=>s.status==='you')||S.find(s=>s.status==='working')||S[S.length-1]).n; }
let cur = activeDefault();

function renderTrack(){
  track.innerHTML = S.map(s=>`<button class="st" data-s="${s.status}" data-n="${s.n}" ${s.n===cur?'aria-current="step"':''}><span class="dot">${s.status==='done'?'✓':s.n}</span>${s.short}</button>`).join('');
  track.querySelectorAll('.st').forEach(b=>b.onclick=()=>go(+b.dataset.n));
  const a = track.querySelector('[aria-current]'); if(a) a.scrollIntoView({block:'nearest',inline:'center'});
}
function renderView(){
  const s = S[cur-1], [pc,pl] = PILL[s.status];
  const act = s.action;
  view.innerHTML = `<section class="view">
    <div class="eyebrow"><span class="mono">Step ${s.n} of ${S.length}</span><span class="pill ${pc}">${pl}</span></div>
    <h1 class="title">${s.title}</h1>
    <p class="lede">${s.lede}</p>
    <button class="idea-btn" id="ideaBtn" aria-expanded="false">The idea +</button>
    <div class="idea" id="idea" hidden><div class="mono" style="opacity:.6">The idea behind this step</div><h3>${s.idea[0]}</h3><p>${s.idea[1]}</p></div>
    <div class="action ${act.quiet?'quiet':''}"><div style="display:flex;justify-content:space-between"><span class="mono" style="color:var(--muted)">Your action</span></div>
      <div class="action-row"><span class="ring"></span><div>${act.text}${act.copy?`<div><button class="copy" data-copy="${act.copy}">${act.copy}<span>Copy</span></button></div>`:''}</div></div></div>
    ${s.n===3 || s.n===1 ? flowMap() : ''}
    ${s.body && BLOCKS[s.body] ? BLOCKS[s.body]() : `<div class="report"><div class="report-h"><span class="mono">Report</span><span class="pill todo">Not started</span></div><div class="report-b">This step hasn't started yet.</div></div>`}
    <div class="nav"><button id="prev" ${cur===1?'disabled':''}>← Back</button><button class="next" id="next" ${cur===S.length?'disabled':''}>Next →</button></div>
  </section>`;
  const ib=document.getElementById('ideaBtn'), id=document.getElementById('idea');
  ib.onclick=()=>{id.hidden=!id.hidden; ib.setAttribute('aria-expanded',String(!id.hidden)); ib.textContent = id.hidden?'The idea +':'The idea −';};
  document.getElementById('prev').onclick=()=>go(cur-1);
  document.getElementById('next').onclick=()=>go(cur+1);
  if(s.body==='headlines') wireHeadlines();
  view.querySelectorAll('.copy').forEach(b=>b.onclick=()=>{
    const t=b.dataset.copy; const done=()=>{b.lastChild.textContent='Copied'};
    try{navigator.clipboard.writeText(t).then(done,()=>{})}catch(e){}
  });
}

function wireHeadlines(){
  const st={d:HL.recommended,k:'F',p:'1'};
  const upd=()=>{
    const d=HL.directions.find(x=>x.id===st.d);
    document.getElementById('pv-h').textContent=d.by_situation[st.k];
    document.getElementById('pv-s').textContent=HL.subheads[st.p];
    document.getElementById('hlist').innerHTML=d.headlines.map(h=>`<div class="hrow ${h.top?'top':''}"><span class="s">${h.score}</span><div><div class="a">${h.ar}</div><div class="w">${h.why}</div></div></div>`).join('');
    const c=document.querySelector('.action .copy'); if(c){const n=HL.directions.findIndex(x=>x.id===st.d)+1;c.dataset.copy=`I pick direction ${n}.`;c.firstChild.textContent=`I pick direction ${n}.`;}
  };
  const grp=(id,key)=>document.getElementById(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{document.getElementById(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');st[key]=b.dataset[key==='d'?'d':'k'];upd();});
  grp('dirs','d');grp('sits','k');grp('profs','p');upd();
}
function go(n){ if(n<1||n>S.length) return; cur=n; try{history.replaceState(null,'','#step-'+n)}catch(e){location.hash='step-'+n} renderTrack(); renderView(); window.scrollTo({top:0}); }
function fromHash(){ const m=/^#step-(\d)$/.exec(location.hash); if(m){cur=+m[1]} }
fromHash(); renderTrack(); renderView();
addEventListener('hashchange',()=>{fromHash();renderTrack();renderView();});
</script>
