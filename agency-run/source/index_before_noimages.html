<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ليش نفس المواقف تتكرر مع طفلك؟ | مدار البيت</title>
<meta name="description" content="تقييم مجاني لأمهات الأطفال التوحديين — اكتشفي نقاط القوة في طريقتك الحالية وايش تحتاجي تنظمي.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   مدار البيت | Home Orbit — Sunrise Minimal (light, editorial)
   Cream & warm white backgrounds · Deep Sea Blue headings ·
   Teal buttons & accents · Sunrise Gold in light/highlights.
   ============================================================ */
:root{
  --sea:#005A70; --sea-deep:#013d4b; --sea-ink:#143842;
  --teal:#008C95; --teal-deep:#00737a;
  --gold:#C9935A; --gold-deep:#b57f44;
  --paper:#FAFBFB; --cream:#F2F7F8; --card:#EDF5F6; --hi:#D8EEEE; --white:#FFFFFF;
  --ink:#2f4a53; --ink-soft:#526B74; --ink-faint:#8299a0;
  --line:#DCE8EA; --line-soft:#E6EFF0;
  --sh:0 12px 30px -24px rgba(0,70,86,.26);
  --sh-soft:0 8px 20px -18px rgba(0,70,86,.2);
  --r:20px; --maxw:680px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Tajawal",system-ui,sans-serif;color:var(--ink);
  background:var(--paper);min-height:100vh;line-height:1.85;overflow-x:hidden}

h1,h2,h3{font-family:"El Messiri";font-weight:600;margin:0;line-height:1.35;color:var(--sea)}

/* Layout shell */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:26px 0 0;
  animation:screenIn .5s cubic-bezier(.22,.9,.3,1) both}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.result-screen{padding-top:0}
.center{text-align:center}

/* Top brand bar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 20px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;flex:none}
.brand b{font-family:"El Messiri";font-weight:700;font-size:17px;color:var(--sea);display:block;line-height:1.1}
.brand small{font-family:"El Messiri";font-size:11.5px;color:var(--teal);font-weight:600}

/* Reveal on scroll */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease, transform .7s cubic-bezier(.22,.9,.3,1)}
.reveal.in{opacity:1;transform:none}

/* Image slots (placeholders until real photos are dropped into IMAGES) */
.imgslot{display:block;width:100%;border-radius:var(--r);object-fit:cover;object-position:center;overflow:hidden}
.imgslot.ph{display:grid;place-items:center;text-align:center;padding:14px;
  color:var(--sea);font-family:"El Messiri";font-size:13.5px;font-weight:600;
  border:1.5px dashed rgba(0,90,112,.28);
  background:linear-gradient(135deg, rgba(0,140,149,.12), rgba(201,147,90,.14)), var(--cream)}
.imgslot.ph span{opacity:.75;max-width:30ch;line-height:1.6}

/* Typography helpers */
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:"El Messiri";
  font-weight:600;color:var(--teal);font-size:13px;letter-spacing:.6px;margin-bottom:12px}
.eyebrow .rp{width:20px;height:20px}
.hero-title{font-family:"El Messiri";font-weight:700;color:var(--sea);
  font-size:clamp(26px,6.6vw,38px);line-height:1.3;letter-spacing:-.3px}
.lead{font-size:clamp(16px,4vw,18px);color:var(--ink-soft);margin-top:16px;line-height:1.9}
.support{font-size:15.5px;color:var(--ink-soft);margin-top:18px;white-space:pre-line;line-height:1.95}

/* Facts */
.facts{list-style:none;padding:0;margin:24px 0 0;display:flex;flex-direction:column;gap:12px}
.facts li{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink-soft)}
.facts .dot{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,140,149,.12);border:1px solid var(--line)}
.facts .dot svg{width:13px;height:13px;stroke:var(--teal)}

/* Form */
.field{margin-top:16px;text-align:right}
.field label{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:8px;font-weight:600}
.field input,.field textarea{width:100%;background:var(--card);border:1.5px solid var(--line);
  border-radius:14px;color:var(--ink);font-family:inherit;font-size:16px;padding:14px 16px;outline:none;
  transition:border-color .2s, box-shadow .2s}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-faint)}
.field input:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,140,149,.12)}
.field textarea{min-height:120px;resize:vertical;line-height:1.85}
.field .err{color:#c0632f;font-size:13px;margin-top:7px;display:none}
.field.invalid input{border-color:#c0632f}
.field.invalid .err{display:block}
.reassure{font-size:12.5px;color:var(--ink-faint);margin-top:14px;text-align:center}
.optin-wrap{max-width:540px;margin:20px auto 0}
.optin{display:flex;align-items:flex-start;gap:9px;margin-top:12px;cursor:pointer}
.optin input{margin-top:3px;width:16px;height:16px;flex:none;accent-color:var(--teal);cursor:pointer}
.optin span{font-size:12.5px;color:var(--ink-soft);line-height:1.7}

/* Buttons */
/* Compact, content-sized buttons (44px). No heavy shadows. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;
  font-family:"El Messiri";font-weight:600;font-size:15px;min-height:44px;padding:0 24px;border-radius:8px;
  border:none;cursor:pointer;transition:background .2s, box-shadow .2s, transform .12s}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 6px 16px -10px rgba(0,140,149,.5)}
.btn-teal:hover{background:var(--teal-deep)}
.btn-gold{background:var(--gold);color:#3a2410;box-shadow:0 6px 16px -10px rgba(201,147,90,.5)}
.btn-gold:hover{background:var(--gold-deep)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-wide{width:100%}

/* Question screen */
.q-img{height:clamp(150px,32vw,230px);margin-bottom:18px;border-radius:var(--r);object-position:20% 42%;
  -webkit-mask-image:linear-gradient(to bottom,#000 64%,transparent),linear-gradient(to right,#000 50%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(to bottom,#000 64%,transparent),linear-gradient(to right,#000 50%,transparent);
  mask-composite:intersect}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:14px}
.qcount{font-size:13.5px;color:var(--ink-faint);font-family:"El Messiri";font-weight:600}
.namepill{font-size:12.5px;color:var(--teal);background:rgba(0,140,149,.1);border:1px solid var(--line);
  padding:5px 13px;border-radius:999px;font-weight:600;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbar{height:7px;background:#DCE8EA;border-radius:999px;overflow:hidden;margin-bottom:26px;display:flex}
.pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),#35b4bb);
  transition:width .5s cubic-bezier(.22,.9,.3,1)}
.qtext{font-size:clamp(19px,5vw,24px);font-weight:700;color:var(--sea);line-height:1.5;margin-bottom:10px}
.qsupport{font-size:14.5px;color:var(--ink-soft);margin:0 0 20px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{position:relative;display:flex;align-items:center;gap:13px;cursor:pointer;min-height:54px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 18px;
  transition:border-color .18s, background .18s}
.opt:hover{border-color:rgba(0,140,149,.5)}
.opt .mk{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid rgba(0,90,112,.3);
  display:grid;place-items:center;transition:all .18s}
.opt .mk svg{width:12px;height:12px;stroke:#fff;opacity:0;transform:scale(.5);transition:all .18s}
.opt .ot{font-size:15px;color:var(--sea);line-height:1.6;flex:1}
.opt.sel{border:2px solid var(--teal);background:var(--hi);padding:9px 17px}
.opt.sel .mk{border-color:var(--teal)}
.opt.sel .mk{background:var(--teal);border-color:var(--teal)}
.opt.sel .mk svg{opacity:1;transform:scale(1)}
.freewrap{margin-top:12px;animation:screenIn .3s both}
.nav{display:flex;align-items:center;gap:12px;margin-top:26px}
.nav .btn{flex:none;padding:0 22px}
.nav .spacer{flex:1}

/* Signature wave footer (full-bleed) */
.waves{width:100vw;margin-inline:calc(50% - 50vw);margin-top:44px;line-height:0}
.waves svg{display:block;width:100%;height:clamp(90px,16vw,150px)}

/* ============================================================
   RESULTS
   ============================================================ */
.r-hero{margin-bottom:24px}
.r-hero .imgslot{height:clamp(180px,44vw,280px);margin-bottom:22px;object-position:78% 45%}
.r-greet{font-size:16px;color:var(--teal);font-family:"El Messiri";font-weight:600;margin-bottom:6px}
.r-title{font-family:"El Messiri";font-weight:700;color:var(--sea);
  font-size:clamp(24px,6vw,34px);line-height:1.32}

.r-sec{margin-top:30px}
.r-sec-h{font-family:"El Messiri";font-weight:700;color:var(--sea);font-size:clamp(19px,4.2vw,23px);margin:0 0 4px}
.r-sec-sub{font-size:14px;color:var(--ink-soft);margin:0 0 18px}

/* overall score: ring + reveals */
.r-overall{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;box-shadow:var(--sh-soft)}
@media(max-width:520px){.r-overall{grid-template-columns:1fr;text-align:center;justify-items:center}}
.ring{width:132px;height:132px;flex:none}
.ring-num{font-family:"El Messiri";font-weight:700;fill:var(--sea);font-size:34px}
.ring-sub{font-family:"Tajawal";fill:var(--ink-faint);font-size:12px}
.ring-val{transition:stroke-dashoffset 1.1s cubic-bezier(.22,.9,.3,1)}
.r-overall .lvl{font-family:"El Messiri";font-weight:600;color:var(--teal);font-size:15px;margin:0 0 8px}
.r-overall p{margin:0;font-size:15px;color:var(--ink-soft);white-space:pre-line;line-height:1.95}

/* dimension cards */
.dimgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:560px){.dimgrid{grid-template-columns:1fr}}
.dimcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;box-shadow:var(--sh-soft)}
.dimcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:rgba(0,140,149,.1);margin-bottom:12px}
.dimcard .ic svg{width:22px;height:22px;stroke:var(--teal)}
.dimcard .nm{font-family:"El Messiri";font-weight:600;color:var(--sea);font-size:15.5px;line-height:1.4;margin-bottom:10px}
.dimcard .val{font-family:"El Messiri";font-weight:700;color:var(--sea);font-size:17px;margin-bottom:9px}
.dimcard .val span{font-size:13px;color:var(--ink-faint);font-weight:500}
.dimcard .bar{height:7px;background:#DCE8EA;border-radius:999px;overflow:hidden;display:flex}
.dimcard .bar i{height:100%;border-radius:999px;width:0;background:linear-gradient(90deg,var(--sea),var(--teal));
  transition:width 1s cubic-bezier(.22,.9,.3,1)}

/* copy cards */
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:24px 22px;margin-top:16px;box-shadow:var(--sh-soft)}
.rcard .k{font-family:"El Messiri";font-size:15px;font-weight:700;color:var(--sea);
  margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rcard .k .ic{width:22px;height:22px;flex:none;stroke:var(--teal)}
.rcard p{margin:0;font-size:15px;color:var(--ink-soft);white-space:pre-line;line-height:1.95}
.rcard.gold{border-color:rgba(201,147,90,.4);background:linear-gradient(180deg,rgba(201,147,90,.08),rgba(201,147,90,.02))}
.rcard.gold .k,.rcard.gold .k .ic{color:var(--gold-deep);stroke:var(--gold-deep)}
.sit-chip{display:inline-block;background:rgba(0,140,149,.1);border:1px solid var(--line);
  color:var(--teal);font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:14px;font-weight:600}
.outcome{font-size:16.5px;color:var(--sea);font-family:"El Messiri";line-height:1.7;
  border-right:3px solid var(--gold);padding-right:15px;margin:2px 0 14px;white-space:pre-line}

/* Living Plan hand-off panel (gold button) */
.lp-panel{margin-top:30px;border-radius:24px;overflow:hidden;position:relative;text-align:center;
  border:1px solid rgba(201,147,90,.3);
  background:radial-gradient(130% 90% at 50% 0%, rgba(0,140,149,.1), transparent 55%),
    linear-gradient(180deg,#ffffff,#EDF5F6)}
.lp-panel-in{padding:34px 24px 32px}
.lp-panel .rp{width:46px;height:46px;margin:0 auto 16px;display:block}
.lp-panel h2{font-family:"El Messiri";font-weight:700;color:var(--sea);font-size:clamp(21px,5.2vw,27px);line-height:1.4}
.lp-lines{margin:18px auto 0;max-width:46ch;display:flex;flex-direction:column;gap:13px}
.lp-lines p{margin:0;font-size:15px;color:var(--ink-soft);line-height:1.9}
.lp-lines p.em{color:var(--sea);font-family:"El Messiri";font-weight:600;font-size:16px}
.lp-panel .btn{margin-top:24px}

/* ============================================================
   LANDING (الخطة الحية) — bright editorial, shown after hand-off
   ============================================================ */
.landing{display:none;width:100vw;margin-inline:calc(50% - 50vw);
  background:var(--paper);color:var(--ink);text-align:right;line-height:1.9}
.lp-nav{position:sticky;top:0;z-index:20;background:rgba(250,251,251,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft)}
.lp-nav-in{max-width:1080px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.lp-nav .brand .mark{width:26px;height:26px}
.lp-nav .brand b{font-size:15px}
.lp-nav .brand small{font-size:11px}
.lp-nav .links{display:flex;gap:20px}
.lp-nav .links a{color:var(--ink-soft);text-decoration:none;font-family:"El Messiri";font-weight:600;font-size:14px}
.lp-nav .links a:hover{color:var(--teal)}
@media(max-width:720px){.lp-nav .links{display:none}}

.lp-sec{padding:62px 0;position:relative}
.lp-wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.lp-narrow{max-width:720px}
.lp-center{text-align:center}
.lp-maxp{max-width:58ch;margin-inline:auto}
.lp-alt{background:var(--cream)}

.lp-eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:"El Messiri";
  font-weight:600;color:var(--teal);font-size:13px;letter-spacing:.6px;margin-bottom:10px}
.lp-eyebrow.center{justify-content:center}
.lp-h{font-family:"El Messiri";font-weight:700;color:var(--sea);
  font-size:clamp(23px,4.4vw,32px);line-height:1.4;margin:6px 0 16px}
.lp-sub{font-family:"El Messiri";font-weight:600;color:var(--sea);font-size:clamp(18px,3.2vw,22px);margin:6px 0 18px}
.lp-p{font-size:16px;color:var(--ink-soft);margin:0 0 13px;line-height:1.95}
.lp-pull{font-family:"El Messiri";font-weight:600;color:var(--sea);font-size:clamp(17px,3.2vw,21px);
  line-height:1.6;margin:18px 0 0;border-right:3px solid var(--gold);padding-right:16px}

/* hero */
.lp-hero{position:relative;min-height:84vh;display:flex;align-items:center;overflow:hidden}
.lp-hero-media{position:absolute;inset:0;z-index:0}
.lp-hero-media img{width:100%;height:100%;object-fit:cover;object-position:28% 50%}
.lp-hero-ph{width:100%;height:100%;display:grid;place-items:center;text-align:center;color:#fff;
  font-family:"El Messiri";font-weight:600;
  background:linear-gradient(120deg,#0a5668,#0b7b78 45%,#d9a166)}
.lp-hero-ov{position:absolute;inset:0;background:linear-gradient(to left, rgba(0,40,52,.74), rgba(0,40,52,.22) 58%, rgba(0,40,52,.04))}
.lp-hero-inner{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:60px 24px;width:100%}
.lp-hero .lp-eyebrow{color:#9ff0ec}
.lp-head{font-family:"El Messiri";font-weight:700;color:#fff;
  font-size:clamp(28px,5.4vw,48px);line-height:1.28;letter-spacing:-.4px;max-width:620px;margin:6px 0 0;
  text-shadow:0 2px 20px rgba(0,30,40,.3)}
.lp-support{color:rgba(255,255,255,.9);font-size:clamp(15.5px,3.2vw,19px);max-width:460px;margin:18px 0 26px;line-height:1.85}

/* split editorial section */
.lp-split{display:grid;grid-template-columns:1fr 1fr;gap:38px;align-items:center}
.lp-split.rev{direction:ltr}
.lp-split.rev>*{direction:rtl}
.lp-split-media .imgslot{aspect-ratio:4/3}
@media(max-width:760px){.lp-split{grid-template-columns:1fr;gap:22px}.lp-split-media{order:-1}}

/* band image */
.lp-band .imgslot{aspect-ratio:16/6;min-height:150px}

/* grids + cards */
.lp-grid{display:grid;gap:18px;margin-top:12px}
.lp-grid.two{grid-template-columns:repeat(2,1fr)}
.lp-grid.three{grid-template-columns:repeat(3,1fr)}
@media(max-width:880px){.lp-grid.three{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.lp-grid.two,.lp-grid.three{grid-template-columns:1fr}}
.lp-card,.lp-obj,.lp-case,.lp-bonus{background:var(--card);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--sh-soft)}
.lp-card,.lp-obj{padding:22px 20px}
.lp-card h3,.lp-obj h3,.lp-case h3,.lp-bonus-body h3{font-family:"El Messiri";font-weight:700;color:var(--sea);font-size:17px;margin:0 0 9px}
.lp-card p,.lp-obj p,.lp-case p{font-size:14px;color:var(--ink-soft);margin:0 0 9px;line-height:1.85}
.lp-card p:last-child,.lp-obj p:last-child,.lp-case p:last-child{margin-bottom:0}

/* numbered steps */
.lp-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:24px}
@media(max-width:820px){.lp-steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.lp-steps{grid-template-columns:1fr}}
.lp-step{position:relative;padding-top:14px}
.lp-step .num{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(0,140,149,.12);color:var(--teal);font-family:"El Messiri";font-weight:700;font-size:19px;margin-bottom:12px}
.lp-step h3{font-family:"El Messiri";font-weight:700;color:var(--sea);font-size:16.5px;margin:0 0 8px;line-height:1.4}
.lp-step p{font-size:13.5px;color:var(--ink-soft);margin:0;line-height:1.8}
.lp-stepnote{color:var(--teal);font-weight:600;margin-top:10px;font-size:13.5px}

/* benefits */
.lp-checks{list-style:none;padding:0;margin:20px 0;display:grid;gap:13px}
.lp-checks li{display:flex;align-items:flex-start;gap:11px;font-size:15.5px;color:var(--ink)}
.lp-checks svg{width:19px;height:19px;flex:none;margin-top:4px;stroke:var(--teal)}

/* offer */
.lp-offerlead{max-width:600px;margin:0 auto 26px;text-align:center}
/* first-batch scarcity callout, above the offer card */
.lp-limited{max-width:600px;margin:44px auto 28px;text-align:center;
  background:var(--hi);border:1px solid #BFE1E3;border-radius:12px;padding:20px 22px}
.lp-limited h3{font-family:"El Messiri";font-weight:700;color:var(--sea);font-size:17px;margin:0 0 10px;
  display:inline-flex;align-items:center;gap:9px}
.lp-limited h3::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.lp-limited p{font-size:14px;color:var(--ink-soft);margin:0 0 8px;line-height:1.8}
.lp-limited p:last-child{margin-bottom:0}
.lp-price{max-width:500px;margin:0 auto;text-align:center;border-radius:16px;padding:28px 24px;color:#fff;
  background:linear-gradient(165deg,var(--sea),var(--sea-deep))}
.lp-price-num{font-family:"El Messiri";font-weight:700;color:#fff;font-size:clamp(30px,6vw,40px);line-height:1}

/* ============================================================

   ============================================================ */
function renderQuestion(){
  const q = QUESTIONS[state.idx-1];
  const pct = (state.idx/15)*100;
  const s = el('section','screen');
  s.innerHTML = `
    ${brandHeader()}
    ${imgSlot('Q_IMAGE','لحظة يومية بين الأم وطفلها','q-img')}
    <div class="qhead">

    <h2 class="qtext">${q.text}</h2>
    <div class="opts" id="opts"></div>
    <div id="free-slot"></div>
    <div class="nav">
      <button class="btn btn-teal" id="next-btn" disabled>${state.idx===15?UI.submit:UI.next}${SVG.arrow}</button>
      ${state.idx>1?`<button class="btn btn-ghost" id="back-btn">${SVG.arrow}${UI.back}</button>`:'<span class="spacer"></span>'}
    </div>
    ${WAVES}`;
  mount(s);

  const optsBox = $('#opts');
  const current = state.answers[q.n];

  if(q.type==='free'){
    optsBox.style.display='none';
    renderFreeOnly(q, current);
  } else {
    Object.entries(q.opts).forEach(([k,t])=>{
      const o = el('div','opt');
      o.innerHTML = `<span class="mk">${SVG.check}</span><span class="ot">${t}</span>`;
      const selKey = typeof current==='object'&&current? current.k : current;
      if(selKey===k) o.classList.add('sel');
      o.addEventListener('click',()=> selectOpt(q,k,o));
      optsBox.appendChild(o);
    });
    if(q.gFree && typeof current==='object' && current && current.k==='G'){ showGField(q, current.text||''); }
  }
  if(isAnswered(q)) $('#next-btn').removeAttribute('disabled');
  if(state.idx>1) $('#back-btn').addEventListener('click', onBack);
  $('#next-btn').addEventListener('click', onNext);
  observeReveals();
}

function selectOpt(q,k,node){
  $('#opts').querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  node.classList.add('sel');
  if(q.gFree && k==='G'){
    const prev = (typeof state.answers[q.n]==='object'&&state.answers[q.n])?state.answers[q.n].text||'':'';
    state.answers[q.n] = {k:'G', text:prev};
    showGField(q, prev);
  } else { state.answers[q.n] = k; removeGField(); }
  if(isAnswered(q)) $('#next-btn').removeAttribute('disabled');
  else $('#next-btn').setAttribute('disabled','');
}

function showGField(q, val){
  removeGField();
  const wrap = el('div','freewrap'); wrap.id='g-wrap';
  wrap.innerHTML = `<div class="field"><label>${q.gPrompt}</label><textarea id="g-text" placeholder="">${escapeHtml(val)}</textarea></div>`;
  $('#free-slot').appendChild(wrap);
  const ta = $('#g-text'); ta.focus();
  ta.addEventListener('input',()=>{
    state.answers[q.n] = {k:'G', text:ta.value.trim()};
    $('#next-btn').toggleAttribute('disabled', ta.value.trim().length===0);
  });
}
function removeGField(){ const g=$('#g-wrap'); if(g)g.remove(); }

function renderFreeOnly(q, current){
  const slot = $('#free-slot');
  slot.innerHTML = `
    <p class="qsupport">${q.support}</p>
    <div class="field"><textarea id="free-text" placeholder="${escapeHtml(q.placeholder)}">${escapeHtml(current||'')}</textarea></div>`;
  const ta = $('#free-text');
  $('#next-btn').removeAttribute('disabled');
  ta.addEventListener('input',()=>{ state.answers[q.n] = ta.value.trim(); });
}

function isAnswered(q){
  const a = state.answers[q.n];
  if(q.type==='free') return true;
  if(q.gFree && typeof a==='object' && a) return a.k==='G' ? (a.text||'').length>0 : true;
  return a!=null && a!=='';
}

function onNext(){
  const q = QUESTIONS[state.idx-1];
  if(q.type==='free'){ const ta=$('#free-text'); if(ta) state.answers[q.n]=ta.value.trim(); }
  if(state.idx===15){ finish(); return; }
  state.idx++; renderQuestion(); window.scrollTo({top:0,behavior:'instant'});
}
function onBack(){ state.idx--; renderQuestion(); window.scrollTo({top:0,behavior:'instant'}); }

/* ============================================================
   RESULTS LOGIC
   ============================================================ */
function computeResults(){
  const a = state.answers;
  const dimQ = [[1,2,3,8],[4,5,7,9],[6,10,11,12]];
  const dims = dimQ.map(qs=> qs.reduce((sum,n)=> sum + (SCORE[a[n]]??0), 0));
  const total = dims.reduce((s,x)=>s+x,0);
  const profile = total<=12?0 : total<=24?1 : 2;
  const max = Math.max(...dims);
  const strongest = dims.map((d,i)=> d===max?i:-1).filter(i=>i>=0);
  const q13 = a[13];
  const q13map = {A:0,B:1,C:2,D:2,E:null}[q13];
  const min = Math.min(...dims);
  let primary = dims.indexOf(min);
  if(q13map!=null){
    const statedIsTopWithRoomBelow = (dims[q13map]===max && min < dims[q13map]);
    if(!statedIsTopWithRoomBelow) primary = q13map;
  }
  const q14 = a[14];
  const sitKey = typeof q14==='object' && q14 ? q14.k : q14;
  const sitFree = (typeof q14==='object' && q14) ? (q14.text||'') : '';
  return {dims,total,profile,strongest,primary,sitKey,sitFree,q13,q15:(a[15]||'').trim()};
}

function sendToSheet(payload){
  if(!CONFIG.endpoint) return;
  try{
    fetch(CONFIG.endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload),keepalive:true}).catch(()=>{});
  }catch(e){}
}
function sendResults(r){
  if(state.sent) return; state.sent = true;
  const a = state.answers, q14 = a[14];
  sendToSheet({
    action:'complete', status:'completed', optin:state.optin,
    id:state.id, name:state.name, email:state.email, completedAt:new Date().toISOString(),
    q1:a[1]||'',q2:a[2]||'',q3:a[3]||'',q4:a[4]||'',q5:a[5]||'',q6:a[6]||'',
    q7:a[7]||'',q8:a[8]||'',q9:a[9]||'',q10:a[10]||'',q11:a[11]||'',q12:a[12]||'',
    q13:a[13]||'', q14:(typeof q14==='object'&&q14)?q14.k:(q14||''),
    q14_other:(typeof q14==='object'&&q14)?(q14.text||''):'', q15:(a[15]||'').trim(),
    dim1:r.dims[0], dim2:r.dims[1], dim3:r.dims[2], total:r.total,

}

function mount(node){ app.innerHTML=''; app.appendChild(node); }
let io;
function observeReveals(){
  const items = [...document.querySelectorAll('.reveal:not(.in)')];
  if(!('IntersectionObserver' in window)){ items.forEach(r=>r.classList.add('in')); return; }
  if(io) io.disconnect();
  io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{threshold:0, rootMargin:'0px 0px -10% 0px'});
  items.forEach((it,i)=>{ it.style.transitionDelay = Math.min((i%5)*60,240)+'ms'; io.observe(it); });
}

function lpResolve(sitKey, lowestDim, profile){

        <p class="lp-p lp-maxp">مصممة للأم اللي تبغى مستوى توجيه أعمق وأكثر استجابة لاحتياج طفلها. تنظر الخطة لطفلك ككل، مع التركيز على مجال رئيسي واحد في كل مرة.</p>
        <p class="lp-p lp-maxp">ما فيه تكديس مهام. ما فيه خطة جامدة. وما تحتاجي تبدئي من الصفر كل أسبوعين.</p>
      </div>
      <h3 class="lp-sub lp-center">ايش يشمل اشتراكك؟</h3>
      <div class="lp-grid three">${includes.map(([t,d])=>`<div class="lp-card"><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>
      <div class="lp-limited">
        <h3>الدفعة الأولى تستقبل ١٠ أمهات فقط</h3>
        <p>الخطة الحية مو خدمة جماعية بخطة وحدة للجميع. كل أم تحصل على توجيه مخصص ومراجعة وتعديلات تناسب استجابة طفلها.</p>
        <p>عشان أقدر أتابع كل أسرة وأطوّر خطتها باهتمام، الدفعة الأولى تستقبل ١٠ أمهات فقط.</p>
      </div>
      <div class="lp-price">
        <div class="lp-price-num">٧٤٩<span> ريال / الشهر</span></div>
        <p>توجيه مخصص، وخطة تتجدد كل أسبوعين بناءً على ملاحظاتك واستجابة طفلك.</p>
        <p>مسار يتطور مع طفلك، وأنتِ مو مضطرة ترتبيه كل شي بنفسك.</p>
        ${cta()}
      </div>
    </div></section>

    <section class="lp-sec reveal"><div class="lp-wrap">
      <h2 class="lp-h lp-center">قصص من تجارب سابقة</h2>
      <p class="lp-p lp-center lp-maxp">لما نفهم الموقف كامل، تتضح لنا خطوات مختلفة.</p>
      <div class="lp-grid three">
        <article class="lp-case">
          <h3>الولد الغاضب</h3>
          <p>تواصلت معي أم تقول إن ولدها دايم معصّب، ويقول كلام مو حلو، وما يهدأ بسهولة.</p>
          <p>بدل ما نركز على التصرف وحده، سألتها عن يومه كامل: روتينه، واللي يصير حوله، والمواقف اللي يمر فيها.</p>
          <p>من خلال التفاصيل، اتضح لنا إن الحساسية والضغط جزء مهم من الصورة اللي نحتاج نفهمها.</p>
          <p>بنينا خطة تناسب احتياجه، وبعد أسبوعين رجعت الأم وقالت:</p>
          <blockquote>كان يصحى معصب كل يوم. هالأسبوع صحى معصب مرة وحدة.</blockquote>
          <p>التغيير اللي لاحظته الأم خلال هالفترة أعطانا ملاحظات مهمة نبني عليها الخطوة التالية.</p>
        </article>
        <article class="lp-case">
          <h3>التواصل</h3>
          <p>أم شافت أحد منشوراتي وتواصلت معي عن طفلها.</p>
          <p>من التفاصيل اللي شاركتها، بان إن التواصل مجال يحتاج دعم. بدأنا بخطة تواصل تناسب احتياجه.</p>
          <p>بعد أسبوعين، رجعت الأم وقالت إن سلوكيات جديدة بدأت تظهر.</p>
          <p>لما تكون عندك خطوات مخصصة، تصير ملاحظاتك عن طفلك جزء من فهم الخطوة التالية.</p>
        </article>
        <article class="lp-case">
          <h3>الأكل</h3>
          <p>كانت قائمة الأكل اللي يتقبلها الطفل قصيرة، وكان يرفض الأصناف الثانية.</p>
          <p>قبل ما نحدد الخطوات، سألت الأم أسئلة إضافية عشان نفهم العوامل المرتبطة بالأكل ونتجنب تجاهل احتياجات أخرى مهمة.</p>
          <p>ركزنا على إدخال أصناف جديدة بالتدريج، مع الحفاظ على الأطعمة اللي يتقبلها الطفل ضمن قائمته الآمنة.</p>
          <p>التركيز مو على إجبار الطفل على التغيير، هو بناء خطوات تراعي احتياجه وتسمح لنا بملاحظة استجابته.</p>
        </article>
      </div>
    </div></section>

    <section class="lp-sec lp-alt reveal"><div class="lp-wrap">
      <h2 class="lp-h lp-center">ومع الخطة، عندك أدوات تساعدك تبدئي</h2>
      <div class="lp-grid two">
        <article class="lp-bonus">
          <div class="lp-bonus-img"><img src="${IMAGES.CANDLE}" alt="خريطة نقطة البداية"></div>
          <div class="lp-bonus-body"><h3>خريطة نقطة البداية</h3><p>تساعدك تشوفي من وين تبدئي، وتوجهي انتباهك للخطوة الأكثر أهمية بدل محاولة معالجة كل شيء مرة واحدة.</p></div>
        </article>
        <article class="lp-bonus">
          <div class="lp-bonus-img"><img src="${IMAGES.COMMUNITY}" alt="مجتمع واتساب"></div>
          <div class="lp-bonus-body"><h3>مجتمع واتساب</h3><p>مساحة للتواصل والشعور إنك مو وحدك في رحلتك، مع أمهات يمرّوا بتجارب وتحديات يومية مشابهة.</p></div>
        </article>
      </div>
    </div></section>

    <section class="lp-sec reveal"><div class="lp-wrap">
      <h2 class="lp-h lp-center">يمكن هذا اللي يدور في بالك…</h2>
      <div class="lp-grid two">
        <article class="lp-obj">
          <h3>ما عندي وقت</h3>
          <p>أنتِ تقرأي هذي الصفحة، وطفلك يناديك، وجوالك مليان رسائل، وفيه أشياء ثانية تنتظرك. آخر شيء تحتاجيه هو خطة تضيف لك قائمة مهام جديدة.</p>
          <p>الخطة الحية تندمج في اللحظات اللي تعيشيها:</p>
          <ul class="lp-mini"><li>وقت السناك.</li><li>أثناء اللعب.</li><li>في الروتين اللي يتكرر كل يوم.</li></ul>
          <p>بدون أوراق عمل ولا مكتب ولا انتظار لين تصير الحياة هادية. وكل أسبوعين، تراجعي اللي صار مع توجيه مخصص يساعدك تحددي الخطوة التالية.</p>
          <p>مو مطلوب منك تفضّي حياتك عشان تبدئي.</p>
        </article>
        <article class="lp-obj">
          <h3>الفترة هذي نحاول نرتّب مصاريفنا</h3>
          <p>من حقك تعرفي ايش يستحق المبلغ اللي تدفعيه، خصوصًا لما تكون عندك التزامات كثيرة.</p>
          <p>الخطة الحية مو اشتراك لمكتبة نصايح، ولا خطة وحدة تستلميها وبعدها تسوي كل شيء لوحدك. أنتِ تدفعي مقابل توجيه مخصص يتطور مع طفلك.</p>
          <p>كل أسبوعين، نراجع ملاحظاتك، ونقيّم استجابة طفلك، ونعدّل الخطة بناءً على اللي يظهر خلال التطبيق. بدل ما تجمعي نصايح متفرقة وتحاولي ترتبيها بنفسك، يكون عندك مسار واضح ومتابعة مستمرة.</p>
          <p>الاشتراك الشهري ٧٤٩ ريال. خذي قرارك بعد ما تعرفي بالضبط ايش يشمل الاشتراك وكيف يشتغل.</p>
        </article>
        <article class="lp-obj">
          <h3>طيب… ولو ما ضبط؟</h3>
          <p>جربتي قبل كذا، وتمنيتي إن المرة هذي تكون مختلفة. ولما رجع نفس الموقف، رجعتي تدوري على طريقة ثانية، ونصيحة ثانية، وبداية جديدة.</p>
          <p>الخطة الحية مو وعد إن كل خطوة بتنجح من أول مرة. الفرق إنك مو مضطرة تكملي على نفس الطريقة إذا ما ناسبت طفلك.</p>
          <p>كل أسبوعين، نراجع اللي لاحظتيه، ونشوف ايش يحتاج تعديل، ونبني الخطة التالية على استجابة طفلك. إذا كان فيه تقدم، نحدد كيف نبني عليه. وإذا احتاجت الطريقة تغيير، نعدّلها.</p>
          <p>بدل ما تعيدي المحاولة بنفسك كل مرة، عندك مسار يتطور مع اللي تتعلميه عن طفلك.</p>
        </article>
        <article class="lp-obj">
          <h3>هل أنا السبب؟</h3>
          <p>لما نفس الموقف يتكرر، تبدأ الأسئلة: ليش ما عرفت أتصرف؟ ليش النصيحة اللي نفعت مع غيره ما نفعت مع طفلي؟ وايش المفروض أسوي بشكل مختلف؟</p>
          <p>تكرار الموقف مو دليل إنك أم مقصّرة. معرفة طفلك مهمة، لكن تحويل ملاحظاتك إلى خطوات واضحة يحتاج ترتيب وتوجيه.</p>
          <p>الخطة الحية تساعدك تفهمي الأنماط، وتحددي أولوية وحدة، وتطبقي خطوات تناسب حياتكم، ثم تراجعي اللي صار كل أسبوعين.</p>
          <p>مو مطلوب منك تعرفي كل شي. المطلوب يكون عندك مسار يساعدك تحددي الخطوة التالية.</p>
        </article>
        <article class="lp-obj">
          <h3>أحتاج أتكلم مع زوجي قبل ما أقرر</h3>
          <p>أنتِ شايفة إنكم تحتاجوا طريقة أوضح، لكن زوجك مو مقتنع بنفس الدرجة. وما تبغي الموضوع يتحول لجدال طويل حول مين الصح.</p>
          <p>بدل ما يكون النقاش عن وجهات النظر، خليه عن الخطوات اللي تطبقوها في حياتكم اليومية. الخطة الحية تعطيك مسار واضح تشتغلي عليه، مع مراجعة منتظمة للملاحظات والتغييرات اللي تصير مع طفلك.</p>
          <p>اللي تتعلميه من التجربة يساعدك تشرحي ايش جربتي، وايش لاحظتي، وايش تحتاجوا تعدّلو. مو المطلوب تكسبِي جدال. المطلوب تلاقي طريقة عملية تدعم طفلكم.</p>
        </article>
        <article class="lp-obj">
          <h3>السعر مبالغ فيه</h3>
          <p>٧٤٩ ريال كل شهر مو مبلغ بسيط، ومن حقك تعرفي ايش راح تاخذي مقابله.</p>
          <p>الخطة الحية مو مجرد ملف فيه خطوات عامة، ولا خطة تستلميها مرة وحدة وتواجهي بعدها التحديات لوحدك. اشتراكك يشمل فهم أوسع لاحتياج طفلك، وخطة شخصية، ومراجعة تفاعلية كل أسبوعين، وتعديلات مستمرة بناء على ملاحظاتك واستجابة طفلك.</p>
          <p>أنتِ ما تدفعي مقابل خطة ثابتة. أنتِ تدفعي مقابل توجيه مخصص يتطور مع طفلك. إذا هي هذه المتابعة اللي تحتاجيها، فهذي هي القيمة اللي تقدري تقيّميها مقابل السعر.</p>
          <p>وإذا كان خارج ميزانيتك حاليًا، خذي قرارك بدون ضغط. المهم تعرفي بالضبط ايش يشمل الاشتراك قبل ما تلتزمي فيه.</p>
        </article>
      </div>
    </div></section>

    <section class="lp-final reveal">
      <div class="lp-final-media">
        ${IMAGES.FINAL_CTA_IMAGE ? `<img src="${IMAGES.FINAL_CTA_IMAGE}" alt="أم وطفلها أمام نافذة عند الغروب">` : `<div class="lp-final-ph"></div>`}
        <div class="lp-final-ov"></div>
      </div>
      <div class="lp-final-in reveal">
        <h2 class="lp-h">ابدئي من الموقف اللي يشغلك الآن</h2>
        <p>مو مطلوب منك تحلي كل التحديات مرة وحدة. ابدئي بالموقف اللي تبغي يتغير، وخذي خطوة باتجاه خطة أوضح تناسب طفلك وحياتكم.</p>
        <p>الخطة الحية توجيه مخصص، وخطوات تتطور مع طفلك.</p>
        <div style="margin-top:22px">${cta('on-photo')}</div>
      </div>
    </section>

    <section class="lp-sec reveal" id="lp-faq"><div class="lp-wrap lp-narrow">
      <h2 class="lp-h lp-center">الأسئلة الشائعة</h2>
      <div class="lp-faq">${faqs.map(([q,a])=>`<details><summary>${q}</summary><div class="lp-ans"><p>${a}</p></div></details>`).join('')}</div>
    </div></section>

    <footer class="lp-foot"><span>مدار البيت</span></footer>
  </div>`;
}

// Email opt-in now lives on the results page (default: yes). Update the row if she toggles it.
function wireOptin(){
  const cb = document.getElementById('in-optin');
  if(!cb) return;
  cb.addEventListener('change', ()=>{
    state.optin = cb.checked;
    if(state.id) sendToSheet({action:'event', id:state.id, optin:state.optin});
  });
}

// Fire-and-forget interest signals (one per person), patched onto her row by id.
function pingLivingPlan(){
  if(state.lpPinged || !state.id) return; state.lpPinged = true;
  sendToSheet({action:'event', id:state.id, clicked_living_plan:true, living_plan_at:new Date().toISOString()});
}
function pingWaitlist(){
  if(state.wlPinged || !state.id) return; state.wlPinged = true;
  sendToSheet({action:'event', id:state.id, clicked_waitlist:true, waitlist_click_at:new Date().toISOString()});
}

function wireLanding(){
  document.querySelectorAll('.lp-cta').forEach(a=>{
    a.addEventListener('click', e=>{
      pingWaitlist();
      if(!CONFIG.waitlistUrl){
        e.preventDefault();
        const n = document.getElementById('lp-ownernote');
        if(n){ n.style.display='block'; n.scrollIntoView({behavior:'smooth',block:'center'}); }
      }
    });
  });
  const b = document.getElementById('lp-btn');
  if(b) b.addEventListener('click', e=>{
    e.preventDefault();
    pingLivingPlan();
    const rv = document.getElementById('result-view');
    const lp = document.getElementById('lp-landing');
    if(rv) rv.style.display = 'none';
    if(lp) lp.style.display = 'block';
    window.scrollTo(0,0);
    observeReveals();
  });
}

/* Landing-only entry (email link): render the landing directly, fixed headline. */
function renderLandingOnly(){
  const s = el('section');
  s.innerHTML = landingHTML(null, null, null, {head:STANDALONE_HEAD, support:STANDALONE_SUB});
  mount(s);
  const lp = document.getElementById('lp-landing');
  if(lp) lp.style.display = 'block';
  wireLanding();
  observeReveals();
  window.scrollTo(0,0);
}

/* boot: "?plan" on the web address opens straight to the landing (email link);
   anything else shows the assessment. One file serves both. */
let wantsLanding = STANDALONE_LANDING;
try{ if(new URLSearchParams(location.search).has('plan')) wantsLanding = true; }catch(e){}
if(wantsLanding) renderLandingOnly(); else renderWelcome();
</script>
