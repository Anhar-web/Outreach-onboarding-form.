/* Layout: one calm centred column, an agency's internal run sheet. Stepper on top, the selected step as the hero card, then team, scorecard, concepts, posts, performance. */

<script>
window.__STATE__ = {"project": "Home Orbit — Batch 4 (Nov 2026)", "updatedAt": "2026-11-24T15:58:40.429180+00:00", "currentStep": 3, "steps": [{"n": 1, "key": "brief", "title": "Brief", "subtitle": "The Analyst reads Batch 3 and the legacy posts; the Strategist turns it into the Batch 4 brief.", "status": "done", "idea": {"title": "Decide the job before the post", "body": "Most content fails because nobody decided what it was for."}, "action": {"label": "Read the analysis and the brief, answer the three questions, then confirm.", "phrase": "Looks right. Next step."}, "report": "## Part 1 · What's working (Analyst)\nSources read in full: Legacy Posts (25 rows), Feedback & Lessons (all 200 rules), Batches, Posts (34), Post Performance (37), Conversion Windows, Formats, Visual Style, the assessment base (Submissions 19 rows, Visits 4 rows, non-personal fields only), and every file in `app/b4/`.\n\n### Reach: three batches against her legacy\n| | Legacy (25) | B1 (10) | B2 (12) | B3 (12) |\n|---|---|---|---|---|\n| Median views | **3,679** | ~450 | ~530 | ~510 |\n| Posts over 1K | **24 of 25** | 2 | 4 | 2 |\n| Slides | **4.3** | 7–9 | 7.8 | 7.6 |\n| Words per line beat | **3.3** | n/a | 7.1 | 7.4 |\n| Share of slides viewed | **48–63%** | ~30% | ~30–40% | 19–44% |\n\nSmall correction to the handoff: the legacy median is 3,679 (the 13th of 25), not ~3.4K.\n\n**B3 day 1, ranked:** ملكة 1,729 · جمعة 1,008 · jacket 948 · nails 587 · biscuit 579 · hand dryer 552 · \"no\" 469 · checkout 450 · ride 442 · tower 416 · fast food 413 · losing game 378. Total ~7,970.\n\n### The reusable pattern (legacy + B1–B3 agree)\n1. **People in the scene who say something.** Every B3 post that got past the test audience had relatives talking (ملكة, جمعة, jacket). Public places with nobody reacting stalled 4 of 4 (checkout, ride, fast food, dryer). 4 of the 6 legacy breakouts have witnesses with lines (grandma's 203K, restaurant 39.5K, wall 16.8K, coffee shop 13.4K).\n2. **The cost lands on her, in the first lines.** «والمشكله؟ أنت الطرف الخاسر» (159K), «فريق إنقاذ… لوحدك» (39.5K), and our own B1–B2 winners. Hooks that end on his behaviour stalled («وبدأ الصراخ», losing game, ride). «ما تقدري… إلا» is 0 of 4 and retired.\n3. **Short beats and short posts.** Legacy says almost the same number of words in half the slides, at 3.3 words a beat with «…» pauses, and gets about twice the share of slides viewed. Ours read like instructions. Since slide-view share is a likely reach signal on TikTok photo posts, 7–8-slide posts are probably costing us distribution on their own.\n4. **One tool that sounds like a trick, named and shown in action.** The wrong shoe, the last push, the traffic-light game. Sensible checklists got 1–2K.\n5. **Humour that watches one detail, on her.** «صبرك طلع إجازة», the barista «كأنها شافت جريمة». Acting out the child's drama (bath, car seat) felt cringy and stalled at 3–6K.\n6. **The ending surprises her.** The coffee-shop confession («بعد ١٢ جزمة… تقربي ترمي نفسك على الأرض معاه») is the model twist: a laugh at herself, not a reframe.\n7. **Universal or strange-but-common moments beat narrow ones.** Leaving grandma's, the diaper, licking the wall. Narrow moments (drawers, the shouting post, outfits) got 0.9–3.9K even in her voice.\n\n**Things that are not the driver:** format labels (F7 and F8 each went 1 of 3, and the winner was always the family scene), and A/B polls (they sit on winners and flops alike).\n\n**The fade inside B3.** The first 6 posts averaged 878 views and the last 6 averaged 451, including the two posted alone on clean evenings. Weaker topics (home, no witnesses) plus one teal look 12 times in a row is the likeliest cause. That backs the visual refresh.\n\n### Business (the funnel)\n| | B1 | B2 | B3 |\n|---|---|---|---|\n| Views (day 1, sum) | ~11.3K | ~14.3K | ~7.97K |\n| Completed assessments | 0 | **9** | 2 |\n| Views per completion | n/a | ~1.6K | **~4K** |\n| Waitlist joins | 0 | 0 | 0 |\n\n- **Completions follow reach plus a CTA that gets seen.** B1's reach posts had no CTA and got 0. B2 had both, and 5 of its 9 came within 19 hours of the hair-wash post. B3 had the CTA but little reach.\n- **Emotions and outbursts lead, across all 19 completions ever:** Q14 = F for 8 (42%), sleep 5, communication 2, food 2, outings 1, other 1. Both B3 completions were F.\n- **The leak after the assessment is the bigger business problem.** Of 19 mothers who completed, 8 clicked \"learn more about the Living Plan\", 2 clicked the waitlist button (both in October), and **0 have ever joined**. Since November, 6 Living Plan clicks led to 0 waitlist clicks. Content can't fix that alone. The odd-post QR codes (straight to the `?focus=` landing page) will show whether the landing route does better than the assessment route.\n- **Comments:** 1 in all of B3. The one-word prompts («شيالة», «حارسة الباب») got 0. Only a question about her own child's preference has ever worked (wall post, 75 comments). Comments stay a minor signal (rule: zero comments isn't a failure).\n- **Shares mark the posts people pass on:** \"no\" 4, ملكة/جمعة/jacket 3 each. In legacy, shares were the breakout marker (diaper 1,598, grandma's 1,106).\n\n### Tracking check (Q12 / last_q)\n- ✅ **last_q is fixed.** The Nov 24 completion (15:08 Saudi time) now reads **last_q = 15**. The handoff recorded 12.\n- ✅ **A visit links to its submission.** That visit's session_id matches the Submissions id, so post tags will carry through from scan to completion.\n- ✅ **The bio link is tagged.** Three visits on Nov 24 arrived with `src=bio`.\n- ⚠️ **No partial start has ever been logged.** All 19 rows are `completed`, and only the newest has startedAt and last_q (the fields are new). Drop-off analysis only works if a mother who quits at Q5 still leaves a row with `status = started, last_q = 5`. **Please run one test:** open the assessment, answer about 5 questions, close the tab, and check that a row appears. Then delete it.\n- ⚠️ **Three `src=bio` visits arrived within 17 seconds** (Nov 24, 18:18:50 → 18:19:07 Saudi time), each as a separate session, and none started the assessment. If that was you testing the new bio link, fine, and we can delete them. If it was one phone tapping the link three times, the \"one per phone per session\" dedupe isn't holding (TikTok's in-app browser may open a fresh session each tap), and visit counts per post will be inflated. Worth one check: tap the bio link twice from TikTok on one phone and see whether one or two rows appear.\n- ℹ️ **No QR scans yet.** That's expected, since no B4 posts are live.\n\n### Three instructions for this brief\n1. **Every post opens on a moment with people reacting, with lines (or a universal or strange-but-common moment), and the cost on her.** At least 8 of 12.\n2. **Write in her legacy voice, at legacy length:** 4–5 slides for one tool, 6 at most, and the tool on slide 3.\n3. **Measure the post past the view:** a per-post QR code, the Visits and Submissions tags, and an alternating landing vs assessment route, so we finally learn which post sends mothers, and which route turns them into waitlist joins.\n\n---\n\n## Part 2 · Batch 4 brief (for you to confirm)\nBuilt on the draft in `app/b4/step1_report.md`, with the Part 2b revisions and every Batch 4 decision in the handoff. Where the draft and the handoff differ, the handoff wins (4–5 / 6 slides, two posts a day, alternating QR routes).\n\n**The job.** Breakouts that send mothers through a per-post QR code. Every post gives real value first, and the only ask is at the end. There's no attention vs conversion split.\n\n**Audience.** A cold Saudi mother of a young child whose behaviour she's trying to handle. She doesn't know Home Orbit. We describe what she sees, never a diagnosis.\n\n**Win, in order:**\n1. Per-post QR visits, starts, completions, Living Plan clicks and waitlist joins (Visits and Submissions, by `post` tag).\n2. Shares, saves, share of slides viewed.\n3. Views. Comments count least.\n\n**Size and cadence.** 12 static carousels over 6 evenings, two a day: one about 7:00 PM, the next 8:00–8:30 PM, never minutes apart.\n\n### Voice (her legacy voice is the default)\n- **Short beats** of 2–5 words, one idea a line, «…» pauses.\n- **The opening:** a stamp («في المطعم…»), then the calm-vs-her turn («وأنتي؟»), then call-and-response («تحاولي… هو…»), then «وفجأة».\n- **2–4 real quoted lines** from the people around her, plus her inner voice.\n- **ONE comic image** casting HER in an adult role, at most one about the child, and never acted-out drama.\n- **One love line** that clears her.\n- **The tool** has a name in quotes and is shown working in 2–3 beats.\n- **The ending** is a playful confession, then the CTA.\n- **First person is allowed** («خليني أوريك», «قوليلي», «بيننا»). \"We\" parents stays banned.\n- **Still banned:** «طبيعي», brain or nervous-system lines, emoji bullets, medical disclaimers, acting out his drama, homework endings, \"follow for part 2\".\n- **Long sentences only in the final CTA** and in checklist items.\n- **All 200 Feedback & Lessons rules still apply.** That covers her word list, «عشان» not «كذا», «خطوة», «يبكي», straight quotes for spoken lines, no line ending in a comma, and the realism checks.\n\n### Structure (Part O)\n- **One tool, 4–5 slides:** hook (pain + her cost) → deepen → **the tool on slide 3** → proof (our method described, never testimonials; it can carry the explainer) → twist + CTA + QR.\n- **Three steps, 6 slides at most:** hook → deepen → steps → proof → twist + CTA + QR.\n- **No ask before the last slide.** An optional \"keep reading\" line on 6-slide posts only, as a promise that asks nothing of her.\n\n### Slate (12)\n| Group | Count | Notes |\n|---|---|---|\n| **«الافتراض اللي يصعّب الموضوع»** (her 200K format) | 4 | A new on-brand look, fewer words per slide, 5–6 slides, no translucent box |\n| One tool | 5 | 4–5 slides |\n| Three steps | 3 | 6 slides |\n\n**Proposed slot plan.** Topics come after Research; the slots below fix the tests so they're spread fairly.\n\n| Post | Evening | Group | QR route | Tests |\n|---|---|---|---|---|\n| b4p1 | 1 · 7:00 | Fallacy | `?focus=` | **Cream text-only slide 1** |\n| b4p2 | 1 · 8:15 | One tool | assessment | Comment prompt |\n| b4p3 | 2 · 7:00 | Three steps | `?focus=` | \"Keep reading\" line |\n| b4p4 | 2 · 8:15 | Fallacy | assessment | Comment prompt |\n| b4p5 | 3 · 7:00 | One tool | `?focus=` | **Cream text-only slide 1** |\n| b4p6 | 3 · 8:15 | One tool | assessment | **Problem + solution hook** |\n| b4p7 | 4 · 7:00 | Fallacy | `?focus=` | Comment prompt |\n| b4p8 | 4 · 8:15 | Three steps | assessment | No \"keep reading\" (control) |\n| b4p9 | 5 · 7:00 | One tool (**bedtime**) | `?focus=sleep` | Comment prompt |\n| b4p10 | 5 · 8:15 | Fallacy | assessment | **Problem + solution hook** |\n| b4p11 | 6 · 7:00 | Three steps | `?focus=` | \"Keep reading\" line + comment prompt |\n| b4p12 | 6 · 8:15 | One tool | assessment | Comment prompt |\n\n- **Cream** goes only on first-of-evening posts (clean timing), compared with dark first-of-evening posts.\n- **Comment prompts:** 6 with, 6 without, each a one-word question about HER child's preference, tied to the tool.\n- **The samples are tiny** (2 vs 2, 2 vs 1). These tests point a direction; they don't prove it.\n\n### Topics\n- **At least 8 of 12** have people reacting with lines in the scene (relatives, guests, the teacher, staff, strangers), or a universal or strange-but-common moment.\n- **Emotions and outbursts lead:** about 5 of 12, routed to `?focus=emotions` where odd.\n- **1 bedtime post.**\n- **A few legacy topics with a genuinely new moment or tool,** the rest new. No repeats of B1–B3 topics.\n\n**Starting pool for Research to test (English; not hooks):**\n- **Emotions:** a cousin blows out the birthday candles and he falls apart · he opens a gift in front of the giver: «ما أبغاه» · the teacher says \"an angel today\" and he explodes in the car (legacy L12, new tool) · he hits a cousin over a toy at grandma's while the aunt watches · floor drop in the toy aisle with strangers (L18 family, new place)\n- **Strange but common:** presses every lift button with strangers inside · lines up every guest's shoes at the door at an عزيمة\n- **Public or seasonal:** won't get out of the car at a winter كشتة with relatives · bolts in the mall car park (danger, L04/L09 family) · only white rice at the عزيمة buffet while the aunts comment (food)\n- **Relatives' advice:** unwanted advice at a winter gathering, plus her calm replies (the L25 re-test, new lines) · grandma hands him the biscuit you just said no to\n- **Bedtime (1):** staying over at grandma's and he won't sleep while everyone's still up\n\n### CTA (`cta_method.md`)\n- Name the outcome she desperately wants in this situation, with certainty («يمكن», «جربي», «لو حابة» are banned), and never as homework («عبي التقييم» is banned).\n- The assessment is the bridge, never the promise (claims limited to `assessment_truth.md`).\n- Test every CTA: would she click without knowing what's behind it?\n- **Match the CTA to the QR route.** Odd posts go to the Living Plan page for that situation, so their CTA must not say \"assessment\". Even posts can name it as the vehicle («امسحي الكود أو الرابط في البايو»).\n\n### QR and tracking\n- One code per post, made with `make_qr.py`, tagged `src=qr&post=b4pN`. The bio link stays `?src=bio`.\n- **After each evening:** log day 1 in Post Performance, then read Visits and Submissions by `post`.\n\n### Visual (for Creative Production later)\n- Copy is the star, and the slide-1 image supports it.\n- Quiet motifs or colour on later slides.\n- A fresh look against B3's single teal style, plus a distinct look for the fallacy series.\n- The cream text-only slide-1 test (2 posts).\n\n### Rules that bend for labelled tests (please confirm)\n1. **Problem + solution hook (b4p6, b4p10)** breaks the B2 rule \"one question, no second half\". It's suspen   document.getElementById('tt').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem('ho-theme',r.dataset.theme)}catch(e){}};
}
try{const t=localStorage.getItem('ho-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
async function load(){
  try{ if(window.__STATE__){S=window.__STATE__;}else{const r=await fetch('state.json',{cache:'no-store'});if(!r.ok)return;const t=await r.text();if(t===last)return;last=t;const prev=S&&S.currentStep;S=JSON.parse(t);if(prev&&prev!==S.currentStep)sel=S.currentStep;}
    render();}catch(e){}
}
load();setInterval(load,2000);
</script>
