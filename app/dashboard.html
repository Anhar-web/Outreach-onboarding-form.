<title>Social Media Agency</title>
<style>
:root{--bg:#faf9f6;--card:#ffffff;--ink:#1b1a18;--muted:#6b6862;--line:#e6e3dc;--accent:#4f46e5;--accent-soft:#eef0ff;--idle:#a8a49c;--working:#d79a0b;--done:#1d9a53;--dark:#1f1e1c;--dark-ink:#f3f2ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#201f1c;--ink:#ecebe7;--muted:#9c988f;--line:#33312d;--accent:#8b86ff;--accent-soft:#25244a;--idle:#5f5c56;--dark:#0f0e0d;--dark-ink:#ecebe7}}
:root[data-theme="dark"]{--bg:#171614;--card:#201f1c;--ink:#ecebe7;--muted:#9c988f;--line:#33312d;--accent:#8b86ff;--accent-soft:#25244a;--idle:#5f5c56;--dark:#0f0e0d;--dark-ink:#ecebe7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:20px;margin:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.spacer{flex:1}
button{font:inherit;cursor:pointer}
.toggle{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px}
.stepper{display:flex;justify-content:space-between;position:relative;margin:8px 0 22px;overflow-x:auto;padding-bottom:4px}
.stepper:before{content:"";position:absolute;left:18px;right:18px;top:17px;height:2px;background:var(--line);z-index:0}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:58px;background:none;border:0;color:var(--ink);padding:0}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;background:var(--idle);border:3px solid var(--bg)}
.st.cur .dot{box-shadow:0 0 0 2px var(--accent)}
.st.sel .lbl{font-weight:700;color:var(--ink)}
.lbl{font-size:11px;color:var(--muted);text-align:center;max-width:72px;line-height:1.2}
.s-idle{background:var(--idle)}.s-working{background:var(--working)}.s-needs-you{background:var(--accent)}.s-done{background:var(--done)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;color:#fff}
.det h2{font-size:30px;margin:6px 0 2px}
.sub{font-style:italic;color:var(--muted);margin:0 0 14px}
details.idea{background:var(--dark);color:var(--dark-ink);border-radius:10px;padding:12px 14px;margin:12px 0}
details.idea summary{cursor:pointer;font-size:13px}
details.idea h4{margin:10px 0 4px;font-family:Georgia,serif;font-size:17px}
.action{border:2px solid var(--accent);border-radius:12px;padding:14px;margin:14px 0}
.action .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.send{margin-top:10px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:13px}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 12px;color:var(--muted)}
.md code{background:var(--accent-soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
.md h1,.md h2,.md h3{font-family:Georgia,serif}
h3.sec{font-family:Georgia,serif;font-size:22px;margin:30px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;text-transform:uppercase}
.sp b{display:block;font-size:13px}.sp span{font-size:12px;color:var(--muted)}
.sc{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.cc.picked{border:2px solid var(--accent)}.cc.rejected{opacity:.45}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-right:4px;border:1px solid var(--line);color:var(--muted)}
.j-attention{background:#fde8d4;color:#8a4a0f;border:0}.j-trust{background:#d9efe2;color:#14653a;border:0}.j-conversion{background:var(--accent-soft);color:var(--accent);border:0}
.rtl{direction:rtl;text-align:right;background:var(--bg);border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;font-size:16px;line-height:1.8}
.gloss{font-style:italic;color:var(--muted);font-size:13px}
.score{float:right;border-radius:999px;padding:2px 10px;color:#fff;font-weight:700;font-size:13px}
.note{background:var(--accent-soft);border-radius:10px;padding:12px;font-size:13px;margin-top:10px}
.wait{text-align:center;padding:80px 0;color:var(--muted)}
</style>

<script>
/*__STATE__*/window.__STATE__={"project": "Home Orbit — Batch 1 (10 static posts)", "updatedAt": "2026-11-04T14:21:02.174123+00:00", "currentStep": 8, "steps": [{"n": 1, "key": "brief", "title": "Brief", "subtitle": "The Strategist turns your answers into the brief every specialist works from.", "status": "done", "idea": {"title": "Decide the job before the post", "body": "Most content fails because nobody decided what it was for. One job per batch, named before anyone writes."}, "action": {"label": "Answer the brief questions in chat, then confirm.", "phrase": "Looks right. Next step."}, "report": "## The brief\n\n**Batch:** 10 static posts: **5 attention** and **5 conversion**. No trust-only posts in this batch.\n\n**Format:** all **static slides**. You decided this up front, so at Step 6 we'll only confirm it for each concept. We won't ask the question again.\n\n**Audience:** a **new mother who doesn't know Home Orbit yet**. She's cold: she's never seen the brand, has no reason to trust it yet, and she's scrolling.\n\n**What counts as a win:** **assessment starts** and **waitlist sign-ups**. Views, likes and saves only matter if they lead to these two.\n\n**Topic:** the research picks it. The Audience Researcher finds the real moments and the words mothers actually use. The Market Analyst uses the marketing-sophistication skill to find what the market has already heard too often and where the open lane is. Topics come from where those two reports meet.\n\n**Required (your rule): every post gives real, usable value.** She leaves with something concrete she can use: steps to try, a way to answer a question she has, separate ideas she can pick from, or a short checklist. Vague information that doesn't help her is not allowed. This counts for attention posts too: the value *is* what stops the scroll.\n\n### How the two jobs work together\n| Job | Posts | What she gets | How it ends |\n|---|---|---|---|\n| Attention | 5 | A small, concrete win she can try today | No call to action, or at most a soft nudge to the profile |\n| Conversion | 5 | Real value that also shows her the next question only *her own* observations can answer | One clear step: start the free assessment (with a matching `?focus=` link) |\n\n### Confirmed by Anhar\n- **Every conversion post leads to the assessment.** There's one link in the bio, and it goes to the assessment. The CTA is \"the link in the bio\", not a URL.\n- **Value means practical steps and tips** for her. Nothing promises a result for the child, gives a medical cause, or mentions therapy.\n- **Never say \"autism\" (التوحد).** Many of these children aren't diagnosed, and the word is a huge umbrella. Every post names a **behavior she can see**, like he covers his ears, eats only three foods, or melts down when you leave the house. No labels and no abstract concepts.\n- Platform: TikTok/Instagram carousels, read on a phone.\n"}, {"n": 2, "key": "scorecard", "title": "Scorecard", "subtitle": "The Strategist sets this batch's 100-point scorecard and the agency plan.", "status": "done", "idea": {"title": "Define great before you make anything", "body": "If you don't know what good looks like before writing, you'll grade whatever you made as good."}, "action": {"label": "Review the weights and the plan.", "phrase": "Go."}, "report": "## Scorecard for Batch 1\n\nYour brief changes what \"great\" means, so the Strategist has reweighted the scorecard. It still totals 100.\n\n| # | Item | Default | **Batch 1** | Why |\n|---|---|---|---|---|\n| 1 | Scroll-stop | 18 | **16** | A cold mother has never seen us, so frame one still carries most of the work |\n| 2 | Recognition | 15 | **14** | She has to see a behavior she has *seen herself* |\n| 3 | **Usable value** *(new)* | — | **14** | Your rule: she leaves with steps, ideas or a check she can use today. Vague = 0 |\n| 4 | Emotion, not apathy | 15 | **12** | Still essential, but practical value now carries part of the pull |\n| 5 | Her own words | 12 | **10** | |\n| 6 | Trust & safety *(gate)* | 10 | **10** | Gate now also blocks: the word \"autism\", promised results, medical causes, therapy |\n| 7 | Arabic naturalness | 8 | **8** | |\n| 8 | One job | 10 | **7** | Only two jobs this batch, so it's easier to get right |\n| 9 | Next step | 4 | **5** | Half the batch converts. Conversion posts are scored on one clear \"link in bio → assessment\". Attention posts get full marks when they correctly *don't* have a CTA |\n| 10 | The turn | 6 | **4** | Value posts land through usefulness more than a twist |\n| — | Shareable | 2 | **cut** | Folded into Usable value: if it's useful, she saves and sends it |\n\n**The value test** the Test Panel applies to item 3: *Could she do something different tonight because of this post?* If not, it scores 0–4 out of 14, however well it's written.\n\n## The agency plan\n\n| Step | Who | What they deliver |\n|---|---|---|\n| 3 | **Audience Researcher** ∥ **Market Analyst** (in parallel) | Researcher: the specific behaviors mothers describe, in their own Arabic words, plus what they've tried and dropped. Analyst: market-sophistication stage, worn-out advice, the open lane. **Together they choose the topics.** |\n| 4 | Hook Specialist | 3 angles × 4–6 Arabic hooks, aimed at the open lane |\n| 5 | Strategist | ~14 concepts (≈7 attention, ≈7 conversion) for you to pick 10 from: 5 + 5 |\n| 6 | You | Confirm static for each picked concept |\n| 7 | Copywriter | 10 carousels, after reading both of your Arabic files in full |\n| 8 | Arabic Voice Editor → Test Panel | Native-voice edit, then three sceptical mothers score every post |\n| 9 | Strategist | Clean handoff and blank performance rows |\n"}, {"n": 3, "key": "research", "title": "Research", "subtitle": "The Audience Researcher and Market Analyst work in parallel.", "status": "done", "idea": {"title": "Her words, and what the market has already heard", "body": "We write in the mother's own language, and aim where the 50 generic accounts aren't."}, "action": {"label": "Review both reports.", "phrase": "Both look good. Next step."}, "report": "## Where the two reports meet: topic shortlist\n\nBoth specialists worked independently and came back with the **same core moments**. The open lane, in one line: **everyone hands her answers for the moment; nobody hands her a way to look at what happens *before* it.** So every post takes one exact moment she lives and gives her something to *do* or *check* on her own child. For conversion posts, that check is a small version of the assessment, so \"link in bio\" follows naturally.\n\n| # | Topic (behavior + moment) | Researcher | Analyst | Best fit |\n|---|---|---|---|---|\n| 1 | **The second the iPad is taken away** | ✓ | ✓ | Attention or conversion |\n| 2 | **The family visit / عزيمة / بيت الجدة**: ears covered, crying within minutes | ✓ | ✓ #1 most open | Attention or conversion |\n| 3 | **Only eats the same 3–5 foods**: the safe plate | ✓ | ✓ | Attention |\n| 4 | **Bedtime**: he only sleeps with you beside him, and the evening \"starts at Asr\" | ✓ | ✓ | Conversion |\n| 5 | **Covers his ears** at everyday sounds (blender, hand dryer, wedding speakers) | ✓ | ✓ | Attention |\n| 6 | **Leaving the park / getting in the car** without the scream | ✓ | — | Attention |\n| 7 | **Wakes up angry**: a 2-day look-back | — | ✓ | Conversion |\n| 8 | **Doesn't turn to his name** \"but hears the fridge open\" | ✓ | — | Conversion (with care) |\n| 9 | **\"Is this just a phase?\"**: a six-area self-check | ✓ | ✓ | Conversion, the most direct |\n| 10 | **He cries and you can't tell what he wants** | — | ✓ | Attention |\n\n### Flags for you\n- **Saudi dialect is thin online.** Arabic quotes found are mostly MSA question titles (Altibbi, Islamweb). The Copywriter will write in Saudi voice from your Arabic files, but **no invented quotes**. The best real-voice source is comments on your own TikTok posts and the assessment's Q15 answers. If you can paste some, the hooks get much stronger.\n- **Quotes aren't verified in context.** Page fetching was blocked; quotes come from search snippets. Nothing goes on a slide as a \"real quote\".\n- **Two safety notes:** don't recommend ear defenders (NHS advises against routine use), and \"he used to talk and stopped\" should never be a carousel. That one belongs with a doctor.\n- **Honest bridge, no scarcity:** cold posts carry no \"10 places\" line; that stays on the landing page.\n\n---\n\n# Report 1 · Audience Researcher\n\n## Audience Research: her behaviors, her moments, her questions\n\nStep 3, batch of 10 carousels. Builds on `agency-run/research.md` (read that for stigma, cost, \"شفاء\" programs, competitor map). This file adds: observable behaviors, the exact recurring moments, and the practical questions mothers ask.\n\n**Method and honesty.** About 33 searches (Arabic and English). **Page fetching was blocked again**: hawaaworld.com, mumsnet.com, community.autism.org.uk and the Reddit mirror all failed DNS. Each needs to be allowed in the session's network settings before anyone can verify these quotes in context. Everything below comes from search snippets, page titles or URL slugs. The best Arabic source turned out to be **Altibbi and Islamweb question titles**: their URL slugs hold the parent's own question text, often with typos and the numbers stripped out. **Saudi-dialect speech is still thin.** Most Arabic hits are MSA questions or press articles. Gulf dialect lives in TikTok, Snap and WhatsApp, which search does not index.\nTags: **[REAL]** = verbatim snippet text. **[TITLE]** = a real thread or question title (or URL slug). **[PARAPHRASE]** = the source's content in my words.\n\n---\n\n### 1. Quote bank\n\n| # | Phrase | Gloss | Tag | Source |\n|---|---|---|---|---|\n| 1 | «عمره ولم يتحدث بعد حتى ماما ولا بابا هو يعي ما احدثه» | Hasn't said even mama or baba, but he understands what I tell him | TITLE | altibbi.com/…/عمره-ولم-يتحدث-بعد-حتى-ماما-ولا-بابا-هو-يعي-ما-احدثه-679687 |\n| 2 | «متاخر في كلا عمره سنتين مشكلته انه كان يتكلم كلمات» | Late in speech, he's two, the problem is he *used to* say words | TITLE | altibbi.com/…/متاخر-في-كلا-عمره-سنتين-…-885978 |\n| 3 | «شديد العصبية ويصرخ بشدة على اتفه» (الأسباب) | Very irritable, screams hard over the smallest thing | TITLE | altibbi.com/…/الصغير-سنوات-شديد-العصبية-ويصرخ-بشدة-على-اتفه-495414 |\n| 4 | «لدي مشكلة لا يريد الاكل كره كل الماكولات و لا يريد الا…» | My problem: he won't eat, hates all foods, only wants… | TITLE | altibbi.com/…/لدي-مشكلة-لا-يريد-الاكل-…-1767958 |\n| 5 | «ابني يهرب من الطعام ولا يأكله فبماذا تنصحوني؟» | My son runs away from food and won't eat it, what do you advise? | TITLE | islamweb.net/ar/consult/print.php?id=2341109 |\n| 6 | «يستيقظ كل ليلة في نفس الوقت… باكيا و هو مفزوع» | Wakes every night at the same time, crying and frightened (an infant) | TITLE | altibbi.com/…/عمره-اشهر-يستيقظ-كل-ليلة-…-872916 |\n| 7 | «عصبيتي وعناد طفلي» | My temper and my child's stubbornness (the mother admits she hits) | TITLE + PARAPHRASE | alukah.net/fatawa_counsels/10968/132633 |\n| 8 | «ابني يضرب أخته» / «طفلي والضرب» | My son hits his sister / My child and hitting | TITLE | alukah.net/fatawa_counsels/0/47522 ; /0/32452 |\n| 9 | «الناس بتقول على ابنى مش متربى» | People say my son wasn't raised right (Egyptian) | REAL (prior run) | youm7.com/story/2016/4/3/…/2657221 |\n| 10 | «حرجهم من قبول دعوة عشاء… امتناعهم عن كل أشكال الزيارات» | Their embarrassment at accepting a dinner invitation… avoiding all visits | REAL (prior run) | aljazeera.net/blogs/2023/1/15/التوحد-وأنا-وخانتني-العبرة |\n| 11 | «كان يصحى معصب كل يوم. هالأسبوع صحى معصب مرة وحدة.» | He woke up angry every day; this week only once | REAL, owner-supplied | client case |\n| 12 | \"I get him to sleep between 7.30 and 8pm, but only if I stay with him until he is asleep. He wakes every night around 10.30pm screaming.\" | (bedtime that depends on the mother lying beside him) | REAL | mumsnet.com/talk/sleep/3984580-5-year-old-with-sleeping-problems |\n| 13 | \"hates the bath and music and books make him manic rather than calm\" | the standard calming routine backfires | REAL | same thread |\n| 14 | \"i cant get any more support or possible melatonin for him until hes formally diagnosed\" | **the undiagnosed gap, in her words** | REAL | mumsnet.com/talk/am_i_being_unreasonable/5499498-toddler-not-sleeping-at-all-possible-night-terros |\n| 15 | \"It has to be a food that is exactly the same every time he eats it.\" | sameness, not taste | REAL | mumsnet.com/talk/parenting/5384198-2-year-old-sen-child-food-help |\n| 16 | \"basic, plain beige foods are safe, they taste the same way everytime\" | why \"safe foods\" are safe | REAL | mumsnet.com/talk/am_i_being_unreasonable/5322489-to-think-just-dont-offer-them-beige-food |\n| 17 | \"my daughter will only eat chicken nuggets and toast basically\" | — | TITLE | mumsnet.com/talk/_chat/5001533 |\n| 18 | \"only eating yellow food\" | — | TITLE | community.autism.org.uk/f/miscellaneous-and-chat/2109 |\n| 19 | \"4 year old tantruming when ipad taken away\" | — | TITLE | mumsnet.com/talk/parenting/4978061 |\n| 20 | \"Would it help if you set the timer so that it's not you saying he can't have it, it's the device turning off after X time?\" | mother-to-mother tip | REAL | same thread |\n| 21 | \"I limit the electronics as much as possible. When this happens with my daughter my husband says I interrupted the hyper focus and pissed her off.\" | screen-off moment; the couple disagree about it | REAL | red.bismuth.it/r/Autism_Parenting/comments/1fgxopt/meltdowns_after_electronic_use |\n| 22 | \"angry toddler who wont leave the house please help\" | — | TITLE | mumsnet.com/talk/parenting/5315320 |\n| 23 | \"advice for managing a five year old who runs off and refuses to leave\" | — | TITLE | mumsnet.com/talk/parenting/5553175 |\n| 24 | Undiagnosed toddler, several meltdowns a day, \"usually when leaving a place like the park or when getting out of the car\" | — | PARAPHRASE | community.autism.org.uk/f/miscellaneous-and-chat/6054/toddler-diagnosed |\n| 25 | \"22 months old boy doesnt respond to name\" / \"Hearing issue or sign of Autism\" | — | TITLE | mumsnet.com/…/4584644 ; /3390289 |\n| 26 | \"it can be really hard to get him to respond to his name if he doesn't want to\" / son \"only learnt that his name is his name at 3\" | — | REAL (exact thread unclear, from Mumsnet name-response threads) | mumsnet.com (search set above) |\n| 27 | Mother \"Amal\": son would cover his ears and cry within minutes of arriving at family gatherings; people \"thought he was being difficult\" | **the visit + covered-ears moment** | PARAPHRASE | omanobserver.om/article/1186692 |\n| 28 | \"distancing yourself during times of gathering could be misinterpreted by relatives as carelessness for your family ties\" | the Eid/visit bind | REAL | reddit.sentinel-team.org/posts/1qnth70 (Eid thread) |\n\n**Gaps.** I found no Arabic mother's verbatim for **covering ears**, **lining things up** or **the iPad moment**. Those exist only as English threads or clinical leaflets. All Saudi-dialect lines are still missing. Do not invent them. The fastest fix is the comments on Anhar's own TikTok posts plus the assessment's Q15 free-text answers.\n\n---\n\n### 2. Behavior map: the six areas\n\n**Sleep (النوم)**\n- She has to lie beside him until he falls asleep (#12). The \"calming\" routine (bath, music, a story) winds him up instead (#13).\n- He wakes at the same hour every night, screaming or frightened (#6, #12). He's awake late into the night (prior run: \"2/3am\").\n- The moment: **the minute she gets up from beside him**, and **10:30pm or 3am waking**.\n\n**Outings and visits (الخروج والزيارات)**\n- Moments: **leaving the park**, **getting out of the car**, **buckling the car seat** (NAS \"every trip in the car\" meltdowns, PARAPHRASE), **arriving at a family gathering** (#27), **the barber** (alkafeel thread title «لماذا يبكي الطفل عند حلاقة شعره ؟؟»), **the supermarket or mall** with people staring (Asharq Al-Awsat title «نظرات الناس لا تهم…كيف تتعامل مع نوبة غضب طفلك بالأماكن العامة؟»).\n- Saudi framing: the Thursday or Eid family visit. Skipping it reads as cutting family ties (#28), and going means people's looks (#9, #10).\n\n**Communication (التواصل)**\n- **Doesn't respond to his name but hears everything else.** This is the most common question title on Mumsnet (#25). He understands but doesn't speak (#1). He used to say words and stopped (#2), which is a safety flag to send her to a doctor, never a topic to coach on.\n- Moments: **calling him from across the room while he's absorbed**, and guessing what he wants.\n\n**Food (الأكل)**\n- Same food, same brand, same plate or cup; beige or yellow foods; foods must not touch (#15–18, Solihull SEND guide).\n- Runs from the table (#5). She asks about tests and whether the cause is physical (Islamweb PARAPHRASE).\n- Moments: **the dinner plate with his two safe foods**, **the family table at a visit** where relatives push him to eat.\n\n**Transitions (الانتقال / إيقاف شي يحبه)**\n- **The second the iPad is taken** (#19–21), **leaving the park** (#24), **shoes and the car in the morning**.\n- A five-minute warning often isn't enough (prior run). Parents argue over whose fault it is (#21).\n\n**Emotions and anger (الغضب والانفعال)**\n- Screams \"over the smallest thing\" (#3). **Hits when told no** (the question was searched; the alukah titles in #8 confirm the theme). Hits a sibling (#8). Hits his own head (Arabic Post title «يصرخ ويضرب رأسه في الحائط»). This needs medical referral wording.\n- The mother's own anger is part of the scene (#7). Content must hold her without blaming her.\n\n**Sound (cuts across outings and emotions):** NHS leaflets list the triggers: **vacuum cleaner, hand dryers, sirens, bells, fireworks**. Children \"display their dislike of sounds physically… by covering their ears or crying\" (sfh-tr.nhs.uk, esht.nhs.uk). This is not a mother's voice, but it gives us concrete moments: the hand dryer in the mall toilet, the vacuum, Eid fireworks, wedding speakers.\n\n---\n\n### 3. The questions she asks (ranked by frequency × usability)\n\n| Rank | Question | Safe for an action-step carousel? |\n|---|---|---|\n| 1 | \"What do I do when he screams the moment I take the iPad?\" (#19, «ولدي يصارخ اذا سحبت منه الجوال») | **Yes.** Warning, holding the device, letting the timer \"say no\" (#20), a next activity ready. |\n| 2 | \"How do I get him out of the park or the house without a meltdown?\" (#22–24) | **Yes.** Countdown, a visual \"then\" step, a leaving routine. |\n| 3 | \"He only eats 3–4 foods. What do I do?\" (#4, #5, #15–18) | **Yes, with care.** Keep safe foods, one tiny new item on a separate plate, no forcing. Refer to a doctor if he's losing weight. |\n| 4 | \"Why doesn't he answer when I call him, when he hears everything else?\" (#25–26) | **Partly.** \"A check she can run\" (call from near vs far, absorbed vs free, name vs the fridge door). It must include \"get his hearing checked.\" No diagnosing. |\n| 5 | \"How do I get him to sleep without lying next to him for an hour?\" (#12) | **Yes.** Moment-by-moment wind-down steps. Never promise he'll sleep through. |\n| 6 | \"He covers his ears at the vacuum or the mall. What do I do?\" | **Yes.** Warn before the sound, give him control of the switch, a way out. Do NOT recommend routine ear defenders: NHS leaflets advise against everyday use. Stay neutral or leave it out. |\n| 7 | \"He hits when I say no. What do I do?\" (#8) | **Yes, carefully.** Stay calm, keep the \"no\", teach a replacement. Self-hitting → \"talk to a specialist\". |\n| 8 | \"How do I take him to family visits or Eid?\" (#10, #27, #28) | **Yes.** Short visit, a quiet corner, arrive early, a one-line script for relatives. |\n| 9 | \"Is this normal? Should I worry?\" (Altibbi, Mumsnet \"is this normal\") | **Not as a value post.** This is the conversion hook: \"a check you can run in 3 minutes\" → the assessment. Must not label. |\n| 10 | \"He used to say words and stopped.\" (#2) | **No.** Route her to a doctor. |\n\n---\n\n### 4. What she's tried and dropped\n\n- **Timers, warnings, sticker charts** for transitions. Vendor material says they work; parents say warnings \"don't register\". No forum post explaining why they fail came through. [PARAPHRASE] Likely reason (synthesis): they're used inconsistently and not tied to *which* moment is hard.\n- **The standard bedtime routine** (bath, music, story) makes him more wound up (#13).\n- **Giving the iPad back to stop the scream.** Articles warn it backfires; mothers do it to escape people's looks (Asharq Al-Awsat snippet).\n- **Forcing or hiding food, diets, supplements** (prior run). Advisers say no forcing; mothers drift to tests and diets.\n- **Waiting for a diagnosis** to unlock help (#14). This is the strongest \"why now\" for an assessment that doesn't need one.\n- **Avoiding outings and visits altogether** (#10), which costs her family standing (#28).\n- **Hitting or shouting back,** then guilt (#7).\n\n### 5. Trust signals for a cold mother\n\n**Builds trust:** naming *her exact moment* (the 10:30pm scream, the car seat, the iPad second); steps she can try tonight; \"this is common, you're not doing it wrong\"; tips that sound like they come from another mother (#20); honestly saying when to see a doctor or check hearing; a free assessment that **doesn't require a diagnosis** (#14).\n**Breaks trust:** labels («التوحد», «عنيد», «مدلع»); cure or \"within a week\" promises (forum «شفاء» burnout); generic \"10 tips\" lists (webteb, mawdoo3 dominate search, and she has read them); any hint that she caused it (#7, the refrigerator-mother history); clinical jargon; recommending gear (ear defenders, supplements).\n\n---\n\n### 6. Recommended topic candidates\n\n| # | Topic (behavior + moment) | Why the research supports it | Fit |\n|---|---|---|---|\n| 1 | **The second you take the iPad**: 4 steps before, during and after | Most-asked transition question in both languages; concrete; peer tip #20 | **Attention** (high share) |\n| 2 | **Leaving the park, mall or a visit without the scream**: an exit routine | #22–24; a daily moment; easy to show as steps | Attention |\n| 3 | **He eats only 3 foods**: the safe-plate method (keep his foods, one tiny new thing on the side) | #4, #5, #15–18; heavy Arabic question volume; links to assessment area \"food\" | Attention or conversion |\n| 4 | **He doesn't turn when you call his name, but hears the fridge**: a 4-situation check to note at home (+ hearing check) | #25–26; the \"is this normal?\" anxiety; a natural bridge to \"the full check is free\" | **Conversion** |\n| 5 | **Bedtime that needs you lying beside him** / the 10:30pm wake: what to change in the hour before | #12–14; mothers carry the sleep cost; assessment area \"sleep\" | Conversion |\n| 6 | **He covers his ears**: the 5 everyday sounds (vacuum, hand dryer, fireworks, wedding speakers, the blender) and what to do before each | The behavior was named in the brief; NHS trigger list gives concrete items; no Arabic competitor content found from a mother's angle | Attention |\n| 7 | **Thursday or Eid visit**: a plan (arrive early, quiet corner, leave before he breaks, a one-line reply to relatives) | #9, #10, #27, #28; uniquely Saudi or Gulf; family pressure | Attention or conversion |\n| 8 | **\"Is this just a phase?\"**: a 6-moment self-check across sleep, outings, name, food, transitions, anger → \"see your full picture free\" | Mirrors the six assessment areas; mothers bundle problems together (prior run: anger + sleep + food) | **Conversion** (core) |\n\n**Next step for verification:** allow mumsnet.com, hawaaworld.com, community.autism.org.uk and altibbi.com in the network settings, then re-check rows 12–28 in context before any of them is quoted on a slide.\n\n\n---\n\n# Report 2 · Market Analyst\n\n## Market Analysis: Home Orbit social batch (10 carousels)\n\nBuilds on `agency-run/market.md` and `positioning.md` (landing page: Stage 3 mechanism market with a Stage 5 emotional heart). This pass looks at the **content feed**: what Arabic/Gulf parenting and special-needs content already tells a cold mother, and where a value post can still stand out.\n\nMethod note: web search does not index TikTok and Instagram posts directly. The evidence below comes from the Arabic web layer the feed recycles (sayidaty, mawdoo3, webteb, asharq, aljazeera, al-ain, alkafeel forums, ajel), English autism-parent sources and TikTok studies, plus the prior research.md. Each tip type below appeared in at least 3 independent Arabic sources.\n\n---\n\n### 1. Sophistication stage of the content topic\n\n**Stage 3 for tips, close to Stage 4 for the tip formats themselves. The audience's heart is Stage 5.**\n\nThe cold mother's feed has already given her every generic *claim* (\"your child can be calmer, sleep, eat\") and most generic *methods*. Content that is now wallpaper:\n\n| Wallpaper type | Evidence | Why it no longer lands |\n|---|---|---|\n| **\"علامات التوحد\" lists** (eye contact, name response, flapping, lining up toys) | asharq \"11 علامة تؤكد إصابة طفلك بالتوحد\", sayidaty x3, mawdoo3, alkhaleej | Off-limits for us anyway. It also frightens her: arabicpost describes new mothers asking groups about *every* behavior. |\n| **\"٧/١٠ نصائح لنوبات الغضب\"**: stay calm, distract, don't give in, praise good behavior, time-out | masrawy \"7 نصائح\", al-ain, mawdoo3, alkafeel, aljazeera \"دليل شامل\", asharq/Mayo | Identical lists everywhere. They assume a typical toddler tantrum and add a \"see a specialist if it's over 25 minutes\" line. |\n| **Sleep routine**: fixed bedtime, warm bath, dim lights, under 30 minutes | mawdoo3 x2, asharq \"7 نصائح\", sayidaty, arabi21 | Every one is about *the bed*. None looks at the day before it. |\n| **Picky eating**: don't force, involve him in cooking, keep re-offering, reward | sayidaty x3, alarabiya, hespress | Written for a typical picky eater. It doesn't fit a child who eats 5 foods. |\n| **Diet/cure claims**: GFCF, «علاج التوحد بالغذاء», \"81% improvement\" | mawdoo3, webteb x2; SMJ review: 4 of 9 studies show no effect | Hope followed by let-down (the pattern in market.md). Banned for us. |\n| **Screen-time fear**: «التوحد الافتراضي», «لا للشاشات», screens cause speech delay | ajnet, eremnews, webteb, youm7 (Autism Day 2026), al-ain, snrt | Mostly guilt. It implies she caused it. |\n| **Transitions**: give a 5-minute warning, use a timer, don't negotiate, carry him out | English: Time Timer, PBS, Sesame; Arabic: generic tantrum lists | She has tried it. Even the vendors admit \"a single timer isn't enough\". |\n| **Generic reassurance**: «كوني صبورة», «كل طفل مختلف», «النتائج تحتاج وقت» | balagh, mumzworld, maspero | Comforting, but nothing she can use. |\n| **Behavior-modification jargon**: تعزيز إيجابي/سلبي، إطفاء، عقاب مستقطع | mawdoo3, cura.sa, maspero | Clinical, and it frames the child as something to correct. |\n\nThe English feed is one step ahead, at **Stage 4**. It sells competing mechanisms: low-demand parenting (a viral TikTok with about 489k views), \"meltdown vs tantrum\" explainers (understood.org and others), visual timers, sensory diets. A TikTok study found only 27% of #autism videos were accurate. English parents complain about \"generic advice without listening\" and note that \"nuance does not translate to short-form\".\n\n**What's still almost absent in Arabic:** content that asks the mother to *observe something across her child's day and use what she sees*. English sources ask parents to log \"what happened right before\" and note that stress \"builds for hours\". In Arabic this barely appears, apart from one aside in a mawdoo3 article (\"فكر بما يحدث قبل السلوك وبعده\"). No Arabic content gives the mother a concrete check she runs on her own child.\n\n### 2. This batch's level vs the market's\n\n- **Generic tip content (the market's default):** Stage 2 claims (\"10 tips so he calms down\") delivered in a Stage 1 format (a list). It is pitched below where the audience is, so it reads as wallpaper.\n- **This batch must work at Stage 3, with Stage 5 openers.** Open with *her moment* (identification, no blame). The value has to be a *how* she hasn't seen: look at what happened earlier in his day, not only at the moment itself. That keeps us out of the \"11th list\" and the \"علاج\" thread, and it is the same mechanism the assessment and الخطة الحية actually use. There's no gap between what we post and what we sell.\n- **Don't jump to Stage 4.** Don't argue \"our method beats timers or diets\". Saying \"the timer didn't fail you, it only covers the last 5 minutes\" is fine. Attacking other methods or specialists is not.\n\n### 3. The open lane\n\n**Everyone gives her answers about the moment. Nobody gives her a way to look at the day before the moment.**\n\nSpecifically, the open lane is **observation-based, one-moment value content in Gulf dialect**. Each post takes one exact repeating scene (taking the iPad away, the عزيمة at grandma's, bedtime, the plate he won't touch) and gives her **a check she runs on her own child**: 3 questions, a 2-day look-back, a \"before\" map. She comes out with *her* answer, not ours.\n\nThree things make it open:\n1. **Arabic content is answer-first.** Every post tells her what to do. None helps her see her own child's pattern.\n2. **Gulf-specific moments are unserved.** العزايم, بيت الجدة, Eid gatherings, long family visits and late Gulf bedtimes are almost absent from content. The only results were English holiday guides and a UAE news piece.\n3. **No blame.** The screen-guilt and \"the mother is the key\" framings leave room for a voice that says \"you already see what no session sees\".\n\n### 4. What \"usable value\" must look like\n\nTo avoid reading as the 1000th tips list, a post should meet at least four of these:\n\n1. **One exact moment, not a topic.** \"The 10 minutes after you take the iPad away\", not \"transitions\". \"The first half hour at بيت الجدة\", not \"outings\".\n2. **Built on her observation.** The core of the post is something she *checks*: \"for the next 3 times, note…\", \"think back to yesterday: did any of these happen?\"\n3. **Small and countable.** 3 questions, one 2-column note, one change to try. Nothing that needs a printer or a 30-day program.\n4. **Whole-day logic shown, not stated.** Every check reaches back in time (yesterday's sleep, what came before, how full the day was), so the mechanism is *demonstrated* inside the free value.\n5. **No promised outcome.** End with \"you'll see what comes before it\", not \"he'll calm down\".\n6. **Saveable.** A last slide she can screenshot (the check itself), because saves drive carousel distribution.\n7. **Describe the behavior, never label it.** No \"sensory overload\", \"meltdown\", \"anxiety\" as cause. Say «يغطي أذنه», «يرمي نفسه على الأرض», «ياكل نفس الأكل».\n\nWallpaper test: if you could swap the post onto sayidaty with a stock photo, rewrite it.\n\n### 5. Mechanism to lead with, and the honest bridge\n\n**Mechanism (plain words, no coined term):** «نشوف يومه كامل، مو الموقف وحده» → «مجال واحد في كل مرة» → «نعدّلها معك كل أسبوعين». In attention posts, show only the first piece, inside the check. In conversion posts, name the full chain once, on the second-to-last slide.\n\n**Bridge from free tip to assessment.** The free check and the assessment are the same kind of looking at different sizes. That's what makes the bridge honest:\n- Slides 1–6: one moment → her check → what she might notice.\n- Bridge slide: «هذا موقف واحد من يومه. التقييم المجاني يشوف ٦ جوانب مع بعض: النوم، الطلعات والزيارات، التواصل، الأكل، الانتقال من شي يحبه، والمشاعر… عشان تعرفي من وين تبدئي.»\n- Last slide: «الرابط في البايو. بعد التقييم، إذا حبيتي، فيه قائمة انتظار للخطة الحية: خطة تُبنى من يومه، مجال واحد، وتتعدل معك كل أسبوعين.»\n- **No scarcity in cold posts.** No countdown, no «الأماكن محدودة». The true \"10 mothers\" line belongs on the landing page only. A cold mother who hasn't met the brand reads any scarcity as a sales trick.\n- The assessment is the *natural next step of the check she just did*, not a gift box: \"you looked at one moment. This looks at the whole picture.\"\n\n### 6. Identity angle\n\nUse it, and keep it light: **«انتي تشوفي اللي ما يشوفه أي تشيك لست.»** Every check post *proves* this. Her notes are the data. It replaces both «كوني صبورة» (which treats her as the problem) and «الأم مفتاح النجاح» (which puts pressure on her). For outings, identity carries the post: she's the one doing ألف حساب before every invitation. Name that, then give her a plan for the visit. Other people's judgment («مو متربي») may appear only as something said *to* her, at most once in the batch.\n\n### 7. Topic recommendations (ranked by how open the lane is)\n\n| # | Behavior + moment | The check/value | Lane | Fit |\n|---|---|---|---|---|\n| 1 | **The عزيمة / بيت الجدة visit**: the first half hour and the moment he's had enough | A \"before we go\" 3-question prep (what does he know about the place, where is his quiet corner, what's our exit sign) + an after-visit note: when did it turn? | **Widest open.** No Arabic content, highest emotional load | Attention (identity-led), also strong conversion |\n| 2 | **Morning anger**: he wakes up angry most days | A 2-day look-back: last night's bedtime, how the evening ended, what's first on the morning's list. It's the case-1 mechanism shown, not told | Very open; content treats it only as an infant sleep issue | **Conversion** (whole-day proof) |\n| 3 | **Taking the iPad away** / stopping something he loves | A \"which stops are hard?\" check: is it every stop or only some? What comes *after* the stop? Is it worse late in the day? | Open in angle (the timer tip is saturated; the \"which and what comes after\" angle is not) | **Conversion** |\n| 4 | **The same 5 foods**: the plate he won't touch | Write his safe-food list and what they share (colour, crunch, brand, temperature). Keep them; the list is information, not failure | Open vs diet/force content; the anti-diet stance is credible | Attention |\n| 5 | **Bedtime that starts at 4pm**: he can't settle at night | An evening-load check: what happened from Asr to bed (visits, screens, noise, a late nap)? Pick one to try moving | Semi-crowded (sleep tips); open only through the whole-day angle | **Conversion** |\n| 6 | **Covering his ears / leaving loud places** (weddings, malls) | A \"loud map\" of his week: where, what time, how long before he covers his ears. Describe it; no \"sensory\" diagnosis | Open in Arabic; English covers it, Arabic covers it thinly | Attention |\n| 7 | **The guessing moment**: he cries or pulls you and you don't know what he wants | A note: what was he near / looking at / doing just before? 3 times this week | Moderately open; speech content is all about words and screens | Attention (keep it complementary to speech therapy; no promise of words) |\n| 8 | **The stares in public**: what to say to relatives | One short line to say + one exit plan | Emotionally open but thin on value unless built as a script | Attention (use sparingly) |\n\n**Suggested split:** attention posts 1, 4, 6, 7 and one of 8 or a second outing post. Conversion posts 2, 3, 5, plus a conversion version of 1 and an \"all six areas\" self-check (which of the six moments repeats most this week?). The six-area self-check maps 1:1 onto the assessment and is the most honest bridge of all.\n\n**Stay out of:** signs/checklists of any condition, meltdown-vs-tantrum explainers, screen-guilt, diet/supplement anything, \"10 tips\", reward-chart behavior modification, self-harm content (if it ever comes up, point to a doctor).\n"}, {"n": 4, "key": "hooks", "title": "Angles & hooks", "subtitle": "The Hook Specialist writes 3 angles with 4–6 scored hooks each.", "status": "done", "idea": {"title": "The hook carries most of the result", "body": "An angle is the way in; a hook is the exact first line that delivers it."}, "action": {"label": "Pick or push back on the hooks.", "phrase": "These are good. Build concepts."}, "report": "## Hooks board: final\n\n**All three angles approved by Anhar.** For 3.1, the Director chose Anhar's option 1 over option 2 («كيف تساعدي طفلك…»): option 2 read as a how-to headline, while option 1 names the label she fears and takes it away.\n\n## Round 3\n\n**Angles 1 and 2: approved by Anhar.** Angle 3 has been revised again (3.1, 3.2, 3.6).\n\n### Earlier round-2 notes\n\nRewritten from your notes. Your own rewrites are used **word for word** and marked ✎. Your voice and value rules are saved in `app/anhar_voice_notes.md`, and every specialist reads that file from now on.\n\n**What changed across the board:**\n- Hooks are one voice from start to finish.\n- The second half promises something concrete: what to change, or what she'll see.\n- No quizzes, no homework, no logs.\n- Every hook opens on a moment she can relive.\n- The client case is gone.\n\n### Angle 1: \"It starts before the moment\"\nShe gets something to change *before* the scream, not a way to manage the scream itself.\n\n| # | Hook | Gloss | Job | What she gets |\n|---|---|---|---|---|\n| 1.1 *(new: replaces the client case)* | يبدأ الصراخ أول ما تجيبي الجزمة عشان تطلعوا؟ الفرق كله في الربع ساعة اللي قبلها. | The screaming starts the moment you bring the shoes to go out? The whole difference is in the quarter hour before it. | Conversion | What to change in the 15 minutes before leaving the house |\n| 1.2 ✎ | يبكي ويغطي أذنه اول ما تدخلوا بيت الجدة؟ غيري طريقة الدخول نفسها، مو الزيارة. | He cries and covers his ears as soon as you walk into grandma's? Change the way you walk in, not the visit. | Conversion | Realistic ways to change the arrival: come before the crowd, a quieter first room, his own thing in his hand |\n| 1.3 | تسحبي الآيباد ويبدأ الصراخ؟ جهزي اللي بعده قبل ما تسحبيه. | You take the iPad and the screaming starts? Get what comes after ready before you take it. | Conversion | What to have ready *before* the iPad goes, so there's somewhere to land |\n| 1.4 ✎ | كل رجعه من الحديقة نفس المعركة؟ جهزيه للخروج من اول ما توصلوا، مو آخر خمس دقايق. | Every trip back from the park is the same battle? Prepare him for leaving from the moment you arrive, not the last five minutes. | Attention | An exit plan that starts at arrival |\n| 1.5 ✎ | ما ينام إلا وأنتي منسدحة جمبه؟ الساعة اللي قبل وقت النوم فيها ثلاث أشياء تقدري تغيريها من الليلة. | He only sleeps with you lying beside him? The hour before bedtime has three things you can change starting tonight. | Conversion | 3 realistic changes to that hour. Never promises he'll sleep alone |\n\n*1.5: I replaced «ارجعي للساعة اللي قبل» so the line now starts straight from «الساعة اللي قبل وقت النوم».*\n\n### Angle 2: \"Your day, named exactly\"\nWarm humor about her day, never about the child.\n\n| # | Hook | Gloss | Job | What she gets |\n|---|---|---|---|---|\n| 2.1 ✎ | قبل كل عزيمة تحسبي لها ألف حساب؟ هذي الحسابات الثلاث اللي فعلاً تفرق. | Before every family dinner you make a thousand calculations for it? These are the three calculations that actually make a difference. | Attention | The 3 things worth planning before a visit. The second half now continues your \"حساب\" thought instead of starting a new one |\n| 2.2 ✎ | تنسدحي جمبه إلين ما ينام، وتصحي بعد ساعتين وأنتي اللي نمتي؟ | You lie beside him until he sleeps, and wake up two hours later because you're the one who fell asleep? | Attention | Steps for the hour before bed so bedtime doesn't take her whole evening |\n| 2.3 *(rewritten)* | تطبخي للبيت كله، وهو له صحن لحاله فيه نفس الثلاث أكلات كل يوم؟ | You cook for the whole house, and he has his own plate with the same three foods every day? | Attention | What his safe foods have in common, plus one small, realistic addition. The nuggets joke is gone because it felt forced |\n| 2.4 ✓ | يغطي أذنه أول ما تشغلي المكنسة، فصرتي تكنسي وهو نايم؟ | He covers his ears the moment you turn on the vacuum, so now you vacuum while he's asleep? | Attention | What to do *before* the sound. Kept as is |\n| 2.5 *(rewritten)* | يبكي ويسحبك من يدك، وأنتي تجربي كل شي وما تعرفي ايش يبغى؟ | He cries and pulls you by the hand, and you try everything and don't know what he wants? | Attention | Situational clues to check first. The question-mark list is gone |\n| ~~2.6~~ | *Cut: lukewarm.* | | | |\n\n### Angle 3: \"What you'll see in your own child\" *(was \"Your notes beat any list\")*\nNo homework. Each hook promises something she'll **see**, not something she has to fill in.\n\n| # | Hook | Gloss | Job | What she gets |\n|---|---|---|---|---|\n| 3.1 ✎ *(Anhar's hook, chosen)* | مو كل مرة يرفض فيها طفلك التغيير يعني إنه يعاندك. قبل ما تفرضي عليه التغيير، ابدئي بهذي الأربع خطوات. | Not every time your child refuses change means he's defying you. Before you impose the change on him, start with these four steps. | Conversion | 4 realistic steps before changing something at home |\n| 3.2 *(round 3: \"steps\")* | يسمع باب الثلاجة من آخر البيت، ولما تناديه باسمه ما يلتفت؟ جربي هذي الأربع خطوات، وراح تبدئي تكتشفي ايش اللي يخليه يلتفت لك. | He hears the fridge door from the far end of the house, but when you call his name he doesn't turn? Try these four steps, and you'll start discovering what makes him turn to you. | Conversion | 4 steps she can try today + what she'll see. The slides include a plain \"worth getting his hearing checked\" line |\n| 3.6 *(round 3: offered, not instructed)* | يبكي وما تعرفي ايش يبغى؟ هذي ثلاث أشياء تلاحظيها قبل ما تبدئي تخمني. | He cries and you don't know what he wants? Here are three things to notice before you start guessing. | Conversion | 3 situational things to look at: what just ended, what he was doing, where he was |\n| ~~3.3, 3.4, 3.5~~ | *Cut: homework.* The iPad, food and visit topics are already covered by 1.3, 2.3, 1.2 and 2.1. | | | |\n\n### Count\n13 hooks: **6 attention** (1.4, 2.1–2.5) and **7 conversion** (1.1, 1.2, 1.3, 1.5, 3.1, 3.2, 3.6). That's enough to build concepts and pick 5 + 5.\n\n### For your read-aloud\n- **1.1** «الفرق كله في…» and **2.1** «الحسابات الثلاث»: do these sound like you?\n- **3.2** is still the most sensitive topic. Say if you'd rather drop it.\n- I kept your spelling «رجعه» in 1.4 exactly as you wrote it.\n\n\n---\n\n*Round 1 board is kept in `app/hooks.md`.*\n"}, {"n": 5, "key": "concepts", "title": "Concepts", "subtitle": "The Strategist assembles distinct concepts for you to choose from.", "status": "done", "idea": {"title": "Options, never one answer", "body": "You choose the set to test. Cut, combine, or ask for more."}, "action": {"label": "Pick the concepts to produce.", "phrase": "Produce these."}, "report": "## Concept board: pick 5 attention + 5 conversion\n\n**Round 2:** c4, c6 and c9 revised from Anhar's notes (open picnic parks, no spare room at a friend's house, a tired mother who wants the chore over). The recommended 10 are now marked *picked* (provisional until \"Produce these.\").\n\n13 concepts, one per approved hook (**6 attention, 7 conversion**). Each card in **The concepts** section below shows its hook. The table shows what value each post gives. All of them follow your realism and carousel rules.\n\n| # | Job | Concept | The value she leaves with |\n|---|---|---|---|\n| c1 | conversion | Leaving the house: the 15 minutes before | What to change in the 15 minutes before leaving: don't cut into something he's in the middle of; let the last thing before leaving be something that ends on its own; the shoes come to where he is. Bridge: this is one moment of one area, and the assessment looks at his whole day. |\n| c2 | conversion | Walking into grandma's house | Realistic ways to change the arrival: come before the crowd, start in a quieter room, something of his own in his hand, greetings come to him later instead of everyone at the door. |\n| c3
