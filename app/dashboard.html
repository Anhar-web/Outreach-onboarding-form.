 Same topic as c7: pick one.", "status": "rejected", "format": null}, {"id": "c6", "title": "The عزيمة: three calculations that matter", "job": "attention", "angle": "Your day, named exactly", "hook_ar": "قبل كل عزيمة تحسبي لها ألف حساب؟ هذي الحسابات الثلاث اللي فعلاً تفرق.", "hook_gloss": "Before every family dinner you make a thousand calculations for it? These are the three calculations that actually make a difference.", "value": "Three calculations that work in any house, even a friend's with no spare room: when you arrive (before the crowd) and when you leave (before he's done, not after); where you sit (near the door, near you, away from the TV and speakers); what comes with him from home. ✎ Revised: no 'quiet corner'.", "status": "picked", "format": "slides"}, {"id": "c7", "title": "Lying beside him: you're the one who fell asleep", "job": "attention", "angle": "Your day, named exactly", "hook_ar": "تنسدحي جمبه إلين ما ينام، وتصحي بعد ساعتين وأنتي اللي نمتي؟", "hook_gloss": "You lie beside him until he sleeps, and wake up two hours later because you're the one who fell asleep?", "value": "✎ Rewritten from Anhar's comment: four steps to move away bit by bit toward him sleeping on his own (sit instead of lie, hand then voice, her spot moves toward the door, the same calm words when he gets up). The goal is named, not promised.", "status": "picked", "format": "slides"}, {"id": "c8", "title": "His own plate, same three foods", "job": "attention", "angle": "Your day, named exactly", "hook_ar": "تطبخي للبيت كله، وهو له صحن لحاله فيه نفس الثلاث أكلات كل يوم؟", "hook_gloss": "You cook for the whole house, and he has his own plate with the same three foods every day?", "value": "What his safe foods have in common (colour, crunch, brand, temperature), then one new food that shares that trait, on the side, with no pressure.", "status": "picked", "format": "slides"}, {"id": "c9", "title": "The vacuum", "job": "attention", "angle": "Your day, named exactly", "hook_ar": "يغطي أذنه أول ما تشغلي المكنسة، فصرتي تكنسي وهو نايم؟", "hook_gloss": "He covers his ears the moment you turn on the vacuum, so now you vacuum while he's asleep?", "value": "Zero-prep, for a tired mother who just wants the chore done: the same one word before every switch-on; start in the room farthest from him; leave his way out of the room open. Each takes seconds, with no setup before the chore. No ear defenders, no 'sensory' cause. ✎ Revised for real life.", "status": "picked", "format": "slides"}, {"id": "c10", "title": "He pulls your hand and you try everything", "job": "attention", "angle": "Your day, named exactly", "hook_ar": "يبكي ويسحبك من يدك، وأنتي تجربي كل شي وما تعرفي ايش يبغى؟", "hook_gloss": "He cries and pulls you by the hand, and you try everything and don't know what he wants?", "value": "Situational clues to check first. ⚠ Same topic as c13: pick one.", "status": "rejected", "format": null}, {"id": "c11", "title": "Change isn't defiance", "job": "conversion", "angle": "What you'll see in your own child", "hook_ar": "مو كل مرة يرفض فيها طفلك التغيير يعني إنه يعاندك. قبل ما تفرضي عليه التغيير، ابدئي بهذي الأربع خطوات.", "hook_gloss": "Not every time your child refuses change means he's defying you. Before you impose the change on him, start with these four steps.", "value": "✎ Rewritten by Anhar: someone else (his aunt) does bedtime and he refuses. 4 steps: keep the routine's order, no surprise, keep one part of it with you, start with one simple handover (pyjamas).", "status": "picked", "format": "slides"}, {"id": "c12", "title": "His name vs the fridge door", "job": "conversion", "angle": "What you'll see in your own child", "hook_ar": "يسمع باب الثلاجة من آخر البيت، ولما تناديه باسمه ما يلتفت؟ جربي هذي الأربع خطوات، وراح تبدئي تكتشفي ايش اللي يخليه يلتفت لك.", "hook_gloss": "He hears the fridge door from the far end of the house, but when you call his name he doesn't turn? Try these four steps, and you'll start discovering what makes him turn to you.", "value": "4 steps: in front of him not behind, when he's not absorbed, his name paired with something he loves, closer and lower. Plus a plain 'worth getting his hearing checked' line. No signs, no diagnosis.", "status": "picked", "format": "slides"}, {"id": "c13", "title": "Three things to notice before guessing", "job": "conversion", "angle": "What you'll see in your own child", "hook_ar": "يبكي وما تعرفي ايش يبغى؟ هذي ثلاث أشياء تلاحظيها قبل ما تبدئي تخمني.", "hook_gloss": "He cries and you don't know what he wants? Here are three things to notice before you start guessing.", "value": "Situational: what just ended, what he was doing, where he was (room, noise, light). Not who was near him.", "status": "picked", "format": "slides"}], "posts": [{"id": "p1", "conceptId": "c4", "title": "Coming back from the park starts when you arrive (attention, 7 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nكل رجعه من الحديقة نفس المعركة؟ جهزيه للخروج من اول ما توصلوا، مو آخر خمس دقايق.\n\n(٢)\nهذي أربع أشياء تبدأ من أول ما تفرشوا الفرشه، عشان ما يحس إنكم فجأة قررتوا تمشوا.\n\n(٣)\nأول ما تنزلوا من السيارة، وريه فين وقفتوا.\n\"هذي سيارتنا، نرجع لها بعدين.\"\n\n(٤)\nولما يقرب وقت الرجعة، لمّي الأغراض على مراحل قدامه.\nكيس الأكل أول، بعدين الألعاب، والفرشة آخر شي.\n\n(٥)\nوخلي له شي يشيله بنفسه.\nالكورة، أو شنطته الصغيرة، هو اللي يوديها للسيارة.\n\n(٦)\nوفي السيارة، خلي شي يحبه ينتظره.\nعصير يحبه، أو لعبة ما تطلع إلا في طريق الرجعة.\n\n(٧)\nكذا لما تقولي يلا نمشي، يكون عارف إن وقت الخرجة خلص.", "caption_ar": "الرجعة من الحديقة تبدأ من أول ما تفرشوا.\nأربع أشياء ما تحتاج تجهيز، تسويها وأنتي هناك.", "cta_ar": "", "notes": "**Copywriter's flag:** Built for an open grass park with a picnic blanket; no rides. Every step happens while she's already there (no prep at home) except leaving one juice or toy in the car. Check «تفرشوا» / «الفرشة» is how she'd say spreading the picnic blanket (vs البساط / السفرة).\n\n**Back-translation:**\n\n1. Every trip back from the park is the same battle? Prepare him for leaving from the moment you arrive, not the last five minutes.\n2. Here are four things that start from the moment you spread the blanket, so he doesn't feel you suddenly decided to leave.\n3. As soon as you get out of the car, show him where you parked. \"This is our car, we come back to it later.\"\n4. And when it's nearly time to go, pack up in stages in front of him. The food bag first, then the toys, and the blanket last.\n5. And give him something to carry himself. The ball, or his little bag, he's the one who takes it to the car.\n6. And in the car, leave something he loves waiting for him. A juice he likes, or a toy that only comes out on the way home.\n7. That way, when you say 'come on, let's go', he knows the outing time is over."}, {"id": "p2", "conceptId": "c6", "title": "The عزيمة: three calculations that matter (attention, 7 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nقبل كل عزيمة تحسبي لها ألف حساب؟ هذي الحسابات الثلاث اللي فعلاً تفرق.\n\n(٢)\nالحساب الأول: متى توصلي ومتى تمشي.\nحاولي توصلي بدري قبل ما يمتلئ المجلس. كذا يدخل والمكان لسه هادي.\n\n(٣)\nوامشي وهو لسه مبسوط، مو بعد ما يبدأ الصياح.\nالطلعة وهو مرتاح أخف عليك بكثير من الطلعة وكل العيون عليكم.\n\n(٤)\nالحساب الثاني: فين تجلسي.\nقريب من الباب، وهو جمبك، وبعيد عن التلفزيون والسماعات.\n\n(٥)\nقريب من الباب عشان لو احتاج يطلع شوي، تطلعوا بهدوء بدون ما تمروا قدام الكل.\n\n(٦)\nالحساب الثالث: ايش يجي معاه من البيت.\nكوبه، وأكلة يعرفها، وشي يمسكه بيده.\n\n(٧)\nهذي الثلاث تنحسب في البيت قبل ما تطلعي.\nعشان لما توصلي، تقدري تجلسي مع أهلك بدل ما تقضي العزيمة كلها وراه من غرفة لغرفة.", "caption_ar": "الألف حساب تنزل لثلاث.\nمتى توصلي، فين تجلسي، وايش يجي معاه من البيت.", "cta_ar": "", "notes": "**Copywriter's flag:** No quiet room assumed; everything is what she controls (arrival, exit, seat, what she brings). Leaving 'while he's still happy' can mean leaving before dinner is served at a Saudi عزيمة, which is socially awkward. Check she'd accept that, or whether it should read 'leave a little earlier than usual'.\n\n**Back-translation:**\n\n1. Before every family gathering you make a thousand calculations for it? These are the three calculations that actually make a difference.\n2. The first: when you arrive and when you leave. Try to arrive early, before the majlis fills up. That way he walks in while the place is still quiet.\n3. And leave while he's still happy, not after the screaming starts. Leaving while he's calm is much lighter on you than leaving with every eye on you both.\n4. The second: where you sit. Near the door, with him beside you, and away from the TV and the speakers.\n5. Near the door so that if he needs to step out for a bit, you both slip out calmly without walking past everyone.\n6. The third: what comes with him from home. His cup, a food he knows, and something to hold in his hand.\n7. These three get worked out at home before you leave. So that when you arrive, you can sit with your family instead of spending the whole gathering behind him from room to room."}, {"id": "p3", "conceptId": "c7", "title": "Lying beside him: step back bit by bit (attention, 8 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nتنسدحي جمبه إلين ما ينام، وتصحي بعد ساعتين وأنتي اللي نمتي؟\n\n(٢)\nوكل ليلة نفس القصة.\nهو ما ينام إلا وأنتي جمبه، وأنتي تبغيه ينام لحاله.\n\n(٣)\nهذي أربع خطوات تبعدي فيها عنه شوي شوي، بدون ما تختفي من الغرفة فجأة.\n\n(٤)\nالخطوة الأولى: بدل ما تنسدحي جمبه، اجلسي جمب سريره.\nنفس القرب، بس أنتي جالسة، وما راح تنامي قبله.\n\n(٥)\nالخطوة الثانية: يدك على ظهره في البداية.\nوبعد كم ليلة، صوتك بس، بدون يدك.\n\n(٦)\nالخطوة الثالثة: كل كم ليلة، مكانك يبعد شوي.\nمن جمب السرير، لنص الغرفة، لعند الباب.\n\n(٧)\nالخطوة الرابعة: إذا قام من سريره، رجعيه بهدوء وبنفس الكلمتين كل مرة.\nبدون نقاش، وبدون ما تنسدحي جمبه من جديد.\n\n(٨)\nتاخذ وقت، بس كل ليلة أنتي أبعد بخطوة.\nوالهدف ليلة تطلعي فيها من الغرفة وهو لسه صاحي.", "caption_ar": "من جمبه على السرير، لعند الباب.\nخطوة كل كم ليلة.", "cta_ar": "", "notes": "**Copywriter's flag:** Rewritten from Anhar's comment: the goal is him sleeping on his own, not working around it, and 'finish your chores first' was unrealistic. Gradual step-back (sit, hand, voice, spot moves toward the door). The goal is named as a goal, not promised. No timeline promised.\n\n**Back-translation:**\n\n1. You lie down beside him until he sleeps, and wake up two hours later and you're the one who fell asleep?\n2. And every night it's the same story. He only sleeps with you beside him, and you want him to sleep on his own.\n3. Here are four steps where you move away from him bit by bit, without disappearing from the room suddenly.\n4. The first: instead of lying down beside him, sit beside his bed. The same closeness, but you're sitting, and you won't fall asleep before him.\n5. The second: your hand on his back at the start. And after a few nights, just your voice, without your hand.\n6. The third: every few nights, your spot moves a little further. From beside the bed, to the middle of the room, to the door.\n7. The fourth: if he gets out of bed, take him back calmly with the same two words every time. No discussion, and without lying down beside him again.\n8. It takes time, but every night you're one step further. And the goal is a night when you walk out of the room while he's still awake."}, {"id": "p4", "conceptId": "c8", "title": "His own plate: find what his three foods share (attention, 7 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nتطبخي للبيت كله، وهو له صحن لحاله فيه نفس الثلاث أكلات كل يوم؟\n\n(٢)\nقبل ما تجربي أكل جديد، لاحظي ايش يجمع الأكلات الثلاث اللي ياكلها.\n\n(٣)\nإذا صحنه نقت وبطاطس وتوست، كلها مقرمشة ولونها ذهبي.\n\n(٤)\nومرات اللي يجمعها ماركة وحدة ما تتغير، أو إنها لازم تكون باردة.\n\n(٥)\nولما تلاحظي الشي المشترك، اختاري أكلة وحدة من السفرة فيها نفس الشي.\nحبة فلافل، أو قطعة تميس.\n\n(٦)\nحطيها في صحن صغير جمب صحنه، مو داخله.\nبدون ما تطلبي منه يذوقها، وبدون أي تعليق.\n\n(٧)\nإذا لمسها أو شمها، هذا يكفي اليوم.\nوبكرة نفس الحبة، في نفس الصحن الصغير، جمب صحنه.", "caption_ar": "ما تحتاجي تطبخي له شي زيادة.\nأكلة وحدة من سفرتكم، جمب صحنه، وبدون ضغط.", "cta_ar": "", "notes": "**Copywriter's flag:** Zero extra cooking: the new food comes from what she already made for the family. Separate small plate because many of these children reject a plate where foods touch. Research advises sending her to a doctor if he's losing weight; left out because of the no-specialist rule. Flag if Anhar wants a line. Check فلافل / تميس fit her table (swap for whatever crunchy golden food is common at hers).\n\n**Back-translation:**\n\n1. You cook for the whole house, and he has his own plate with the same three foods every day?\n2. Before you try a new food, notice what the three foods he eats have in common.\n3. If his plate is nuggets, fries and toast, they're all crunchy and golden.\n4. And sometimes what they share is one brand that never changes, or that they have to be cold.\n5. And once you notice the shared thing, pick one food from the table that has the same thing. A falafel, or a piece of tamees bread.\n6. Put it on a small plate beside his plate, not on it. Without asking him to taste it, and without any comment.\n7. If he touches it or smells it, that's enough for today. And tomorrow the same piece, on the same small plate, beside his plate."}, {"id": "p5", "conceptId": "c9", "title": "The vacuum: three things that take seconds (attention, 7 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nيغطي أذنه أول ما تشغلي المكنسة، فصرتي تكنسي وهو نايم؟\n\n(٢)\nوتقولي بكنس لما ينام، ولما ينام ما عاد فيكي حيل.\n\n(٣)\nهذي ثلاث أشياء ما تاخذ إلا ثواني، وأنتي ماسكة المكنسة.\n\n(٤)\nقبل ما تضغطي الزر، قولي كلمة وحدة: \"مكنسة\".\nنفس الكلمة، بنفس الصوت، كل مرة.\n\n(٥)\nابدئي من أبعد غرفة عنه، مو من الغرفة اللي هو فيها.\nالصوت يقرب شوي شوي، بدل ما يبدأ جمبه.\n\n(٦)\nولا توقفي بالمكنسة بينه وبين الباب.\nإذا بغى يبعد، طريقه مفتوح.\n\n(٧)\nعشان الكنس يرجع للعصر، مو لآخر الليل وأنتي تعبانة.", "caption_ar": "ثلاث أشياء تسويها وأنتي ماسكة المكنسة.\nبدون تجهيز، وبدون ما تأجلي الكنس لآخر الليل.", "cta_ar": "", "notes": "**Copywriter's flag:** No ear defenders, no 'sensory' cause, no setup before the chore. Last slide is her outcome (when she vacuums), framed with عشان rather than a promise about him. Check «مكنسة» as the one word: she may prefer her own word, and the slide reads fine either way.\n\n**Back-translation:**\n\n1. He covers his ears the moment you turn on the vacuum, so now you vacuum while he's asleep?\n2. And you tell yourself you'll vacuum when he sleeps, and when he sleeps you've got no energy left.\n3. Here are three things that take only seconds, while you're holding the vacuum.\n4. Before you press the button, say one word: \"vacuum\". The same word, in the same voice, every time.\n5. Start from the room farthest from him, not the room he's in. The sound gets closer bit by bit, instead of starting right beside him.\n6. And don't stand with the vacuum between him and the door. If he wants to move away, his way out is open.\n7. So vacuuming goes back to the afternoon, not the end of the night when you're exhausted."}, {"id": "p6", "conceptId": "c1", "title": "Leaving the house: the 15 minutes before the shoes (conversion, 7 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nيبدأ الصراخ أول ما تجيبي الجزمة عشان تطلعوا؟ الفرق كله في الربع ساعة اللي قبلها.\n\n(٢)\nلما تجي الجزمة وهو لسه مستمتع باللعب، طبيعي ما يبغى يوقف.\n\n(٣)\nهذي ثلاث أشياء في الربع ساعة اللي قبل الطلعة.\n\n(٤)\nقبل الطلعة بربع ساعة، لا تبدئي معاه شي جديد يحتاج وقت.\nلا آيباد ولا غيره.\n\n(٥)\nوخلي آخر شي قبل الطلعة حاجة بسيطة يخلصها على راحته.\nعصير يشربه، أو بسكوتة ياكلها. يخلص منها، وبعدها تطلعوا.\n\n(٦)\nلا تناديه يجي للباب عشان يلبس الجزمة.\nخذيها له مكانه، ولبّسيه وهو جالس، وبعدها اطلعوا.\n\n(٧)\nالطلعة موقف واحد بس.\nالتقييم المجاني يساعدك تشوفي الصورة الأكبر، وتعرفي من فين تبدئي.", "caption_ar": "الصراخ عند الجزمة يبدأ قبلها بربع ساعة.\nثلاث أشياء تغيريها في هذي الربع ساعة.", "cta_ar": "التقييم المجاني في الرابط اللي في البايو.", "notes": "**Copywriter's flag:** Each step happens inside the 15 minutes she already has; nothing to prepare earlier. Bridge says 'one moment' and 'six areas', no promise for him. Check «ومحد قطعها» reads naturally (the juice ended by itself, nobody took it away).\n\n**Back-translation:**\n\n1. The screaming starts the moment you bring the shoes to go out? The whole difference is in the quarter hour before it.\n2. When the shoes come while he's still enjoying playing, naturally he doesn't want to stop.\n3. Here are three things for the quarter hour before going out.\n4. A quarter hour before going out, don't start anything new with him that takes time. No iPad, nothing else either.\n5. And make the last thing before going out something simple he finishes at his own pace. A juice he drinks, or a biscuit he eats. He finishes it, and then you go out.\n6. Don't call him to come to the door to put on his shoes. Take them to where he is, put them on him while he's sitting, and then go out.\n7. Going out is just one situation. The free assessment helps you see the bigger picture, and know where to start."}, {"id": "p7", "conceptId": "c3", "title": "The iPad: what comes after is ready first (conversion, 6 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nتسحبي الآيباد ويبدأ الصراخ؟ جهزي اللي بعده قبل ما تسحبيه.\n\n(٢)\nتسحبيه، فيصرخ ويحاول ياخذه، وكل شي تعطيه بعدها يقابله بـ لا.\n\n(٣)\nقبل ما تسحبيه، جهزي له شي ينتقل له على طول.\nصحن بسكوت على الطاولة، أو العاب جاهزة على الأرض جنبه.\n\n(٤)\nبس لا تخلي اللي بعده شي دايما يرفضه.\nتسحبي الآيباد، وعلى طول تقولي يلا شاور؟ كذا صار قدامه سبب ثاني يعترض عليه.\n\n(٥)\nوبعد ما تخلصوا، رجعي الآيباد مكانه. لا تتركيه قدامه على الطاولة.\n\n(٦)\nوالموضوع مو بس الآيباد.\nفيه مواقف تتكرر وقت النوم والأكل والطلعات وغيرها.\nالتقييم المجاني يساعدك تشوفي الصورة الأكبر وتحددي أول خطوة.\nالرابط في البايو.", "caption_ar": "قبل ما يروح الآيباد، خلي اللي بعده قدام عينه.\nومو شاور.", "cta_ar": "الرابط في البايو.", "notes": "**Copywriter's flag:** Slides 2–6 rewritten by Anhar.\n\n**Back-translation:**\n\n1. You take the iPad and the screaming starts? Get what comes after ready before you take it.\n2. You take it, so he screams and tries to grab it, and everything you give him after that he meets with 'no'.\n3. Before you take it, get something ready for him to move to straight away. A plate of biscuits on the table, or toys ready on the floor beside him.\n4. But don't make the next thing something he always refuses. You take the iPad and straight away say 'come on, shower'? Now he has a second reason to object.\n5. And once you're done, put the iPad back in its place. Don't leave it in front of him on the table.\n6. And it's not just the iPad. There are situations that repeat at bedtime, mealtimes, outings and more. The free assessment helps you see the bigger picture and pick your first step. The link is in the bio."}, {"id": "p8", "conceptId": "c11", "title": "Change isn't defiance: when someone else does bedtime (conversion, 8 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nمو كل مرة يرفض فيها طفلك التغيير يعني إنه يعاندك. قبل ما تفرضي عليه التغيير، ابدئي بهذي الأربع خطوات.\n\n(٢)\nكل ليلة إنتي تجهزيه للنوم. اليوم خالته موجودة، وأول ما قربت منه رفض يدخل الغرفة معاها.\n\n(٣)\nهو متعود إنك إنتي اللي تجهزيه، وفجأة شخص ثاني أخذ مكانك.\n\n(٤)\nالخطوة الأولى: لا تغيري الروتين كله. خلي وقت النوم وترتيب خطواته زي ما تعود.\n\n(٥)\nالخطوة الثانية: لا تخلي التغيير مفاجأة. قولي له من بدري إن خالته بتساعده اليوم.\n\n(٦)\nالخطوة الثالثة: خلي جزء من الروتين زي ما هو. لو متعود تقرأوا قصة، خليها معاكي.\n\n(٧)\nالخطوة الرابعة: ابدئي بخطوة بسيطة. خلي خالته تساعده في لبس البيجامة، وإنتي كمّلي باقي الروتين.\n\n(٨)\nتغيير شخص واحد ممكن يغيّر تجربة كاملة. التقييم المجاني يساعدك تشوفي جوانب مختلفه من يومه. الرابط في البايو.", "caption_ar": "كل ليلة إنتي اللي تجهزيه، واليوم خالته؟\nأربع خطوات قبل ما يتغير أي شي في روتينه.", "cta_ar": "الرابط في البايو.", "notes": "**Copywriter's flag:** Rewritten by Anhar (all 8 slides). Caption updated by the Director to match the new scene.\n\n**Back-translation:**\n\n1. Not every time your child refuses change means he's defying you. Before you impose the change on him, start with these four steps.\n2. Every night you get him ready for bed. Today his aunt is here, and as soon as she came near him he refused to go into the room with her.\n3. He's used to you being the one who gets him ready, and suddenly someone else took your place.\n4. Step one: don't change the whole routine. Keep bedtime and the order of its steps the way he's used to.\n5. Step two: don't make the change a surprise. Tell him early on that his aunt will help him today.\n6. Step three: keep part of the routine as it is. If you usually read a story, keep that with you.\n7. Step four: start with a simple step. Let his aunt help him put on his pyjamas, and you finish the rest of the routine.\n8. Changing one person can change a whole experience. The free assessment helps you see different areas of his day. The link is in the bio."}, {"id": "p9", "conceptId": "c12", "title": "His name vs the fridge door: four steps (conversion, 8 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nيسمع باب الثلاجة من آخر البيت، ولما تناديه باسمه ما يلتفت؟ جربي هذي الأربع خطوات، وراح تبدئي تكتشفي ايش اللي يخليه يلتفت لك.\n\n(٢)\nالخطوة الأولى: من قدامه، مو من وراه.\nخليه يشوفك وأنتي تقولي اسمه.\n\n(٣)\nالخطوة الثانية: وهو فاضي، مو وهو مندمج في لعبة أو قدام شاشة.\n\n(٤)\nالخطوة الثالثة: اسمه، وبعده على طول شي يحبه.\n\"فهد، بسكوت!\" والبسكوتة في يدك يشوفها.\n\n(٥)\nالخطوة الرابعة: قربي منه وانزلي لطوله.\nمن جمبه، وعيونك قدام عيونه، مو من آخر الصالة.\n\n(٦)\nولاحظي مع أي وحدة فيهم يلتفت لك أكثر.\nهذي اللي تبدئي منها.\n\n(٧)\nوإذا سمعه ما انفحص قبل، فحص السمع خطوة بسيطة تستاهل تسويها.\n\n(٨)\nالاسم جزء من تواصله، والتواصل واحد من ستة جوانب في يومه.\nالتقييم المجاني في البايو يمر عليها كلها.", "caption_ar": "قدامه، وهو فاضي، مع شي يحبه، ومن قريب.\nلاحظي أي وحدة يلتفت معاها.", "cta_ar": "التقييم المجاني في البايو يمر عليها كلها.", "notes": "**Copywriter's flag:** Hearing line is one plain practical sentence, no 'signs', no doctor/specialist framing. «فهد» is a placeholder example name. CTA is folded into the bridge slide to keep 8 slides; least sure the last line «ورابطه في البايو» lands as a clear CTA vs a separate short CTA slide.\n\n**Back-translation:**\n\n1. He hears the fridge door from the far end of the house, but when you call his name he doesn't turn? Try these four steps, and you'll start discovering what makes him turn to you.\n2. The first: from in front of him, not from behind. Let him see you while you say his name.\n3. The second: when he's free, not when he's absorbed in a game or in front of a screen.\n4. The third: his name, and right after it something he loves. \"Fahad, biscuit!\" with the biscuit in your hand where he can see it.\n5. The fourth: come close and get down to his height. From beside him, your eyes in front of his eyes, not from the far end of the living room.\n6. And notice with which one of them he turns to you most. That's the one you start from.\n7. And if his hearing hasn't been checked before, a hearing check is a simple step worth doing.\n8. His name is part of how he communicates, and communication is one of six areas of his day. The free assessment in the bio goes through all of them."}, {"id": "p10", "conceptId": "c13", "title": "He cries: three things to notice before guessing (conversion, 7 slides)", "format": "slides", "status": "draft", "score": null, "body_ar": "(١)\nيبكي وما تعرفي ايش يبغى؟ هذي ثلاث أشياء تلاحظيها قبل ما تبدئي تخمني.\n\n(٢)\nتجيبي له موية، وبعدها أكل، وبعدها لعبته، وهو يبكي أكثر.\n\n(٣)\nأول شي: ايش اللي صار قبل البكا بشوي.\nالآيباد طفى أو رجعتوا من طلعه أو خلص الاكل اللي في صحنه.\n\n(٤)\nثاني شي: ايش كان يسوي لما بدأ.\nيحاول يركب قطعة وما ركبت، أو يدور على لعبة وما لقاها.\n\n(٥)\nثالث شي: فين كان.\nفي المطبخ والخلاط شغال، أو في الصالة والتلفزيون عالي، أو في غرفة نورها قوي.\n\n(٦)\nهذي الثلاث تلاحظيها في ثواني، وهو لسه يبكي.\nوبدل ما تجربي كل شي، تبدئي من وحدة منهم.\n\n(٧)\nوإذا البكا يتكرر كل يوم، التقييم المجاني يساعدك تشوفي يومه كامل وتعرفي من فين تبدئي، بدل ما تخمني.\nالرابط في البايو.", "caption_ar": "قبل ما تجيبي الموية والأكل واللعبة،\nثلاث أشياء تلاحظيها في ثواني.", "cta_ar": "الرابط في البايو.", "notes": "**Copywriter's flag:** Only situational triggers (what ended, what he was doing, where); no 'who was near him'. Slide 5 names noise and light as places, not as a cause, to stay off 'sensory'. Observing is in the moment, no logging. Check slide 7 at ~25 words; could drop «من نومه لأكله لطلعاته» if it's too dense.\n\n**Back-translation:**\n\n1. He cries and you don't know what he wants? Here are three things to notice before you start guessing.\n2. You bring him water, then food, then his toy, and he cries harder.\n3. First thing: what happened just before the crying. The iPad switched off, or you came back from an outing, or the food on his plate ran out.\n4. The second: what he was doing when it started. Trying to fit a piece that wouldn't fit, or looking for a toy and not finding it.\n5. The third: where he was. In the kitchen with the blender on, or in the living room with the TV loud, or in a room with strong light.\n6. You notice these three in seconds, while he's still crying. And instead of trying everything, you start from one of them.\n7. And if the crying repeats every day, the free assessment helps you see his whole day and know where to start, instead of guessing. The link is in the bio."}], "performance": []};/*__END__*/
(function(){
const ARRE=/[\u0600-\u06FF]/;
let state=null,last="",sel=null;
try{const t=localStorage.getItem("sma-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function inl(s){s=esc(s);return s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>")}
function dirA(t){return ARRE.test(t)?' dir="auto"':''}
function md(src){if(!src)return"";const L=src.split("\n");let h="",i=0;
 while(i<L.length){let l=L[i];
  if(/^\s*\|/.test(l)){const rows=[];while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
   const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
   h+="<table>";rows.forEach((r,k)=>{if(/^\s*\|[\s:\-|]+\|\s*$/.test(r))return;const tg=k==0?"th":"td";h+="<tr>"+cells(r).map(c=>`<${tg}${dirA(c)}>${inl(c)}</${tg}>`).join("")+"</tr>"});h+="</table>";continue}
  let m;
  if(m=l.match(/^(#{1,4})\s+(.*)/)){h+=`<h${m[1].length+1}${dirA(m[2])}>${inl(m[2])}</h${m[1].length+1}>`;i++;continue}
  if(/^>\s?/.test(l)){let b=[];while(i<L.length&&/^>\s?/.test(L[i])){b.push(L[i].replace(/^>\s?/,""));i++}h+=`<blockquote${dirA(b.join(" "))}>${b.map(inl).join("<br>")}</blockquote>`;continue}
  if(/^\s*[-*]\s+/.test(l)){h+="<ul>";while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){const t=L[i].replace(/^\s*[-*]\s+/,"");h+=`<li${dirA(t)}>${inl(t)}</li>`;i++}h+="</ul>";continue}
  if(/^\s*\d+[.)]\s+/.test(l)){h+="<ol>";while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i])){const t=L[i].replace(/^\s*\d+[.)]\s+/,"");h+=`<li${dirA(t)}>${inl(t)}</li>`;i++}h+="</ol>";continue}
  if(!l.trim()){i++;continue}
  let p=[];while(i<L.length&&L[i].trim()&&!/^(#|>|\s*[-*]\s|\s*\d+[.)]\s|\s*\|)/.test(L[i])){p.push(L[i]);i++}
  h+=`<p${dirA(p.join(" "))}>${p.map(inl).join("<br>")}</p>`}
 return h}
function sc(s){return "s-"+(s||"idle")}
function flag(s){return {idle:"Waiting","working":"Working","needs-you":"Needs you","done":"Confirmed"}[s]||s}
function rtl(t){return t?`<div class="rtl" dir="rtl">${esc(t)}</div>`:""}
function render(){const S=state;if(!S){document.getElementById("app").innerHTML='<div class="wait serif">Waiting for the agency to start…</div>';return}
 const cur=S.currentStep||1;if(sel==null)sel=cur;const step=S.steps.find(s=>s.n==sel)||S.steps[0];
 let h=`<header><div class="logo">مدار</div><div><h1 class="serif">Social Media Agency</h1><div class="mono">${esc(S.project)}</div></div><span class="spacer"></span>
 <span class="chip">Updated ${S.updatedAt?new Date(S.updatedAt).toLocaleString():"—"}</span><button class="toggle" id="tg">◐ Theme</button></header>`;
 h+=`<nav class="stepper">`+S.steps.map(s=>`<button class="st ${s.n==cur?"cur":""} ${s.n==sel?"sel":""}" data-n="${s.n}"><span class="dot ${sc(s.status)}">${s.status=="done"?"✓":s.n}</span><span class="lbl">${esc(s.title)}</span></button>`).join("")+`</nav>`;
 const a=step.action||{};
 h+=`<section class="card det"><div class="mono">Step ${step.n} of ${S.steps.length} &nbsp;<span class="pill ${sc(step.status)}">${flag(step.status)}</span></div>
 <h2 class="serif">${esc(step.title)}</h2><p class="sub">${esc(step.subtitle)}</p>
 ${step.idea?`<details class="idea"><summary>The idea behind this step</summary><h4>${esc(step.idea.title)}</h4><div>${esc(step.idea.body)}</div></details>`:""}
 <div class="action"><div class="row"><span class="mono">Your action</span><span class="pill ${sc(step.status)}">${step.status=="needs-you"?"Needs you":step.status=="done"?"Confirmed":"Waiting"}</span></div>
 <div style="margin-top:6px">${esc(a.label)}</div>
 ${a.phrase?`<button class="send" data-p="${esc(a.phrase)}">Send: “${esc(a.phrase)}”</button><div class="hint">Type this phrase in your chat to move the agency to the next step.</div>`:""}</div>
 <div class="md">${md(step.report)||'<p class="sub">No report yet.</p>'}</div></section>`;
 h+=`<h3 class="sec">The agency</h3><div class="grid">`+S.plan.specialists.map(p=>`<div class="sp"><div class="av ${sc(p.status)}">${esc(p.key)}</div><div><b>${esc(p.name)}</b><span>${esc(p.role)}</span></div></div>`).join("")+`</div>`;
 h+=`<h3 class="sec">The scorecard</h3><div class="card">`+S.scorecard.items.map(it=>`<div class="sc"><span>${esc(it.name)}</span><div class="bar"><i style="width:${it.score!=null?Math.round(100*it.score/it.weight):0}%"></i></div><b>${it.score!=null?it.score:it.weight}</b></div>`).join("")+`<div class="mono" style="margin-top:8px">Total ${S.scorecard.total} · Trust & safety is a gate</div></div>`;
 if(S.concepts&&S.concepts.length){h+=`<h3 class="sec">The concepts</h3><div class="cg">`+S.concepts.map(c=>`<div class="cc ${c.status}"><span class="tag j-${c.job}">${esc(c.job)}</span>${c.status=="picked"?'<span class="tag" style="color:var(--accent);border-color:var(--accent)">picked</span>':""}${c.format?`<span class="tag">${esc(c.format)}</span>`:""}
 <div class="serif" style="font-size:17px;margin-top:6px">${esc(c.id)} · ${esc(c.title)}</div><div style="font-size:13px;color:var(--muted)">${esc(c.angle)}</div>${rtl(c.hook_ar)}<div class="gloss">${esc(c.hook_gloss)}</div></div>`).join("")+`</div>`}
 if(S.posts&&S.posts.length){h+=`<h3 class="sec">The posts</h3>`+S.posts.map(p=>`<div class="card">${p.score!=null?`<span class="score" style="background:${p.score<70?"var(--working)":"var(--done)"}">${p.score}</span>`:""}
 <div class="serif" style="font-size:19px">${esc(p.id)} · ${esc(p.title)}</div><span class="tag">${esc(p.format)}</span><span class="tag">${esc(p.status)}</span>
 ${rtl(p.body_ar)}${p.caption_ar?`<div class="mono">Caption</div>${rtl(p.caption_ar)}`:""}${p.notes?`<div class="md" style="font-size:13px">${md(p.notes)}</div>`:""}</div>`).join("")}
 h+=`<h3 class="sec">Performance</h3><div class="card"><p class="sub">Partial numbers are fine.</p>`;
 const rows=(S.performance||[]).filter(r=>["views","likes","saves","comments","profileVisits","assessmentStarts"].some(k=>r[k]!=null));
 const d=v=>v==null||v===""?"—":esc(v);
 if(rows.length){h+=`<div class="md"><table><tr><th>Post</th><th>Job</th><th>Format</th><th>Views</th><th>Likes</th><th>Saves</th><th>Comments</th><th>Profile</th><th>Assess.</th></tr>`+rows.map(r=>`<tr><td>${d(r.postId)}</td><td>${d(r.job)}</td><td>${d(r.format)}</td><td>${d(r.views)}</td><td>${d(r.likes)}</td><td>${d(r.saves)}</td><td>${d(r.comments)}</td><td>${d(r.profileVisits)}</td><td>${d(r.assessmentStarts)}</td></tr>`).join("")+`</table></div>`}
 h+=`<div class="note">To feed the next batch, just tell the agency in chat — then say “what's working?” and the Analyst reads the numbers into the next brief. No spreadsheet.</div></div>`;
 document.getElementById("app").innerHTML=h;
 document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{sel=+b.dataset.n;render()});
 document.querySelectorAll(".send").forEach(b=>b.onclick=()=>{const p=b.dataset.p;(navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(()=>{b.textContent="Copied ✓"},()=>{b.textContent=p})});
 document.getElementById("tg").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("sma-theme",r.dataset.theme)}catch(e){}};
}
function apply(s){const j=JSON.stringify(s);if(j===last)return;const prev=state&&state.currentStep;state=s;last=j;if(prev&&prev!==s.currentStep)sel=s.currentStep;render()}
function poll(){fetch("state.json",{cache:"no-store"}).then(r=>r.json()).then(apply).catch(()=>{if(!state)render()})}
document.addEventListener("DOMContentLoaded",()=>{if(window.__STATE__)apply(window.__STATE__);poll();setInterval(poll,2000)});
})();
</script>
<div id="app"></div>
</body>
</html>
