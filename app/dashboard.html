is ears the moment you turn on the vacuum, so now you vacuum while he's asleep?\n2. And you tell yourself you'll vacuum when he sleeps, and when he sleeps you've got no energy left.\n3. Here are three things that take only seconds, while you're holding the vacuum.\n4. First thing: before you turn it on, tell him \"I'm turning on the vacuum.\" The same sentence every time, so he knows the sound is coming.\n5. Second thing: start from the room farthest from him, not the room he's in. That way the sound gets closer bit by bit, instead of starting right beside him.\n6. Third thing: don't stand with the vacuum between him and the door. If he wants to move away, his way out is open.\n7. And the goal is that you vacuum in the afternoon while he's awake, instead of waiting until he sleeps."}, {"id": "p10", "conceptId": "c13", "title": "He cries: three things to notice before guessing (conversion, 7 slides)", "format": "slides", "status": "final", "score": 86, "body_ar": "(١)\nيبكي وما تعرفي ايش يبغى؟ هذي ثلاث أشياء تلاحظيها قبل ما تبدئي تخمني.\n\n(٢)\nتجيبي له موية، وبعدها أكل، وبعدها لعبته، وهو يبكي أكثر.\n\n(٣)\nأول شي: ايش اللي صار قبل البكا بشوي.\nالآيباد طفى أو رجعتوا من طلعه أو خلص الاكل اللي في صحنه.\n\n(٤)\nثاني شي: ايش كان يسوي لما بدأ.\nيحاول يركب قطعة وما ركبت، أو يدور على لعبة وما لقاها.\n\n(٥)\nثالث شي: فين كان.\nفي المطبخ والخلاط شغال، أو في الصالة والتلفزيون عالي، أو في غرفة نورها قوي.\n\n(٦)\nهذي الثلاث تلاحظيها في ثواني، وهو لسه يبكي.\nكذا بدل ما تجربي كل شي، تبدئي من وحدة منهم.\n\n(٧)\nإذا البكا يتكرر كل يوم، التقييم المجاني يساعدك تشوفي يومه كامل بدل ما تخمني.\nالرابط في البايو.", "caption_ar": "قبل ما تجيبي الموية والأكل واللعبة،\nثلاث أشياء تلاحظيها في ثواني.", "cta_ar": "الرابط في البايو.", "notes": "**Score: 86/100**\n\n**Skimmer:** Stops: 'he cries and you don't know what he wants' is every day. s2's water, then food, then toy, 'and he cries harder' is her exact loop. Reads on.\n\n**Cynic:** The three questions are real and situational, not 'is he hungry?'. Noticing in seconds is plausible. But then what? 'Start from one of them' doesn't tell her what to do once she knows it was the iPad switching off. She gets a diagnosis of the moment, not a move. Partly useful.\n\n**Cautious:** Trusts it: no cause, 'if it repeats every day' is honest and not pushy, and «بدل ما تخمني» ties back to the hook. Clearest reason to tap in the batch.\n\n| Item | Score | Why |\n|---|---|---|\n| Scroll-stop (16) | 12 | Relatable, slightly general first line. |\n| Recognition (14) | 14 | s2 is the guessing loop, beat by beat. |\n| Usable value (14) | 9 | Noticing is concrete, but there's no action after noticing. |\n| Emotion, not apathy (12) | 10 | s2 builds real helplessness, and the guessing relief lands. |\n| Her own words (10) | 9 | Her edits: ايش اللي صار, رجعتوا من طلعه. |\n| Trust & safety (10) | 9 | Clean; s5 noise/light edges toward a sensory hint, kept as places. |\n| Arabic naturalness (8) | 7 | Natural; طلعه/الاكل spelling. |\n| One job (7) | 7 | One job, one thread from hook to CTA. |\n| Next step (5) | 5 | Honest qualifier, hook-tied reason, link in bio. |\n| The turn (4) | 4 | 'Instead of trying everything, start from one' is the right turn. |\n| **Total** | **86/100** | |\n\n**Push it higher:**\n- Add one line to s6 showing the move: «لو كان الآيباد طفى، يمكن يحتاج وقت ينتقل. لو كان في الصالة والتلفزيون عالي، طلعيه منها.»\n- Shorten s5 to two places so it reads at a glance.\n- Caption: lead with the hook question, not the list.\n\n**Gate:** PASS\n\n**Arabic Voice Editor:**\n\n- s6: «وبدل ما تجربي كل شي…» → «كذا بدل ما تجربي كل شي…». Why: her كذا cause→effect (pattern 4).\n- s7: dropped the opening و and «وتعرفي من فين تبدئي» (s6 already says تبدئي). Why: bridge + CTA must be short (Part 5); kept «بدل ما تخمني», which ties back to the guessing hook.\n- s4, s5 and caption already sound like her. Unchanged. Mild note: s5 «غرفة نورها قوي» / noise are places, not a cause; kept.\n\n**Back-translation:**\n\n1. He cries and you don't know what he wants? Here are three things to notice before you start guessing.\n2. You bring him water, then food, then his toy, and he cries harder.\n3. First thing: what happened just before the crying. The iPad switched off, or you came back from an outing, or the food on his plate ran out.\n4. The second: what he was doing when it started. Trying to fit a piece that wouldn't fit, or looking for a toy and not finding it.\n5. The third: where he was. In the kitchen with the blender on, or in the living room with the TV loud, or in a room with strong light.\n6. You notice these three in seconds, while he's still crying. That way, instead of trying everything, you start from one of them.\n7. If the crying repeats every day, the free assessment helps you see his whole day instead of guessing. The link is in the bio."}, {"id": "p2", "conceptId": "c6", "title": "The عزيمة: three calculations that matter (attention, 7 slides)", "format": "slides", "status": "final", "score": 85, "body_ar": "(١)\nقبل كل عزيمة تحسبي لها ألف حساب؟ هذي الحسابات الثلاث اللي فعلاً تفرق.\n\n(٢)\nالحساب الأول: متى توصلي ومتى تمشي.\nحاولي توصلي بدري قبل ما يمتلئ المجلس. كذا يدخل والمكان لسه هادي.\n\n(٣)\nوامشي وهو لسه مبسوط، مو بعد ما يبدأ الصياح.\nالطلعة وهو مرتاح أخف عليك بكثير من الطلعة وكل العيون عليكم.\n\n(٤)\nالحساب الثاني: فين تجلسي.\nقريب من الباب، وهو جمبك، وبعيد عن التلفزيون والسماعات.\n\n(٥)\nكذا لو احتاج يطلع شوي، تطلعوا بهدوء بدون ما تمروا قدام الكل.\n\n(٦)\nالحساب الثالث: ايش يجي معاه من البيت.\nكوبه، وأكلة يعرفها، وشي يمسكه بيده.\n\n(٧)\nهذي الثلاث تنحسب في البيت قبل ما تطلعي.\nعشان لما توصلي، تقدري تجلسي مع أهلك بدل ما تقضي العزيمة كلها وراه من غرفة لغرفة.", "caption_ar": "من الألف حساب اللي تحسبيها قبل العزيمة، ثلاث بس اللي فعلاً تفرق:\nمتى توصلي وتمشي، فين تجلسي، وايش يجي معاه من البيت.", "cta_ar": "", "notes": "**Score: 85/100**\n\n**Skimmer:** Stops instantly: «تحسبي لها ألف حساب» is her exact Thursday-night head. Reads the three labels and saves it.\n\n**Cynic:** This one gets it: sitting near the door, arriving before the majlis fills, bringing a food he knows. Real calculations, not 'prepare him emotionally'. Her objection is 'leave while he's still happy' when the food hasn't come out yet. Her mother-in-law will have something to say. Usable, with that one social cost.\n\n**Cautious:** Trusts it fully, nothing clinical and nothing promised. «كل العيون عليكم» and «وراه من غرفة لغرفة» hit hard. She'd save and send it to her sister before the next عزيمة.\n\n| Item | Score | Why |\n|---|---|---|\n| Scroll-stop (16) | 13 | Culturally exact, relivable worry line. Second half promises something concrete. |\n| Recognition (14) | 13 | Her own internal monologue, plus the 'all eyes on you' shame. |\n| Usable value (14) | 10 | Arrival, seat and items are all doable. The early exit before dinner is socially costly and unaddressed. |\n| Emotion, not apathy (12) | 9 | «كل العيون عليكم» and the room-to-room chase carry real feeling. |\n| Her own words (10) | 9 | تحسبي ألف حساب, جمبه, مبسوط: her words throughout. |\n| Trust & safety (10) | 9 | Clean. Cup flag is not a rule breach. |\n| Arabic naturalness (8) | 7 | Natural. s3 «الطلعة وهو مرتاح أخف…» slightly long. |\n| One job (7) | 6 | One job, though s5 is a half-slide. |\n| Next step (5) | 5 | Attention post, correctly no CTA. |\n| The turn (4) | 4 | s7 'sit with your family instead of chasing him' is the right turn: it's her evening. |\n| **Total** | **85/100** | |\n\n**Push it higher:**\n- Soften the exit for a Saudi عزيمة: «حاولي تمشي وهو لسه مبسوط، حتى لو قبل العشا بشوي.» (حاولي, pattern 3), which names the real cost.\n- Merge s5 into s4 so the 'near the door' reason sits with the tip and isn't a stub slide.\n- Swap «كوبه» for «مويته في قارورته» if Anhar wants cups gone everywhere.\n\n**Gate:** PASS\n\n**Arabic Voice Editor:**\n\n- s5: «قريب من الباب عشان لو احتاج يطلع شوي…» → «كذا لو احتاج يطلع شوي…». Why: s4 already says near the door; her move is the plain كذا cause→effect clause (pattern 4).\n- Caption: «الألف حساب تنزل لثلاث» → «من الألف حساب اللي تحسبيها قبل العزيمة، ثلاث بس اللي فعلاً تفرق». Why: 'boils down to three' is a translated idiom (pattern 1); uses her word تحسبي (Part 2). Added «وتمشي» so the caption matches the first calculation (arrive AND leave).\n- FLAG (cup): s6 lists «كوبه». The cup ban is for CHANGE posts (a cup swap as the 'change'). Here the cup is the familiar thing he brings, the opposite of a change, so it is not a rule conflict. But she reacted to cups specifically; if she wants them gone everywhere, «مويته في قارورته» or simply «أكلة يعرفها، وشي يمسكه بيده» works. Not changed.\n\n**Back-translation:**\n\n1. Before every family gathering you make a thousand calculations for it? These are the three calculations that actually make a difference.\n2. The first: when you arrive and when you leave. Try to arrive early, before the majlis fills up. That way he walks in while the place is still quiet.\n3. And leave while he's still happy, not after the screaming starts. Leaving while he's calm is much lighter on you than leaving with every eye on you both.\n4. The second: where you sit. Near the door, with him beside you, and away from the TV and the speakers.\n5. That way, if he needs to step out for a bit, you both slip out calmly without walking past everyone.\n6. The third: what comes with him from home. His cup, a food he knows, and something to hold in his hand.\n7. These three get worked out at home before you leave. So that when you arrive, you can sit with your family instead of spending the whole gathering behind him from room to room."}, {"id": "p3", "conceptId": "c7", "title": "Lying beside him: step back bit by bit (attention, 8 slides)", "format": "slides", "status": "final", "score": 83, "body_ar": "(١)\nتنسدحي جمبه إلين ما ينام، وتصحي بعد ساعتين وأنتي اللي نمتي؟\n\n(٢)\nكل ليلة نفس القصة.\nهو ما ينام إلا وأنتي جمبه، وأنتي تبغيه ينام لحاله.\n\n(٣)\nهذي أربع خطوات تبعدي فيها عنه شوي شوي، بدون ما تختفي من الغرفة فجأة.\n\n(٤)\nالخطوة الأولى: بدل ما تنسدحي جمبه، اجلسي جمب سريره.\nنفس القرب، بس أنتي جالسة، وما راح تنامي قبله.\n\n(٥)\nالخطوة الثانية: يدك على ظهره في البداية.\nوبعد كم ليلة، صوتك بس، بدون يدك.\n\n(٦)\nالخطوة الثالثة: كل كم ليلة، مكانك يبعد شوي.\nمن جمب السرير، لنص الغرفة، لعند الباب.\n\n(٧)\nالخطوة الرابعة: إذا قام من سريره، رجعيه بهدوء وبنفس الكلمتين كل مرة، زي \"يلا نوم\".\nبدون نقاش، وبدون ما تنسدحي جمبه من جديد.\n\n(٨)\nتاخذ وقت، بس كل كم ليلة أنتي أبعد بخطوة.\nوالهدف ليلة تطلعي فيها من الغرفة وهو لسه صاحي.", "caption_ar": "من جمبه على السرير، لعند الباب.\nخطوة كل كم ليلة.", "cta_ar": "", "notes": "**Score: 83/100**\n\n**Skimmer:** Stops hard on slide 1. Waking up two hours later having fallen asleep beside him is her every night. She smiles-winces and keeps going to the steps.\n\n**Cynic:** The 'sit, then hand, then voice, then move toward the door' sequence is the chair method from every sleep account. She's half-seen it. What saves it is that it's sequenced and honest («تاخذ وقت»). But 'the same two words', which words? And s8 says every night while s6 says every few nights. She notices and trusts it less.\n\n**Cautious:** No promise, a goal named, no blame. She'd save this. The goal line «تطلعي من الغرفة وهو لسه صاحي» is exactly what she wants.\n\n| Item | Score | Why |\n|---|---|---|\n| Scroll-stop (16) | 14 | Best opener in the batch: a moment she relives with a laugh and a sigh. |\n| Recognition (14) | 13 | s2 states the bind (he needs her / she wants him alone) without judgment. |\n| Usable value (14) | 9 | Clear steps but familiar method. 'Two words' unspecified, every-night vs every-few-nights contradiction. |\n| Emotion, not apathy (12) | 9 | Tired-mum humour in s1. Steps are calm, not felt. |\n| Her own words (10) | 8 | Spoken throughout. «نفس القصة» is a little stock. |\n| Trust & safety (10) | 9 | Goal not promised, no timeline. s7 'no discussion' is firm but kind. |\n| Arabic naturalness (8) | 7 | Natural. Minor أنتي/إنتي pending. |\n| One job (7) | 6 | One job. s3 is a filler announcement slide. |\n| Next step (5) | 5 | Attention post, correctly no CTA. |\n| The turn (4) | 3 | s8 goal line is a good turn, undercut by the contradiction. |\n| **Total** | **83/100** | |\n\n**Push it higher:**\n- Give the two words: «رجعيه بهدوء وقولي \"يلا نوم\" بس، كل مرة نفس الكلمتين.»\n- Fix s8: «وكل كم ليلة أنتي أبعد بخطوة.»\n- Cut s3 (the 'here are four steps' slide) and let s2 carry it, so it's one fewer swipe for the skimmer.\n\n**Gate:** PASS\n\n**Arabic Voice Editor:**\n\n- s2 (locked set, edited under the pattern exception): «وكل ليلة نفس القصة.» → «كل ليلة نفس القصة.» Why: a scene slide opening with و (pattern 11). Only the و removed.\n- FLAG (meaning, s8 locked): «كل ليلة أنتي أبعد بخطوة» contradicts s6 «كل كم ليلة، مكانك يبعد شوي» (every few nights, not every night). Suggest «وكل كم ليلة أنتي أبعد بخطوة».\n- FLAG (s7 locked): «بنفس الكلمتين كل مرة» leaves her guessing which two words. A real example (e.g. \"يلا نوم\") would make it usable (pattern 6/8).\n- Caption checked against the rewritten slides: still matches (bed → door, a step every few nights). Unchanged.\n\n**Back-translation:**\n\n1. You lie down beside him until he sleeps, and wake up two hours later and you're the one who fell asleep?\n2. Every night it's the same story. He only sleeps with you beside him, and you want him to sleep on his own.\n3. Here are four steps where you move away from him bit by bit, without disappearing from the room suddenly.\n4. The first: instead of lying down beside him, sit beside his bed. The same closeness, but you're sitting, and you won't fall asleep before him.\n5. The second: your hand on his back at the start. And after a few nights, just your voice, without your hand.\n6. The third: every few nights, your spot moves a little further. From beside the bed, to the middle of the room, to the door.\n7. The fourth: if he gets out of bed, take him back calmly with the same two words every time, like \"yalla, sleep\". No discussion, and without lying down beside him again.\n8. It takes time, but every few nights you're one step further. And the goal is a night when you walk out of the room while he's still awake."}, {"id": "p6", "conceptId": "c1", "title": "Leaving the house: the 15 minutes before the shoes (conversion, 7 slides)", "format": "slides", "status": "final", "score": 83, "body_ar": "(١)\nيبدأ الصراخ أول ما تجيبي الجزمة عشان تطلعوا؟ الفرق كله في الربع ساعة اللي قبلها.\n\n(٢)\nلما تجي الجزمة وهو لسه مستمتع باللعب، طبيعي ما يبغى يوقف.\n\n(٣)\nهذي ثلاث أشياء تسويها في الربع ساعة اللي قبل الطلعة.\n\n(٤)\nقبل الطلعة بربع ساعة، لا تبدئي معاه شي جديد يحتاج وقت.\nلا آيباد ولا غيره.\n\n(٥)\nوخلي آخر شي قبل الطلعة حاجة بسيطة يخلصها على راحته.\nعصير يشربه، أو بسكوتة ياكلها. يخلص منها، وبعدها تطلعوا.\n\n(٦)\nلا تناديه يجي للباب عشان يلبس الجزمة.\nخذيها له مكانه، ولبّسيه وهو جالس، وبعدها اطلعوا.\n\n(٧)\nالطلعة موقف واحد بس.\nالتقييم المجاني يساعدك تشوفي الصورة الأكبر، وتعرفي من فين تبدئي.\nالرابط في البايو.", "caption_ar": "يبدأ الصراخ أول ما تجيبي الجزمة؟ طبيعي ما يبغى يوقف وهو مستمتع باللعب.\nهذي ثلاث أشياء تسويها في الربع ساعة اللي قبل الطلعة.", "cta_ar": "الرابط في البايو.", "notes": "**Score: 83/100**\n\n**Skimmer:** Stops: shoes and screaming is every outing. 'The whole difference is in the 15 minutes before' is a hook with a promise. She swipes to see what.\n\n**Cynic:** 'Take the shoes to him, put them on while he sits' is a tonight-usable tip she's never been told. 'Don't start the iPad 15 min before' is fair. Juice-then-go she's semi-tried. 'The whole difference' is an overclaim; some days nothing works.\n\n**Cautious:** Normalising s2 («طبيعي ما يبغى يوقف») earns trust. But the bridge slide ends without telling her where to go; the link is only in the caption. She'd need to hunt. Not pushy, just unfinished.\n\n| Item | Score | Why |\n|---|---|---|\n| Scroll-stop (16) | 13 | Clear moment plus intriguing promise. |\n| Recognition (14) | 13 | The shoe moment is universal; s2 normalises it. |\n| Usable value (14) | 12 | Three in-the-moment moves; the shoe tip is new and doable tonight. |\n| Emotion, not apathy (12) | 8 | Kind but not felt; no beat-by-beat scream scene. |\n| Her own words (10) | 9 | Her edits all over: طبيعي ما يبغى يوقف, لا آيباد ولا غيره. |\n| Trust & safety (10) | 9 | Clean. «الفرق كله» is a mild overclaim. |\n| Arabic naturalness (8) | 7 | Natural. |\n| One job (7) | 6 | One job, but s3 is a filler slide. |\n| Next step (5) | 3 | Bridge is her approved formula, but 'link in bio' missing on the slide. |\n| The turn (4) | 3 | s7 widens from outings to the bigger picture, adequately. |\n| **Total** | **83/100** | |\n\n**Push it higher:**\n- Add «الرابط في البايو.» to s7 (bridge+CTA share one slide, Part 5).\n- «الفرق كله» → «الفرق يبدأ» (honest, not a promise).\n- Give the bridge a reason tied to the hook: «…وتعرفي من فين تبدئي، بدل ما كل طلعة تبدأ بصراخ.»\n\n**Gate:** PASS\n\n**Arabic Voice Editor:**\n\n- s3: added «تسويها». Why: the line had no verb ('three things in the quarter hour'); she'd say what you do.\n- Caption: «الصراخ عند الجزمة يبدأ قبلها بربع ساعة. ثلاث أشياء تغيريها…» → hook + her normalising line «طبيعي ما يبغى يوقف» + three things. Why: 'the screaming starts 15 minutes earlier' is a clever, inaccurate framing (pattern 1); «تغيريها» implies she's doing it wrong (no mother-blame); pattern 2.\n- CTA: «التقييم المجاني في الرابط اللي في البايو.» → «الرابط في البايو.» Why: wordy; matches her approved formula.\n- FLAG (s7 locked): the bridge slide has no «الرابط في البايو». Part 5 wants bridge + CTA on one slide; suggest adding that line to s7.\n- FLAG (structure): the three things (s4–s6, locked) have no «أول شي:» labels. Fine by her approval; noted for consistency with p5/p10.\n- Note: notes_en is stale (mentions 'six areas' and «ومحد قطعها», neither is in the post). Not edited.\n\n**Back-translation:**\n\n1. The screaming starts the moment you bring the shoes to go out? The whole difference is in the quarter hour before it.\n2. When the shoes come while he's still enjoying playing, naturally he doesn't want to stop.\n3. Here are three things you do in the quarter hour before going out.\n4. A quarter hour before going out, don't start anything new with him that takes time. No iPad, nothing else either.\n5. And make the last thing before going out something simple he finishes at his own pace. A juice he drinks, or a biscuit he eats. He finishes it, and then you go out.\n6. Don't call him to come to the door to put on his shoes. Take them to where he is, put them on him while he's sitting, and then go out.\n7. Going out is just one situation. The free assessment helps you see the bigger picture, and know where to start. The link is in the bio."}, {"id": "p4", "conceptId": "c8", "title": "His own plate: find what his three foods share (attention, 7 slides)", "format": "slides", "status": "final", "score": 82, "body_ar": "(١)\nتطبخي للبيت كله، وهو له صحن لحاله فيه نفس الثلاث أكلات كل يوم؟\n\n(٢)\nقبل ما تجربي أكل جديد، لاحظي ايش يجمع الأكلات الثلاث اللي ياكلها.\n\n(٣)\nإذا صحنه نقت وبطاطس وتوست، كلها مقرمشة ولونها ذهبي.\n\n(٤)\nومرات اللي يجمعها ماركة وحدة ما تتغير، أو إنها لازم تكون باردة.\n\n(٥)\nولما تلاحظي الشي المشترك، اختاري أكلة وحدة من السفرة فيها نفس الشي.\nحبة فلافل، أو قطعة تميس.\n\n(٦)\nلا تحطيها داخل صحنه، ولا تطلبي منه يذوقها.\nحطيها في صحن صغير جمب صحنه، وخليها بدون ما تقولي شي.\n\n(٧)\nإذا لمسها أو شمها، هذا يكفي اليوم.\nوبكرة حطي نفس الأكلة، في نفس الصحن الصغير، جمب صحنه.", "caption_ar": "ما تحتاجي تطبخي له شي زيادة.\nأكلة وحدة من السفرة، في صحن صغير جمب صحنه، وبدون ما تطلبي منه يذوقها.", "cta_ar": "", "notes": "**Score: 82/100**\n\n**Skimmer:** Stops: 'you cook for the whole house and he has his own plate' is her kitchen. But s2 'notice what they share' sounds like work, and she may drop there.\n\n**Cynic:** The 'crunchy and golden' insight is new to her and smart. It's not 'keep offering veggies 15 times'. Falafel next to nuggets makes sense, and a separate small plate with no asking she'd actually do. She's sceptical about 'touching it is enough', but it's honest.\n\n**Cautious:** Trusts it. No pressure tactics, nothing clinical. She'd save it. But nothing here makes her heart move. It's useful and calm. **Lukewarm on emotion:** no slide shows the dinner moment (him pushing the plate away, her cooking twice).\n\n| Item | Score | Why |\n|---|---|---|\n| Scroll-stop (16) | 12 | Recognisable moment, but a statement more than a sting. |\n| Recognition (14) | 13 | Three-foods plate is exact and widely shared. |\n| Usable value (14) | 12 | Novel, concrete, zero extra cooking. Doable at tomorrow's lunch. |\n| Emotion, not apathy (12) | 7 | Informative tone; no felt beat. |\n| Her own words (10) | 8 | Plain. s2 «لاحظي ايش يجمع» is slightly explainer-ish. |\n| Trust & safety (10) | 9 | Clean. Omitting weight/doctor follows the rule; acceptable. |\n| Arabic naturalness (8) | 7 | Natural. النقت per her list. |\n| One job (7) | 6 | One job, clear. |\n| Next step (5) | 5 | Attention post, correctly no CTA. |\n| The turn (4) | 3 | s7 'touching it is enough today' is a gentle turn that relieves her. |\n| **Total** | **82/100** | |\n\n**Push it higher:**\n- Add her inner voice after s1: «وتقولي على الأقل ياكل، وكل يوم نفس الصحن.» (pattern 5).\n- Make s2 a payoff, not a task: «فيه سبب إنه ياكل هذي الثلاث بالذات.» then reveal crunchy/golden.\n- Check فلافل/تميس against her table (Anhar's call).\n\n**Gate:** PASS\n\n**Arabic Voice Editor:**\n\n- s6: «حطيها في صحن صغير جمب صحنه، مو داخله. بدون ما تطلبي منه يذوقها، وبدون أي تعليق.» → «لا تحطيها داخل صحنه، ولا تطلبي منه يذوقها. حطيها في صحن صغير جمب صحنه، وخليها بدون ما تقولي شي.» Why: tip said as she'd say it, the usual mistake first, then what to do (pattern 10); «بدون أي تعليق» is translated 'without any comment'.\n- s7: «وبكرة نفس الحبة» → «وبكرة حطي نفس الأكلة». Why: «نفس الحبة» literally means the same piece from yesterday; the meaning is the same food. Added the verb so it reads as a tip.\n- Caption: «وبدون ضغط» → «وبدون ما تطلبي منه يذوقها». Why: 'without pressure' is an English concept; the concrete action is plainer (pattern 1). «سفرتكم» → «السفرة» (Part 2).\n- FLAG (carried over): no line about weight loss/doctor, by the no-specialist rule. Anhar to decide.\n\n**Back-translation:**\n\n1. You cook for the whole house, and he has his own plate with the same three foods every day?\n2. Before you try a new food, notice what the three foods he eats have in common.\n3. If his plate is nuggets, fries and toast, they're all crunchy and golden.\n4. And sometimes what they share is one brand that never changes, or that they have to be cold.\n5. And once you notice the shared thing, pick one food from the table that has the same thing. A falafel, or a piece of tamees bread.\n6. Don't put it on his plate, and don't ask him to taste it. Put it on a small plate beside his plate, and leave it without saying anything.\n7. If he touches it or smells it, that's enough for today. And tomorrow put the same food, on the same small plate, beside his plate."}, {"id": "p1", "conceptId": "c4", "title": "Coming back from the park starts when you arrive (attention, 7 slides)", "format": "slides", "status": "final", "score": 78, "body_ar": "(١)\nكل رجعه من الحديقة نفس المعركة؟ جهزيه للخروج من اول ما توصلوا، مو آخر خمس دقايق.\n\n(٢)\nهذي أربع أشياء تبدأ من أول ما تفرشوا الفرشه، عشان ما يحس إنكم فجأة قررتوا تمشوا.\n\n(٣)\nأول ما تنزلوا من السيارة، وريه فين وقفتوا.\n\"هذي سيارتنا، نرجع لها بعدين.\"\n\n(٤)\nولما يقرب وقت الرجعة، لمّي الأغراض قدامه شوي شوي.\nكيس الأكل أول، بعدين الألعاب، والفرشة آخر شي.\n\n(٥)\nوخلي له شي يشيله بنفسه.\nالكورة، أو شنطته الصغيرة، هو اللي يوديها للسيارة.\n\n(٦)\nوخلي في السيارة شي يحبه، يلقاه أول ما يركب.\nعصير، أو لعبة ما تطلع إلا في طريق الرجعة.\n\n(٧)\nكذا لما تقولي يلا نمشي، يكون عارف إن وقت الخرجة خلص.", "caption_ar": "كل رجعه من الحديقة نفس المعركة؟\nأربع أشياء تسويها وأنتي هناك، عشان ما يحس إنكم فجأة قررتوا تمشوا.", "cta_ar": "", "notes": "**Score: 78/100**\n\n**Skimmer:** Stops on «نفس المعركة» because the park exit is a weekly fight, but the second half of slide 1 already hands her the answer, so she reads s2 and swipes off around s3. She got the idea without the steps.\n\n**Cynic:** Finally it isn't 'give a five-minute warning', which she's tried 50 times. Packing the food bag, then the toys, then the blanket in front of him is something she hasn't seen before, and the toy that only comes out on the way home would actually work. Showing him the car on arrival feels thin with a 3-year-old.\n\n**Cautious:** Would save it for the next park day. No ask, nothing to distrust. But no slide shows the battle itself, so she nods and doesn't feel it. **This is lukewarm on emotion:** s1→s2 jumps from 'same battle' straight to tips with no scene of him dropping to the grass.\n\n| Item | Score | Why |\n|---|---|---|\n| Scroll-stop (16) | 11 | Real moment, but slide 1 is half instruction, so the hook gives away the payoff. |\n| Recognition (14) | 11 | Every park mum knows the exit fight, but it is named, not shown. |\n| Usable value (14) | 11 | Four concrete in-place moves, and the 'toy only for the way home' is the standout. Usable next outing, not tonight. |\n| Emotion, not apathy (12) | 7 | No beat-by-beat scene (pattern 6). Calm and helpful, not felt. |\n| Her own words (10) | 8 | «كل رجعه» / «فجأة قررتوا تمشوا» are hers. s3 car line is a bit stiff. |\n| Trust & safety (10) | 9 | Clean. One prep item (car toy) is honest. |\n| Arabic naturalness (8) | 7 | Natural. الفرشه/الفرشة inconsistency. |\n| One job (7) | 6 | One job, but s1 does the teaching before the swipe. |\n| Next step (5) | 5 | Attention post, correctly no CTA. |\n| The turn (4) | 3 | s7 'he knows outing time is over' lands, but quietly. |\n| **Total** | **78/100** | |\n\n**Push it higher:**\n- Add a scene slide after s1: «تقولي يلا نمشي، فينسدح على العشب ويصرخ، وكل الناس تطالع.» Make her feel it before the fix.\n- Cut slide 1's second half to a promise: «…هذي أربع أشياء تسويها وأنتي هناك.» so the 'from arrival' insight is the payoff, not the hook.\n- Label s3–s6 «أول شي:»… and fix الفرشه/الفرشة.\n\n**Gate:** PASS\n\n**Arabic Voice Editor:**\n\n- s4: «لمّي الأغراض على مراحل قدامه» → «لمّي الأغراض قدامه شوي شوي». Why: «على مراحل» is translated 'in stages'; شوي شوي is how she'd say it (pattern 1).\n- s6: «وفي السيارة، خلي شي يحبه ينتظره. عصير يحبه…» → «وخلي في السيارة شي يحبه، يلقاه أول ما يركب. عصير…». Why: «شي ينتظره» is the English 'something waiting for him' and is ambiguous (who waits?); the plain moment is 'he finds it when he gets in' (patterns 1, 6). Also removed the repeated يحبه.\n- Caption: «الرجعة من الحديقة تبدأ من أول ما تفرشوا. أربع أشياء ما تحتاج تجهيز…» → hook question + her own approved line «عشان ما يحس إنكم فجأة قررتوا تمشوا». Why: 'leaving starts when you arrive' is a clever English framing (pattern 1), and 'no prep needed' wasn't true (s6 needs the juice/toy in the car).\n- FLAG (structure): the four things (s3–s6) carry no labels; Part 5 asks non-step items to name what they are («أول شي:»). s3 is locked, so not changed. Anhar to decide.\n- FLAG (spelling): locked s2 has «الفرشه», s4 has «الفرشة». Pick one.\n\n**Back-translation:**\n\n1. Every trip back from the park is the same battle? Prepare him for leaving from the moment you arrive, not the last five minutes.\n2. Here are four things that start from the moment you spread the blanket, so he doesn't feel you suddenly decided to leave.\n3. As soon as you get out of the car, show him where you parked. \"This is our car, we come back to it later.\"\n4. And when it's nearly time to go, pack things up bit by bit in front of him. The food bag first, then the toys, and the blanket last.\n5. And give him something to carry himself. The ball, or his little bag, he's the one who takes it to the car.\n6. And keep something he loves in the car, that he finds as soon as he gets in. A juice, or a toy that only comes out on the way hom  document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{sel=+b.dataset.n;render()});
 document.querySelectorAll(".send").forEach(b=>b.onclick=()=>{const p=b.dataset.p;(navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(()=>{b.textContent="Copied ✓"},()=>{b.textContent=p})});
 document.getElementById("tg").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("sma-theme",r.dataset.theme)}catch(e){}};
}
function apply(s){const j=JSON.stringify(s);if(j===last)return;const prev=state&&state.currentStep;state=s;last=j;if(prev&&prev!==s.currentStep)sel=s.currentStep;render()}
function poll(){fetch("state.json",{cache:"no-store"}).then(r=>r.json()).then(apply).catch(()=>{if(!state)render()})}
document.addEventListener("DOMContentLoaded",()=>{if(window.__STATE__)apply(window.__STATE__);poll();setInterval(poll,2000)});
})();
</script>
<div id="app"></div>
</body>
</html>
