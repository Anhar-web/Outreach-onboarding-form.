<style>
/* Layout: one calm centred column, an agency's internal run sheet. Stepper on top, the selected step as the hero card, then team, scorecard, concepts, posts, performance. */
:root{
  --bg:#f7f5ef; --surface:#ffffff; --ink:#122a31; --muted:#5d6d71; --line:#dfe3e0;
  --accent:#005A70; --accent-soft:#e1eef0; --gold:#C9935A; --gold-soft:#f4e6d4;
  --idle:#a3adad; --working:#d79a0b; --needs:#005A70; --done:#1d9a53; --idea:#0f2f39; --idea-ink:#eef3f2;
  --display:Georgia,"Times New Roman",serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; --ar:"Tajawal","El Messiri",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10191b; --surface:#172326; --ink:#e8eeec; --muted:#9db0b1; --line:#2a3a3d;
  --accent:#5cc7c3; --accent-soft:#16383d; --gold:#d9a873; --gold-soft:#3a2e20;
  --idle:#5d6a6b; --working:#e0aa2a; --needs:#5cc7c3; --done:#3cbf72; --idea:#0b2329; --idea-ink:#e8eeec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10191b; --surface:#172326; --ink:#e8eeec; --muted:#9db0b1; --line:#2a3a3d;
  --accent:#5cc7c3; --accent-soft:#16383d; --gold:#d9a873; --gold-soft:#3a2e20;
  --idle:#5d6a6b; --working:#e0aa2a; --needs:#5cc7c3; --done:#3cbf72; --idea:#0b2329; --idea-ink:#e8eeec; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);margin:0}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:10px;background:var(--accent);color:var(--bg);display:grid;place-items:center;font:700 15px var(--ar)}
.hgroup{flex:1;min-width:0}
.hgroup .k{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hgroup h1{margin:0;font:600 20px var(--display)}
.chip{font:11px var(--mono);color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:99px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.stepper{display:grid;grid-template-columns:repeat(9,1fr);position:relative;overflow-x:auto}
.stepper:before{content:"";position:absolute;top:15px;left:5%;right:5%;height:2px;background:var(--line)}
.st{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:60px}
.dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);background:var(--surface);border:2px solid var(--idle);color:var(--muted)}
.st[data-s="working"] .dot{border-color:var(--working);background:var(--working);color:#fff}
.st[data-s="needs-you"] .dot{border-color:var(--needs);background:var(--needs);color:var(--bg)}
.st[data-s="done"] .dot{border-color:var(--done);background:var(--done);color:#fff}
.st.cur .dot{box-shadow:0 0 0 4px var(--accent-soft)}
.st.sel .lbl{color:var(--ink);font-weight:600}
.lbl{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{display:flex;gap:10px;align-items:center;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.pill[data-s="working"]{background:var(--working);color:#fff}
.pill[data-s="needs-you"]{background:var(--needs);color:var(--bg)}
.pill[data-s="done"]{background:var(--done);color:#fff}
.card h2{margin:0;font:600 30px/1.15 var(--display);text-wrap:balance}
.sub{margin:0;font-style:italic;color:var(--muted)}
details.idea{background:var(--idea);color:var(--idea-ink);border-radius:10px;padding:12px 14px}
details.idea summary{cursor:pointer;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
details.idea b{display:block;font:600 17px var(--display);margin-top:8px}
.action{border:1.5px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.action .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.action .k{font:600 11px var(--mono);letter-spacing:.08em;color:var(--accent)}
.send{background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:10px 14px;font-weight:600;align-self:flex-start}
.hint{font-size:12px;color:var(--muted)}
.md{min-width:0}
.md h3{font:600 19px var(--display);margin:18px 0 6px}.md h4{margin:14px 0 4px}
.md p{margin:8px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:3px 0}
.md code{font:12.5px var(--mono);background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 6px 6px 0}
.tw{overflow-x:auto}.md table,table.perf{border-collapse:collapse;width:100%;font-size:13px}
.md th,.md td,table.perf th,table.perf td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md th,table.perf th{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.perf td{font-variant-numeric:tabular-nums}
.ar{direction:rtl;text-align:right;font-family:var(--ar);font-size:17px;line-height:1.75}
section h3.sec{font:600 22px var(--display);margin:0 0 12px}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.mem{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);flex:none;background:var(--idle);color:#fff}
.av[data-s="working"]{background:var(--working)}.av[data-s="needs-you"]{background:var(--needs);color:var(--bg)}.av[data-s="done"]{background:var(--done)}
.mem b{display:block;font-size:13.5px}.mem span{font-size:12px;color:var(--muted)}
.sc{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:10px;align-items:center;font-size:13.5px;padding:4px 0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.sc .v{text-align:right;font:12px var(--mono);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cc.picked{border:2px solid var(--accent)}.cc.rejected{opacity:.45}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font:600 10.5px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;background:var(--line);color:var(--muted)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}.tag.gold{background:var(--gold-soft);color:var(--gold)}
.hook{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.gloss{font-style:italic;color:var(--muted);font-size:13px}
.post{display:flex;flex-direction:column;gap:10px}
.score{font:600 12px var(--mono);padding:3px 8px;border-radius:99px;background:var(--done);color:#fff}.score.low{background:var(--working)}
.body{white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px}
.note{font-size:13px;color:var(--muted);white-space:pre-wrap}
.callout{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13.5px}
.empty{color:var(--muted);font-style:italic}
@media (max-width:560px){.stepper{grid-template-columns:repeat(9,64px)}.card h2{font-size:24px}.sc{grid-template-columns:110px 1fr 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

window.__STATE__ = {"project": "Home Orbit — Batch 3 (Nov 2026)", "currentStep": 9, "steps": [{"n": 1, "key": "brief", "title": "Brief", "subtitle": "The Analyst reads Batches 1–2, then the Strategist turns it into the Batch 3 brief.", "status": "done", "idea": {"title": "Decide the job before the post", "body": "Most content fails because nobody decided what it was for."}, "action": {"label": "Read the Analyst + brief, answer the 4 questions in chat, then confirm.", "phrase": "Looks right. Next step."}, "report": "## Part 1 · Analyst: what's working (Batches 1 and 2, 22 posts)\n\n**Sources read:** handbook v3 (all parts), every Airtable table (169 Feedback & Lessons rows, including all 72 \"B2 edit ·\" rows, plus 22 posts, 25 performance check-ins, 2 conversion windows, 9 formats and 20 visual-style rows), the assessment base (17 completed assessments; dates, status, q14 and click flags only), and the repo's B3 input files.\n\n**What's new since Part J:** there are no new numbers. The last completed assessment was on **Nov 14, 05:59** (Saudi time). Post Performance only has day-1 snapshots for Batch 2, apart from the shower post, which also has an evening update. Everything below matches Part J, plus three findings that only showed up once I lined the posts up together.\n\n### 1. Under clean conditions, the hook decides\n\"Clean\" means a dark ground and either the first post of the evening or one about an hour after the first. Twelve posts ran under those conditions:\n\n| Hook type | Broke out | Posts |\n|---|---|---|\n| **Her moment + the cost lands on HER, with a body or time detail** | **6 of 7** | vacuum, bedtime, hair wash, sneaking out, shower, 8 to 10 ✅ · night waking ❌ |\n| Planning, rules, the child's behaviour, or a second half | **0 of 5** | عزيمة, park, plate, \"just today\", blender |\n\nThe one miss with the winning shape, night waking, was the **4th sleep post in 4 nights**, so it reads as topic fatigue. It doesn't count against the hook.\n\n### 2. Light grounds and posting minutes apart: 0 of 10\nNone of the 10 posts on a light ground or posted 1–11 min after another broke out, **whatever the hook**. Cooking had a «فصرتي» hook and still stalled (light ground, 1 min after hair wash).\n\nThere is one confound to fix in Batch 3: the three light posts that went out at a clean time all used «ما تقدري… إلا». So we still can't tell whether the ground or the hook shape held them back. **One «ما تقدري» hook on a dark ground settles it.**\n\n### 3. Reach plus a CTA turns into assessments, at a rate we can plan around\n- **Batch 1:** 0 completions in a window where no post that reached people had a CTA.\n- **Batch 2:** 9 completions. 5 came within ~19 h of hair wash (4.1K), 1 after the shower evening (3.2K) and 2 after 8 to 10 (1.9K). None came after the stalled posts.\n- **Working rate:** about **1 completed assessment per ~1,100–1,250 breakout views** (timing-based attribution only).\n- **What that means for Batch 3:** every breakout is worth roughly 2–5 assessments, and a stalled post is worth ~0. Reach is the business lever.\n\n### 4. The leak has moved downstream\n- 9 completions → 4 clicked \"learn more about the Living Plan\" → **0 joined the waitlist**.\n- The posts now deliver assessments. The assessment → waitlist step is where the business win is lost.\n- This is outside the carousels. The **explainer extension** (Part K2) is the content-side lever, because it sets up the beliefs that make the waitlist feel obvious before she ever reaches the results page.\n- **Flag for you:** the results/plan page is probably worth a separate look.\n\n### 5. Topics\n- **What she's struggling with (Q14, all 17 assessments):** emotions **6**, sleep **5**, communication 2, D 2, B 1, other 1. Emotions also led in Batch 2 (4 of 9).\n- **Sleep posts are fading:** 4.3K (B1), then 1.0K, 1.9K, 555 and 509 in B2.\n- **What wins:** body-care and sensory chores where she pays the price (vacuum, hair wash, shower).\n- **Never tested since the agency started:** public or family scenes with witnesses. Your legacy winners were all public scenes (200K, 40K, 38K).\n\n### 6. Depth, saves and format\n- **Depth:** breakouts average 3.0–3.5 slides viewed; stalled posts 2.0–2.8. Most viewers still leave by slide 3, so the soft CTA has to sit on slide 3 or 4.\n- **Saves:** practical routine posts get saved (35 / 29 / 25).\n- **Format:** F1 HPSPC went 0 of 3. F2, F3, F5 and F6 had one winner each. Format matters less than hook, ground and timing, which is why Batch 3 can afford to test new formats.\n- **Comments:** ~0 everywhere. As agreed, that's not a failure signal.\n\n### Instructions for the Batch 3 brief\n1. **Hook:** every hook is her moment plus the cost landing on HER, with a body or time detail. One question, past tense. Test «ما تقدري… إلا» exactly once, on a dark ground.\n2. **Conditions:** slide 1 always deep or night. Two posts an evening, about an hour apart, 7:00–8:30 PM. Hold these two constant so the format tests stay readable.\n3. **Topics:** emotions/meltdowns and public/family scenes lead. Sensory chores and body care keep the winning shape. **At most 1 sleep post.**\n4. **Waitlist:** every post carries one explainer belief, aimed at the waitlist gap. Also look at the results page separately.\n\n---\n\n## Part 2 · Strategist: Batch 3 brief (CONFIRMED Nov 16, with your answers)\n\n**Your answers:** (1) F8 ×2 and F4 ×1 kept (your call: our judgment). (2) **No sleep posts.** (3) Start without new numbers. (4) No separate assessment/waitlist look inside this agency (see note below). **New input:** the assessment blueprint. Every CTA now follows `app/b3/assessment_truth.md`.\n\n**What this batch is for:** more breakouts, each one carrying a CTA. Every post is a value post that ends with a CTA, with no attention vs conversion split. The batch also tests three ideas from your talks (F7, F8 and the explainer extension), labelled so we can compare them.\n\n**Size and shape:**\n- 12 static TikTok carousels, 1080×1350.\n- About 7–8 slides, with no more than 3 story slides.\n- **Win =** completed assessments per evening, waitlist joins, saves, ≥3 slides viewed, and followers. Views only count as the route to those.\n\n**Audience:** a cold new mother who doesn't know Home Orbit. We describe behaviour she can see, never a diagnosis.\n\n### Format slate (12 posts, each one labelled)\n| Label | Count | Why |\n|---|---|---|\n| **F7 Inception list: mistakes** | 2 | Your test. Slide 1 = her scene only, slide 2 = the count. \"The mistake most of us make\", never blaming her. The last point is the explainer. |\n| **F7 Inception list: benefits / one tool** | 2 | The other half of the test, built the same way. |\n| **F8 Scene + one tool** | 2 | Public or family scene with witnesses' lines, one game-like tool, the twist, and a one-word comment prompt. Two posts, so one result isn't luck. |\n| **F5 Walk-through** | 2 | Hair wash, the biggest winner, used this format. |\n| **F3 Two voices** | 1 | Shower (3.2K). |\n| **F2 Story** | 1 | Sneaking out (1K). |\n| **F6 Checklist** | 1 | 8 to 10 (1.9K, 25 saves). |\n| **F4 Metaphor** (Eric's parallel story) | 1 | Re-test on a dark ground. Its only post so far was on a light ground. The parallel comes from her everyday life, never the brain or science. |\n| F1 HPSPC | 0 | Resting (0 of 3). |\n\n### Topic mix (to be confirmed by Research at step 3)\n- **Emotions and meltdowns: 5.** When something ends, breaks or goes wrong, or when he hears \"no\".\n- **Public and family scenes: 4.** A loud women's party, the supermarket checkout, leaving a gathering and, if the format calls for it, a restaurant-type scene. Not a copy of the legacy posts.\n- **Sensory chores and body care: 3.** For example nail cutting, teeth, new clothes or a hand dryer. Not vacuum, blender, hair dryer, shower, hair wash or salon again.\n- **Sleep: none** (your call).\n- These overlap: an F8 public post can also be an emotions post. Research picks the actual moments.\n- **No repeats of B1–B2 topics:** vacuum, iPad, the عزيمة, crying-why, bedtime, shoes, plate, his name, park, aunt/change, hair wash, cooking, sneaking out, shower, only-after-he-sleeps, \"just today\", hair dryer, 8 to 10, phone calls, night waking, blender, salon.\n\n### What every post carries\n1. **The value:** real, realistic steps or one tool. They take seconds where she already is, work with what the child actually wants, and give one action per step.\n2. **The explainer extension (K2):**\n   - It comes after the steps as a smooth continuation of the last one («و…»، «وبعدها…»، «ومن هنا نبني الخطة…»).\n   - **One type + one belief per post**, logged on the concept, spread across the 9 types.\n   - Never a whole explainer post. No «أخصائي», no «كل أسبوعين», no \"everyone tells you…\".\n   - In F7, the last point *is* the explainer.\n3. **CTAs claim only what the assessment does** (`assessment_truth.md`). It's about her approach. She picks one situation and gets her strengths, where to start, and one first step. It never looks at \"his whole day\" or \"six areas\".\n4. **A soft CTA on slide 3 or 4:** one short line that names the benefit (e.g. «التقييم المجاني في البايو يساعدك تعرفي من فين تبدئي»).\n5. **The final CTA:** Connect → Purpose → Direct, as one flowing sentence. It names what happened before the moment, and she «تبني خطة».\n6. **Caption and pinned comment.**\n\n**Voice:** all 169 Feedback & Lessons rules apply, with the 72 B2 edits as the model.\n\n**Production:** Part I rules, built on the B2 kit. I build everything first, then you review the finished slides. Delivered as one zip per post, in posting order.\n\n### Posting plan\n- 6 evenings × 2 posts: about 7:15 PM, then about 8:15 PM.\n- The stronger bet of each pair goes first.\n- Day-1 numbers are logged in Post Performance, and completions are checked after each evening.\n\n### Assumptions I've made (correct anything)\n- F8 = 2 posts and F4 = 1 post. Your prompt didn't give counts.\n- The one sleep slot may stay empty if Research doesn't find a fresh moment.\n- The comment prompt goes on the F8 posts only, so we can see whether it moves comments.\n\n### Questions for you (all at once)\n1. Are **F8 ×2** and **one F4 parallel story** right, or would you rather move those slots to F5/F3?\n2. **Sleep:** one post, or none this batch?\n3. Do you have **any newer numbers** (day-7 views for B2, profile visits, bio-link clicks)? They're optional, and we can start without them.\n4. Do you want a **separate look at the assessment → waitlist step** (results page), outside this batch? 0 of 9 joined.\n"}, {"n": 2, "key": "scorecard", "title": "Scorecard", "subtitle": "The Strategist sets this batch's 100-point scorecard and the plan.", "status": "done", "idea": {"title": "Define 'good' before anyone writes", "body": "If we agree on what a great post looks like now, the Test Panel can't move the goalposts later."}, "action": {"label": "Approve the reweighted scorecard and the plan.", "phrase": "Go."}, "report": "## Batch 3 scorecard (100 points, reweighted from the B1–B2 data)\n\n| # | Item | Weight | Change and why |\n|---|---|---|---|\n| 1 | **Scroll-stop: her moment, and the cost lands on HER** | **20** | +2. Under clean conditions the hook decided 6 of 7 vs 0 of 5. Scored on the J1 shape: one past-tense question with a body or time detail. |\n| 2 | Recognition | 15 | Same. |\n| 3 | Emotion, not apathy | 13 | −2. Folded partly into #1. |\n| 4 | Her own words (all 169 Feedback rules, the B2 edits as the model) | 12 | Same. |\n| 5 | **Value she can use tonight** (replaces \"One job\") | 10 | Every post now has the same job (value + CTA). This scores realism instead: seconds, where she already is, works with what he wants, one action per step. |\n| 6 | **Trust & safety: a GATE** | 10 | Same weight. **Now also gates CTA truth:** a CTA that claims something the assessment doesn't do fails the post. |\n| 7 | Arabic naturalness | 8 | Same. |\n| 8 | **Explainer extension** (replaces \"The turn\") | 5 | New. One type + one belief, flowing from the last step («و… / وبعدها…»), not a pitch. Your waitlist lever. |\n| 9 | Next step: soft CTA on slide 3–4 + final CTA | 5 | +1. Reach + CTA = assessments. |\n| 10 | Save / share | 2 | Same. Practical routine posts get saved. |\n\n**The four Hook Point drivers** (perspective shift, delivery, hook, self-reflection/tension) score inside items 1–3. The score stays a flag, never proof: the read-aloud test and you decide.\n\n## On your question 4: does a separate look at the assessment → waitlist step help the agency's goal?\n**Not for this agency, not now.** The agency can do two things for the waitlist, and both are already in the plan:\n\n1. **Reach the right mother.** More breakouts bring more assessments, at about 1 per ~1,100–1,250 breakout views.\n2. **Arrive with the right expectations and beliefs.**\n   - Every CTA now describes the assessment accurately, so she isn't disappointed on the results page.\n   - Every post's explainer extension plants one belief the results page then confirms. The assessment's own core message is «انتي مو محتاجة تجمعي نصائح أكثر. تحتاجي طريقة واضحة تناسب طفلك وحياتكم», so the posts and the results will say the same thing.\n\nThe rest happens on the results and Living Plan pages, which the posts can't change. With 9 completions, the 0 waitlist joins aren't enough data to diagnose yet. **When to revisit:** if Batch 3 brings ~25–30 completions and the waitlist is still near 0, that's a page problem, and it's the job of your **conversion agency** skill (built for the Living Plan page), not this one.\n\n## The agency plan for Batch 3\n| Step | Who | What they deliver |\n|---|---|---|\n| 3 · Research | **Audience Researcher** and **Market Analyst**, in parallel | Her real words about meltdowns, public scenes and body-care moments (Arabic quotes + gloss), and the open lane for these topics. Research picks the 12 moments, with no sleep and no B1–B2 repeats. |\n| 4 · Hooks n**F8 tool ideas** (the child corrects or wins):\n- Race the cashier at the checkout\n- \"You choose the last one\" when leaving\n- A secret two-squeeze button at a loud party\n- Teeth \"wrong place\" (brush his nose, he corrects you)\n- \"Take our order\" at a restaurant\n- He presses the hand dryer and mum jumps\n\n### Director's proposed slate (12 moments, the Hook Specialist starts here)\n| Bucket | Moment | The cost on HER | Likely format |\n|---|---|---|---|\n| Public | Big family gathering / women's party | leaves before dinner after 2 hours getting ready | F8 (secret squeeze or \"you choose the last one\") |\n| Public | Weekly family gathering with «دلعتيه» | spends the evening in the side room | F7 mistakes |\n| Public | Supermarket checkout | pays for the sweet he opened, or leaves the full trolley | F8 (race the cashier) |\n| Public | Waiting for food at a restaurant | eats her food boxed in the car | F7 benefits (one tool: \"take our order\") |\n| Emotions | Broken biscuit | eats all the broken halves herself | F3 two voices or F4 parallel story |\n| Emotions | Sibling takes his toy or knocks his tower | referees from the floor, buys two of everything | F2 story |\n| Emotions | Losing a game | has lost on purpose for months | F5 |\n| Emotions | Lift button / mall coin ride (something he loves ends) | rides back down with the bags / leaves by the other door | F7 mistakes (announcing the end) |\n| Emotions | (one of the above's spare) | | F6 checklist |\n| Body care | Nail cutting | by phone torch while he sleeps, one hand a night | F7 benefits (\"he picks the finger\") |\n| Body care | Mall hand dryer | holds his ears, skips washing her own hands | F5 or F4 |\n| Body care | Teeth or the winter jacket | carries the jacket all day / brushing ends in a fight | F6 or F3 |\n\n**CTA check:** public scenes map to the assessment's B option «الخروج من البيت والزيارات العائلية». Meltdowns map to F «التعامل مع الغضب والانفعال» or E «الانتقال من نشاط لنشاط أو التوقف aurant wait: one job at the table | قبل ما يوصل الأكل قلتي لهم خلوه سفري، وأكلتيه بارد في السيارة؟ |\n| 5 | Broken biscuit: the cracked screen | فتحتي الباكت كله تدوري له على بسكوتة ما فيها كسر، وأكلتي أنتي المكسور؟ |\n| 6 | Sibling and the tower: one afternoon | جلستي العصريه كلها على الأرض بينهم، وأول ما قمتي طاح برجه وبدأ الصياح؟ |\n| 7 | Losing a game: 3 moves | صار لك شهور تخسري لطفلك بعمد، ودحين أخته تسألك ليش دايم هو اللي يفوز؟ |\n| 8 | The ride ends: 3 things most of us do | ينزل من اللعبة وهو يبكي، فصرتي تطلعي من المول من باب ثاني؟ |\n| 9 | Hearing \"no\": 3 things to notice | صار لك شهر ما قلتي له \"لا\"، والبسكوت مخبى فوق الدولاب؟ |\n| 10 | Nails: he holds the clippers | ما تقدري تقصي أظافره إلا وهو نايم وعلى فلاش الجوال؟ |\n| 11 | Mall hand dryer: 3 moves | غطيتي اذاني طفل اول ما اشتغلت نشافه اليدين في المول وطلعتي من الحمام بدون ما تنشفي يدينك. |\n| 12 | Winter jacket: two voices | صرتي تشيلي جاكيته في يدك طول الطلعة، وهو بردان ومو راضي يلبسه؟ |\n\nYour 9 edits are logged as 'B3 edit · hook …' in Feedback & Lessons and in `app/b3/b3_hook_edits.json`. Patterns learned: add the spoken words that complete the picture (جلستي تجهزي، وفي النهاية); name him «طفلك»; no labels people don't use (لعبة الريال); her words: بعمد، العصريه، فلاش الجوال، نشافه اليدين، في يدك; the hook names the full problem («ومو راضي يلبسه»).\n\nThe Hook Specialist's options are in `app/b3/hooks_b3.md` (draft history)."}, {"n": 5, "key": "concepts", "title": "Concepts", "subtitle": "The Strategist assembles distinct concepts for you to pick.", "status": "done", "idea": {"title": "Options, not one answer", "body": "A batch is a test. We need real variety to learn from."}, "action": {"label": "Check the 12 concepts (tools, explainers, posting order). Cut or change anything, then confirm. Step 6 (static + F-labels) is pre-filled.", "phrase": "Produce these."}, "report": "## Step 5 · Concepts: 12 posts (your hook edits are final)\n\nEvery post: slide 1 on deep/night · ≤3 story slides · soft CTA on slide 3–4 · explainer extension after the steps · final CTA (Connect → Purpose → Direct, rotating type) · caption + pinned comment · CTAs only from `assessment_truth.md`.\n\n| Slot | # | Concept | Format | Explainer | Assessment match |\n|---|---|---|---|---|---|\n| #01 · Evening 1 · 7:15 PM | 11 | Mall hand dryer: 3 moves | F5 Walk-through | Type 2 Same behaviour, different reasons · Belief 7: the same strategy won't work for every child | general (not a Q14 option) |\n| #02 · Evening 1 · 8:15 PM | 3 | Checkout: beat the cashier | F8 Scene + one tool | Type 3 Real-life demonstration · Belief 8: growth fits into ordinary routines | B «الخروج من البيت والزيارات العائلية» |\n| #03 · Evening 2 · 7:15 PM | 1 | Sister's ملكة: the secret squeeze | F8 Scene + one tool | Type 6 Prevention before intervention · Belief 3: what happens before the hard moment matters | B «الخروج من البيت والزيارات العائلية» |\n| #04 · Evening 2 · 8:15 PM | 5 | Broken biscuit: the cracked screen | F4 Metaphor (Eric's parallel story) | Type 2 Same behaviour, different reasons · Belief 2: the obvious explanation isn't always the right one | F «التعامل مع الغضب والانفعال» |\n| #05 · Evening 3 · 7:15 PM | 2 | Weekly جمعة: 3 things most of us do | F7 Inception list · MISTAKES | Type 7 From observation to plan · Belief 4 «اللي أشوفه كل يوم معلومة، مو شكوى» | B «الخروج من البيت والزيارات العائلية» |\n| #06 · Evening 3 · 8:15 PM | 12 | Winter jacket: two voices | F3 Two voices | Type 2 Same behaviour, different reasons · Belief 2 | general (not a Q14 option) |\n| #07 · Evening 4 · 7:15 PM | 10 | Nails: he holds the clippers | F7 Inception list · BENEFITS / steps · and the «ما تقدري … إلا» dark-ground test | Type 8 The Living Plan evolves · Belief 10 «الخطة اللي تشتغل لازم تتغيّر معه» | general (not a Q14 option) |\n| #08 · Evening 4 · 8:15 PM | 6 | Sibling and the tower: one afternoon | F2 Story | Type 3 Real-life demonstration · Belief 1: his behaviour may have a reason I haven't recognised yet | F «التعامل مع الغضب والانفعال» |\n| #09 · Evening 5 · 7:15 PM | 8 | The ride ends: 3 things most of us do | F7 Inception list · MISTAKES | Type 6 Prevention before intervention · Belief 3 | E «الانتقال من نشاط لنشاط أو التوقف عن شيء يحبه» |\n| #10 · Evening 5 · 8:15 PM | 9 | Hearing \"no\": 3 things to notice | F6 Checklist | Type 4 The parent's knowledge · Belief 4 «اللي أشوفه كل يوم معلومة، مو شكوى» | F «التعامل مع الغضب والانفعال» |\n| #11 · Evening 6 · 7:15 PM | 4 | Restaurant wait: one job at the table | F7 Inception list · BENEFITS / one tool | Type 1 Hidden pattern · Belief 3: what happens before the hard moment matters | B «الخروج من البيت والزيارات العائلية» |\n| #12 · Evening 6 · 8:15 PM | 7 | Losing a game: 3 moves | F5 Walk-through | Type 8 The Living Plan evolves · Belief 10 «الخطة اللي تشتغل لازم تتغيّر معه» | F «التعامل مع الغضب والانفعال» |\n\n**Format count:** F7 ×4 (mistakes #2, #8 · benefits #4, #10) · F8 ×2 (#1, #3) · F5 ×2 (#7, #11) · F2 #6 · F3 #12 · F4 #5 · F6 #9. **No sleep.** The «ما تقدري … إلا» test is #10, on night/deep.\n\n**Posting logic:** each evening pairs two different buckets, with the stronger bet first at 7:15 and the next an hour later. Evening 1 opens with the hand-dryer post (the most HER-cost hook) and the checkout F8.\n\n### Each concept's flow (the Copywriter builds from this)\n\n**1 · Sister's ملكة: the secret squeeze** · F8 Scene + one tool · CTA type: Direct\n\nجلستي تجهزي ساعتين لملكة أختك، وفي النهاية طلعتي قبل العشا وهو يصيح على كتفك؟\n\n*You sat getting ready for two hours for your sister's ملكة, and in the end left before dinner with him screaming on your shoulder?*\n\nScene: a women's ملكة at the family home, loud and full. Witnesses: «خليه شويه» / «ليش زعلان؟». Make it worse: she spends the night between the hallway and the door. Reframe: when he has no way to say «أبغى أطلع», the scream is the only way out he knows. ONE tool: the secret squeeze. Before you go in, agree that two squeezes on your hand mean «أبغى أطلع شويه». Every time, you answer it: you step out with him for a few minutes, then come back. Twist: once he knows he CAN leave, he can stay longer. Comment prompt: «استقبال» or «حارسة الباب» (the one who spent the ملكة at the door).\n\n**2 · Weekly جمعة: 3 things most of us do** · F7 Inception list · MISTAKES · CTA type: Reflection\n\nرحتي جمعة أهلك عشان تجلسي معاهم، وقضيتيها كلها معاه في الغرفة الثانية؟\n\n*You went to your family's gathering to sit with them, and spent all of it with him in the other room?*\n\ns1 the hook. s2 the count line: three things most of us do at the جمعة that make it harder. Then, one per slide, each with a short second-person story: (1) answering the room before answering him («تعبان، ما نام») when «دلعتيه» lands; (2) waiting until he's already on the floor before you leave the majlis, instead of stepping out at the first sign you've learned to notice; (3, the explainer) going home remembering only the scream, not the minute before it. That minute is what a plan is built from. Then the CTA.\n\n**3 · Checkout: beat the cashier** · F8 Scene + one tool · CTA type: Reflection\n\nتركتي العربية مليانة عند الكاشير، وطلعتي شايله طفلك وكل اللي في الطابور يتفرجوا عليكي؟\n\n*You left the full trolley at the checkout and walked out carrying your child, with everyone in the queue watching you?*\n\nScene: the queue, the sweets at the till, he grabs one and screams. Witness lines from the queue and the cashier. Make it worse: the trolley stays behind. Reframe: the hard part wasn't the sweets, it was standing still with nothing to do. ONE tool: he races the cashier, putting every item on the belt before she scans it, and he 'wins' every round. Twist: give him a job and the waiting stops being waiting. Comment prompt: «شيالة» or «مفاوضة».\n\n**4 · Restaurant wait: one job at the table** · F7 Inception list · BENEFITS / one tool · CTA type: Reflection\n\nقبل ما يوصل الأكل قلتي لهم خلوه سفري، وأكلتيه بارد في السيارة؟\n\n*Before the food came you told them to make it takeaway, and ate it cold in the car?*\n\ns1 the hook. s2 the count line: three things that make the wait easier. (1) Order his food first, the moment you sit down. (2) The one tool: «خذ طلبنا»: he's the waiter, you order wrong on purpose, he corrects you. (3, the explainer) notice which minute it starts (after the menu? when the next table's food arrives?). That minute is where a plan starts, and it changes as he gets used to it. Then the CTA.\n\n**5 · Broken biscuit: the cracked screen** · F4 Metaphor (Eric's parallel story) · CTA type: Observation\n\nفتحتي الباكت كله تدوري له على بسكوتة ما فيها كسر، وأكلتي أنتي المكسور؟\n\n*You opened the whole packet looking for a biscuit with no crack, and ate the broken ones yourself?*\n\nParallel from her own life: a new phone with a hairline crack. It still works, but every time you pick it up, all you see is the crack. To him the biscuit isn't 'a biscuit with a crack'; it has turned into 'broken'. Move, in seconds: before you hand it over, let him break it himself («نكسرها نصين؟ وحده لك ووحده للدبدوب»). When he makes the break, it's his. Explainer: same scream, different reasons. For one child it's the crack, for another it's who broke it, and noticing which is your information.\n\n**6 · Sibling and the tower: one afternoon** · F2 Story · CTA type: Reflection\n\nجلستي العصريه كلها على الأرض بينهم، وأول ما قمتي طاح برجه وبدأ الصياح؟\n\n*You sat on the floor between them all afternoon, and the moment you got up his tower fell and the screaming started?*\n\nBeat by beat: the afternoon on the floor, she gets up for one minute (the pot, the door), his sister's hand, the tower falls, the scream, she runs back. Turn: what made it so hard wasn't the fall. The tower was his, and it vanished with no ending. The move, in seconds: before you get up, take a photo of the tower with him («نصوره قبل ما أقوم؟»). If it falls, it still exists. Explainer: real-life demonstration of how one observation changes a routine.\n\n**7 · Losing a game: 3 moves** · F5 Walk-through · CTA type: Direct\n\nصار لك شهور تخسري لطفلك بعمد، ودحين أخته تسألك ليش دايم هو اللي يفوز؟\n\n*For months you've lost to your child on purpose, and now his sister asks you why he always wins?*\n\nThree numbered points, each with a true twist: (1) let him watch YOU lose for real, and say out loud what you do next («خسرت… يلا مرة ثانية»); (2) make the game short, so losing costs one minute, not twenty; (3) let him be the one who says «مرة ثانية». Fast close. Explainer: notice which games end in screaming (the long ones? the ones with his sister?). That's your information, and the plan changes as he gets used to losing.\n\n**8 · The ride ends: 3 things most of us do** · F7 Inception list · MISTAKES · CTA type: Direct\n\nينزل من اللعبة وهو يبكي، فصرتي تطلعي من المول من باب ثاني؟\n\n*He gets off the ride crying, so now you leave the mall through a different door?*\n\ns1 the hook. s2 the count line: three things most of us do when the ride stops. (1) Saying «خلاص» with your arms already lifting him off; (2) promising «مرة وحده بس» and then taking it back; (3, the explainer) remembering the crying, not the second before it. That's the part a plan starts from. Each mistake comes with the move (e.g. let him press «انزل» or choose to climb off himself). Then the CTA.\n\n**9 · Hearing \"no\": 3 things to notice** · F6 Checklist · CTA type: Observation\n\nصار لك شهر ما قلتي له \"لا\"، والبسكوت مخبى فوق الدولاب؟\n\n*It's been a month since you said \"no\" to him, and the biscuits are hidden on top of the wardrobe?*\n\nA three-part checklist, one per slide, each a full spoken sentence telling her what to notice: (1) «انتبهي لإيش كان يسوي قبل ما يطلب»; (2) «انتبهي لإيش كان في يدك لما قلتي لا» (saying it while holding the thing); (3) «انتبهي لإيش جاه بعد اللا» (was there something to go to?). The turn: the «لا» isn't always the problem; what surrounds it is. Explainer: these three notes are information, not complaints.\n\n**10 · Nails: he holds the clippers** · F7 Inception list · BENEFITS / steps · and the «ما تقدري … إلا» dark-ground test · CTA type: Observation\n\nما تقدري تقصي أظافره إلا وهو نايم وعلى فلاش الجوال؟\n\n*You can only cut his nails while he's asleep, by the phone's flashlight?*\n\ns1 the hook. s2 the count line: three steps that move nail cutting to while he's awake. (1) He 'cuts' your nails first, with the clippers closed; (2) he picks the first finger, and he picks the last; (3, the explainer) one hand today is enough. Next time it might be both hands, or it might stay at one. The plan follows how he responds. Then the CTA (general).\n\n**11 · Mall hand dryer: 3 moves** · F5 Walk-through · CTA type: Observation\n\nغطيتي اذاني طفل اول ما اشتغلت نشافه اليدين في المول وطلعتي من الحمام بدون ما تنشفي يدينك.\n\n*You covered your child's ears the moment the hand dryer came on in the mall, and left the bathroom without drying your hands.*\n\nThree numbered points with twists: (1) tell him before you go in «فيه نشافه، تبغى تشغلها انت؟»; (2) he presses the button and your job is to jump. The noise he starts isn't the same as the noise that catches him off guard; (3) start from the door: listen together from outside first, then step closer on the next visit. Explainer: two children can cover their ears for different reasons. Which one is yours is what you notice.\n\n**12 · Winter jacket: two voices** · F3 Two voices · CTA type: Direct\n\nصرتي تشيلي جاكيته في يدك طول الطلعة، وهو بردان ومو راضي يلبسه؟\n\n*Now you carry his jacket in your hand the whole outing, while he's cold and won't put it on?*\n\nTwo voices across the slides: the grandmother («لبسيه غصب، بيبرد») and her own inner voice, which knows what happens when she forces his arms in. Turn: it's the putting-on he refuses, not the jacket. The move: the jacket flip. Lay it upside down on the floor, he puts his arms in and flips it over his head himself. Explainer: it starts with what you noticed, and the plan changes with him.\n\n### parent's knowledge · Belief 4 «اللي أشوفه كل يوم معلومة، مو شكوى»", "hook_ar": "صار لك شهر ما قلتي له \"لا\"، والبسكوت مخبى فوق الدولاب؟", "hook_gloss": "It's been a month since you said \"no\" to him, and the biscuits are hidden on top of the wardrobe?", "status": "picked", "format": "slides · F6 Checklist"}, {"id": "c10", "title": "10 · Nails: he holds the clippers", "job": "value+CTA", "angle": "F7 Inception list · BENEFITS / steps · and the «ما تقدري … إلا» dark-ground test · Body care · #07 · Evening 4 · 7:15 PM · Type 8 The Living Plan evolves · Belief 10 «الخطة اللي تشتغل لازم تتغيّر معه»", "hook_ar": "ما تقدري تقصي أظافره إلا وهو نايم وعلى فلاش الجوال؟", "hook_gloss": "You can only cut his nails while he's asleep, by the phone's flashlight?", "status": "picked", "format": "slides · F7 Inception list"}, {"id": "c11", "title": "11 · Mall hand dryer: 3 moves", "job": "value+CTA", "angle": "F5 Walk-through · Body care · #01 · Evening 1 · 7:15 PM · Type 2 Same behaviour, different reasons · Belief 7: the same strategy won't work for every child", "hook_ar": "غطيتي اذاني طفل اول ما اشتغلت نشافه اليدين في المول وطلعتي من الحمام بدون ما تنشفي يدينك.", "hook_gloss": "You covered your child's ears the moment the hand dryer came on in the mall, and left the bathroom without drying your hands.", "status": "picked", "format": "slides · F5 Walk-through"}, {"id": "c12", "title": "12 · Winter jacket: two voices", "job": "value+CTA", "angle": "F3 Two voices · Body care · #06 · Evening 3 · 8:15 PM · Type 2 Same behaviour, different reasons · Belief 2", "hook_ar": "صرتي تشيلي جاكيته في يدك طول الطلعة، وهو بردان ومو راضي يلبسه؟", "hook_gloss": "Now you carry his jacket in your hand the whole outing, while he's cold and won't put it on?", "status": "picked", "format": "slides · F3 Two voices"}], "posts": [{"id": "b3p3", "conceptId": "c3", "title": "Evening 1 · 7:15 PM · Checkout: beat mum to the belt · F8", "format": "slides · F8", "status": "final", "score": 85, "body_ar": "(1) تركتي العربية مليانة عند الكاشير، وطلعتي شايله طفلك وكل اللي في الطابور يتفرجوا عليكي؟\n\n(2) الطابور طويل، وقدامكم رف الحلويات.\nمسك وحده وقلتي له \"لا\"، فرمى نفسه على الارض وبدا يبكي.\nوحده وراكم تقول \"اعطيه وخلصينا\"، والكاشير واقف يستناكي.\n\n(3) حاولتي تشيليه بيد وتحاسبي باليد الثانية، وما قدرتي.\nفتركتي الأغراض كلها وطلعتي، والعيون كلها عليكي.\nالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.\n\n(4) اللي تعبه مو الحلاوه بس. تعبه إنه واقف في الطابور وما عنده شي يسويه.\nجربي هذه المرة الجاية.\n\n(5) قبل الكاشير: أول ما توصلوا عند الطابور، قولي له \"تقدر تحط الأغراض قبلي؟\"\nيحطها وحده وحده، وكل ما سبقك قولي \"غلبتني!\"\n\n(6) لما يكون في يده شغلة، الطابور يصير سباق، وهو اللي يفوز فيه.\nوهذا في الطابور ما يحتاج تجهزي شي من البيت.\n\n(7) ويمكن المرة الجاية تطلعي والعربية معاكي.\nاذا حسيتي إنك في كل طلعة تشيلي الأغراض وطفلك مع بعض، اكتبي: شيالة\n\n(8) فكري في آخر مرة تركتي فيها الأغراض وطلعتي، وايش كان يصير قبلها في الطابور.\nهذي التفاصيل تساعدك تبني خطة تناسب طفلك.\nوالتقييم المجاني يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات. الرابط في البايو.", "caption_ar": "تركتي العربية مليانة عند الكاشير وطلعتي شايله طفلك؟ التقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.\nفي البوست لعبة تخلي الطابور سباق، وهو اللي يفوز فيه.\n\nتعليق مثبت: وبعدين بعد ما تخلصوا من الكاشير، اعطيه كيس خفيف يشيله إلين ما توصلوا السيارة. عشان تكون له شغلة لآخر الطلعة، مو بس عند الكاشير.\nوالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.", "notes": "Anhar's final edit. Her note: Okay, for this post. In the edits, it's mostly language stuff, how I sound or how I write. But in the tool, I changed it from, like, can you put the stuff before the cashier? Can you put the stuff before me? And I made this change because on the belt thing, the person takes the items from the cart to the belt and then the cashier checks them out. The cashier doesn't take the items from the cart themselves. So that's why I changed it to. It's like the child versus the mom instead of the cashier. And also I wanted to tell you this in batch two but I forgot In the captions I noticed that you referred to the post as pictures Like in the picture you'll see... Let's not do that. Let's keep referring to it as post and I write it like this \"البوست\""}, {"id": "b3p11", "conceptId": "c11", "title": "Evening 1 · 8:15 PM · Mall hand dryer: 3 steps · F5", "format": "slides · F5", "status": "final", "score": 76, "body_ar": "(1) غطيتي اذاني طفل اول ما اشتغلت نشافه اليدين في المول وطلعتي من الحمام بدون ما تنشفي يدينك.\n\n(2) غسلتي يدينك، ووحده جنبك شغلت النشافه.\nطفلك صرخ واتعلق في رجلك، وانتي حطيتي يدينك المبلولة على اذانه.\nوقلتي في نفسك \"خلاص، المرة الجاية نستنى إلين ما نرجع البيت\".\n\n(3) طبيعي يخاف منها. صوتها عالي، ويجي فجأة بدون ما يعرف من فين.\nوهذي ثلاث خطوات للمرة الجاية في حمام المول.\nالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي.\n\n(4) الخطوة الأولى: قبل ما تدخلوا الحمام، قولي له \"جوا فيه نشافه، تبغى تشغلها انت؟\"\nعشان يدخل وهو عارف إنها موجودة، بدل ما يتفاجأ فيها.\n\n(5) الخطوة الثانية: خليه هو اللي يشغلها، وانتي سوي نفسك انفجعتي بشهيق درامي.\nالصوت اللي يشغله هو غير الصوت اللي يجيه فجأة.\n\n(6) الخطوة الثالثة: لو ما رضي يدخل، لا تسحبيه لجوا.\nاوقفوا عند الباب واسمعوها من برا لو احد شغلها. والمرة الجاية قربوا خطوة.\n\n(7) ومو كل طفل يخاف منها لنفس السبب.\nفيه طفل يخاف من الصوت العالي نفسه، وطفل ثاني يخاف إنه يجي فجأة.\nنفس الموقف، بس كل واحد يحتاج خطوة غير.\n\n(8) لاحظي ايش صار قبل ما يغطي اذانه: دخلتوا وهي شغالة، ولا اشتغلت فجأة وانتو جوا؟\nهذي التفاصيل هي اللي تنبني عليها خطة تناسبه.\nابدئي بالتقييم المجاني عشان تعرفي من فين تبدئي. الرابط في البايو.", "caption_ar": "غطيتي اذانه في حمام المول وطلعتي بدون ما تنشفي يدينك؟ التقييم المجاني في البايو يساعدك تعرفي من فين تبدئي.\nفي البوست ثلاث خطوات للمرة الجاية، وأولها قبل ما تدخلوا الحمام.\n\nتعليق مثبت: ولو احد شغل النشافه فجأة وانتو جوا، قولي له بهدوء \"هذي النشافه\" وقربيه من الباب. عشان يعرف ايش الصوت، بدل ما يكون صوت ما يعرف من فين جا.\nوالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي.", "notes": "Anhar's final edit. Her note: Okay, the edits I did for the post. I almost language I took out a few things."}, {"id": "b3p1", "conceptId": "c1", "title": "Evening 2 · 7:15 PM · Sister's ملكة: the secret squeeze (practised days before) · F8", "format": "slides · F8", "status": "final", "score": 85, "body_ar": "(1) جلستي تجهزي ساعتين لملكة أختك، وفي النهاية طلعتي قبل العشا وهو يبكي على كتفك؟\n\n(2) المجلس مليان والأصوات عالية، وكل وحده تسلم عليه وتبوسه.\nبدأ يسحبك من يدك ويبكي، والحريم حولك يقولوا \"خليه شويه\" و\"ليش زعلان؟\"\n\n(3) قضيتي الليلة بين الممر والباب. تدخلي دقيقة ويرجع يبكي، فتطلعي.\nوقبل ما يحطوا العشا، انتي عند السيارة وهو على كتفك.\n\n(4) هو ما عنده طريقة يقولك فيها \"أبغى أطلع شويه\"، فيقولها بالبكاء.\nوهذي حركة وحده للمناسبة الجاية.\nالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.\n\n(5) الضغطة السرية: قبل المناسبة بأيام، علميه إن ضغطتين على يدك معناها \"أبغى أطلع\".\nوكل مرة يضغط، جاوبيه. واطلعوا للممر دقايق وبعدها ارجعوا.\n\n(6) لما يعرف إنه يقدر يطلع متى ما احتاج، ممكن يجلس أكثر.\nوالفكرة إنه يعرف يستخدمها قبل ما يحتاجها في المناسبة\n\n(7) ويمكن المناسبة الجاية تلحقي العشا.\nاذا حسيتي إنك قضيتي المناسبات كلها عند الباب، اكتبي: حارسة الباب\n\n(8) الصياح بدأ قبل العشا بكثير، من أول ما علت الأصوات وبدو يسلموا عليه.\nهذي التفاصيل تفرق لما تبني خطة تناسبه.\nابدئي بالتقييم المجاني، واعرفي من فين تبدئي مع الطلعات والزيارات. الرابط في البايو.", "caption_ar": "جلستي تجهزي ساعتين، وطلعتي من الملكة قبل العشا؟ التقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.\nفي البوست حركة يتعلمها قبل المناسبة.\n\nتعليق مثبت: الجزء الثاني: أول كم مرة، اضغطي انتي على يده ضغطتين وقولي \"نطلع شويه؟\" واطلعوا.\nوالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.", "notes": "Anhar's final edit. Her note: Okay, for this post, there are a few language changes here and there, but mainly the tool. I changed it from he's learning the tool right as they get out of the car to a few days before, because if this is meant as prevention, then you can't be just teaching a child a new tool as they're walking into the place. It has to be a few days or a few weeks before, so using the tool becomes second nature, not something he suddenly learns and then forgets a few minutes later. And about reward crying I changed it in the hook as well as throughout the post because at first I thought you meant screaming. But this is crying in a way that I don't say it So I changed the word"}, {"id": "b3p5", "conceptId": "c5", "title": "Evening 2 · 8:15 PM · Broken biscuit: the cracked screen · F4", "format": "slides · F4", "status": "final", "score": 79, "body_ar": "(1) فتحتي الباكت كله تدوري له على بسكوتة مهي مكسوره، وأكلتي أنتي المكسور؟\n\n(2) جبتي له بسكوتة، وانكسرت في يده.\nرماها وبكي، وما رضي ياخذ الثانية لأن فيها شق صغير.\nفصرتي تفتحي الباكت كله، وكل المكسور يروح لك.\n\n(3) تخيلي جوالك الجديد، وفي الشاشة كسر صغير.\nيشتغل عادي، بس كل ما مسكتيه، عيونك تروح للكسر.\n\n(4) هو يشوف البسكوتة نفس الشي. مهي بسكوتة فيها كسر، صارت خربانة.\nوهذي خطوتين تاخذ ثواني.\nالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي.\n\n(5) الخطوة الأولى: قبل ما تعطيه البسكوتة، اسأليه \"نكسرها نصين؟ وحده لك ووحده لي\".\nوخليه هو اللي يكسرها.\n\n(6) الخطوة الثانية: لو انكسرت قبل ما يكسرها، لا تقولي له \"نفس الشي\".\nاعطيه النصين وقولي \"تكسرها انت؟ تصير أصغر؟\". كذا هو اللي كسرها.\n\n(7) فيه طفل يضايقه الكسر نفسه، وطفل يضايقه إن غيره اللي كسرها.\nنفس البكاء، بس السبب مختلف.\n\n(8) لاحظي ايش صار قبل ما يرميها: انكسرت في يده، ولا شافها مكسورة، ولا انتي كسرتيها له؟\nهذي التفاصيل تساعدك تبني خطة تناسبه.\nالتقييم المجاني يساعدك تعرفي من فين تبدئي. الرابط في البايو.", "caption_ar": "فتحتي الباكت كله تدوري له على بسكوتة ما فيها كسر؟ التقييم المجاني في البايو يساعدك تعرفي من فين تبدئي.\nفي البوست ليش البسكوتة المكسورة صارت خربانة بالنسبة له، وخطوتين تاخذ ثواني.\n\nتعليق مثبت: الجزء الثاني: نفس الحركة تنفع مع التوست والموز. قبل ما تقطعيها، اسأليه \"نقطعها نصين؟\" وخليه هو يقول من فين. عشان يكون الكسر قراره هو.\nوالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي.", "notes": "Anhar's final edit. Her note: Okay for this post a few language changes"}, {"id": "b3p2", "conceptId": "c2", "title": "Evening 3 · 7:15 PM · Weekly جمعة: 3 things most people do · F7 mistakes", "format": "slides · F7 mistakes", "status": "final", "score": 85, "body_ar": "(1) رحتي جمعة أهلك عشان تجلسي معاهم، وقضيتيها كلها مع طفلك في الغرفة الثانية؟\n\n(2) هذي ثلاث أشياء الاغلب يسويها في الجمعات، وتخلي الجمعة أصعب عليه وعليكي.\n\n(3) أول شي: تردي على اللي في المجلس قبل ما تردي عليه.\nيبكي، ويقولوا \"دلعتيه\"، فتقولي \"تعبان، ما نام\"، وهو لسه يسحبك.\nانزلي لمستواه أول، والمجلس يستنى.\nالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي.\n\n(4) الشي الثاني: تستني إلين ما يرمي نفسه على الأرض عشان تطلعي.\nيبدأ يلصق فيكي، وتقولي في نفسك \"شوية ويهدى\"، وبعد دقيقة تلاقيه على الأرض.\nأول ما يبدأ يلصق فيكي، اطلعي معاه شوية وارجعوا.\n\n(5) الشي الثالث: ترجعي البيت وما تتذكري إلا البكاء.\nبس الدقيقة اللي قبله هي اللي تفرق: إيش كان يسوي، وإيش صار حوله، وكم صار لكم جالسين.\nاللي تلاحظيه كل جمعة معلومة، مو شكوى.\n\n(6) ومن هنا نبني الخطة: نرتب اللي لاحظتيه من كل جمعة، ونختار منه خطوة وحده تبدئي فيها.\n\n(7) فكري في آخر جمعة، وايش صار قبل ما قمتي معاه للغرفة الثانية.\nهذي الدقيقة هي بداية خطة تناسبه.\nوالتقييم المجاني يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات. الرابط في البايو.", "caption_ar": "رحتي جمعة أهلك وقضيتيها في الغرفة الثانية؟ التقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.\nفي البوست ثلاث أشياء الاغلب يسويها في الجمعة، وايش تسوي بدالها.\n\nتعليق مثبت: الجزء الثاني: أول ما توصلوا، اختاري مكان جلستك قريب من الباب. عشان لما تحتاجي تطلعي معاه، تطلعي بهدوء بدون ما تمري على المجلس كله.\nوالتقييم المجاني في البايو يساعدك تعرفي من فين تبدئي مع الطلعات والزيارات.", "notes": "Anhar's final edit. Her note: In this post I changed a few language things, but the main thing I changed is the we language, like these are three things we do, or most let S=null, sel=null, last="";

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function arwrap(s){return s.replace(/([«"][^»"]*[؀-ۿ][^»"]*[»"])/g,'<span dir="rtl">$1</span>')}
function md(src){
  const L=(src||"").split("\n");let o="",i=0;
  while(i<L.length){let l=L[i];
    if(/^\s*$/.test(l)){i++;continue}
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)/)){const n=Math.min(4,m[1].length+2);o+=`<h${n}>${arwrap(inl(m[2]))}</h${n}>`;i++;continue}

      const cells=r=>r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      let h=cells(rows[0]),body=rows.slice(rows[1]&&/^\|[\s:-|]+\|?$/.test(rows[1])?2:1);
      o+=`<div class="tw"><table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${cells(r).map(c=>`<td${isAr(c)&&!/[a-z]{4}/i.test(c)?' class="ar"':''}>${arwrap(inl(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue}
    if(/^>\s?/.test(l)){let b=[];while(i<L.length&&/^>\s?/.test(L[i]))b.push(L[i++].replace(/^>\s?/,""));const t=b.join(" ");o+=`<blockquote${isAr(t)&&!/[a-z]{4}/i.test(t)?' class="ar"':''}>${inl(t)}</blockquote>`;continue}
    if(/^\s*[-*]\s+/.test(l)){o+="<ul>";while(i<L.length&&/^\s*[-*]\s+/.test(L[i]))o+=`<li>${arwrap(inl(L[i++].replace(/^\s*[-*]\s+/,"")))}</li>`;o+="</ul>";continue}
    if(/^\s*\d+[.)]\s+/.test(l)){o+="<ol>";while(i<L.length&&/^\s*\d+[.)]\s+/.test(L[i]))o+=`<li>${arwrap(inl(L[i++].replace(/^\s*\d+[.)]\s+/,"")))}</li>`;o+="</ol>";continue}
    let p=[];while(i<L.length&&!/^\s*$/.test(L[i])&&!/^(#|\||>|\s*[-*]\s|\s*\d+[.)]\s)/.test(L[i]))p.push(L[i++]);
    const t=p.join(" ");o+=`<p${isAr(t)&&!/[a-z]{4}/i.test(t)?' class="ar"':''}>${arwrap(inl(t))}</p>`;
  }return o}
