<title>Creative Production</title>
<style>
:root{--bg:#faf9f6;--card:#ffffff;--ink:#1b1a18;--muted:#6b6862;--line:#e6e3dc;--accent:#4f46e5;--accent-soft:#eef0ff;--idle:#a8a49c;--working:#d79a0b;--done:#1d9a53;--dark:#1f1e1c;--dark-ink:#f3f2ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#201f1c;--ink:#ecebe7;--muted:#9c988f;--line:#33312d;--accent:#8b86ff;--accent-soft:#25244a;--idle:#5f5c56;--dark:#0f0e0d;--dark-ink:#ecebe7}}
:root[data-theme="dark"]{--bg:#171614;--card:#201f1c;--ink:#ecebe7;--muted:#9c988f;--line:#33312d;--accent:#8b86ff;--accent-soft:#25244a;--idle:#5f5c56;--dark:#0f0e0d;--dark-ink:#ecebe7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:20px;margin:0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted)}
.spacer{flex:1}
button{font:inherit;cursor:pointer}
.toggle{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px}
.stepper{display:flex;justify-content:space-between;position:relative;margin:8px 0 22px;overflow-x:auto;padding-bottom:4px}
.stepper:before{content:"";position:absolute;left:18px;right:18px;top:17px;height:2px;background:var(--line);z-index:0}
.st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:64px;background:none;border:0;color:var(--ink);padding:0}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;background:var(--idle);border:3px solid var(--bg)}
.st.cur .dot{box-shadow:0 0 0 2px var(--accent)}
.st.sel .lbl{font-weight:700;color:var(--ink)}
.lbl{font-size:11px;color:var(--muted);text-align:center;max-width:80px;line-height:1.2}
.s-idle{background:var(--idle)}.s-working{background:var(--working)}.s-needs-you{background:var(--accent)}.s-done{background:var(--done)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:22px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;color:#fff}
.det h2{font-size:30px;margin:6px 0 2px}
.sub{font-style:italic;color:var(--muted);margin:0 0 14px}
details.idea{background:var(--dark);color:var(--dark-ink);border-radius:10px;padding:12px 14px;margin:12px 0}
details.idea summary{cursor:pointer;font-size:13px}
details.idea h4{margin:10px 0 4px;font-family:Georgia,serif;font-size:17px}
.action{border:2px solid var(--accent);border-radius:12px;padding:14px;margin:14px 0}
.action .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.send{margin-top:10px;background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.md table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:13px}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 12px;color:var(--muted)}
.md code{background:var(--accent-soft);padding:1px 5px;border-radius:4px;font-size:12.5px}
.md h1,.md h2,.md h3{font-family:Georgia,serif}
.md img{max-width:100%;border-radius:8px}
h3.sec{font-family:Georgia,serif;font-size:22px;margin:30px 0 12px}
h4.grp{margin:14px 0 8px;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}
.av{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;text-transform:uppercase}
.sp b{display:block;font-size:13px}.sp span{font-size:12px;color:var(--muted)}
.sc{display:grid;grid-template-columns:200px 1fr 40px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
@media (max-width:520px){.sc{grid-template-columns:120px 1fr 32px}}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-right:4px;border:1px solid var(--line);color:var(--muted)}
.br{background:var(--accent-soft);color:var(--accent);border:0;font-weight:600}
.j-attention{background:#fde8d4;color:#8a4a0f;border:0}.j-trust{background:#d9efe2;color:#14653a;border:0}.j-conversion{background:var(--accent-soft);color:var(--accent);border:0}
.rtl{direction:rtl;text-align:right;background:var(--bg);border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-wrap;font-size:15px;line-height:1.8}
.score{float:right;border-radius:999px;padding:2px 10px;color:#fff;font-weight:700;font-size:13px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:6px 0}

.links a{display:inline-block;margin:4px 8px 0 0;font-size:13px;color:var(--accent)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.wait{text-align:center;padding:80px 0;color:var(--muted)}

<script>
/*__STATE__*/window.__STATE__={"project": "Home Orbit: production, Batch 1", "updatedAt": "2026-11-04T15:18:36.877751+00:00", "currentStage": 3, "canvaFolderId": "FAHZ9G86KFo", "stages": [{"n": 1, "key": "intake", "title": "Intake & brief", "subtitle": "The Production Director pulls the approved posts and confirms what to produce.", "status": "done", "idea": {"title": "Produce the message, not decoration", "body": "Effective communication beats beautiful design. Every asset serves one job, and no two posts look the same."}, "action": {"label": "Confirm the posts, the platform and the size, then go.", "phrase": "Produce these."}, "report": "## Intake: Batch 1, 10 carousels (all Branch A · static)\n\nPulled from the agency handoff (`app/handoff.md`). All 10 are final and approved. Format is already decided (static carousels), so there's no video branch this batch. **The Arabic on the slides is used exactly as approved.** Nothing gets rewritten to fit a layout; anything that doesn't fit gets flagged back to you.\n\n| # | Post | Job | Slides | CTA |\n|---|---|---|---|---|\n| 1 | p5 · The vacuum: three things that take seconds | attention | 7 | — |\n| 2 | p7 · The iPad: what comes after is ready first | conversion | 6 | الرابط في البايو. |\n| 3 | p2 · The عزيمة: three calculations that matter | attention | 7 | — |\n| 4 | p10 · He cries: three things to notice before guessing | conversion | 7 | الرابط في البايو. |\n| 5 | p3 · Lying beside him: step back bit by bit | attention | 8 | — |\n| 6 | p6 · Leaving the house: the 15 minutes before the shoes | conversion | 7 | الرابط في البايو. |\n| 7 | p4 · His own plate: find what his three foods share | attention | 7 | — |\n| 8 | p9 · His name vs the fridge door: four steps | conversion | 8 | الرابط في البايو. |\n| 9 | p1 · Coming back from the park starts when you arrive | attention | 7 | — |\n| 10 | p8 · Change isn't defiance: when someone else does bedtime | conversion | 8 | الرابط في البايو. |\n\n### I need three answers before we start\n1. **Platform and size.** TikTok photo carousels look best at **1080×1920 (9:16)**, and Instagram carousels at **1080×1350 (4:5)**. Which one, or both (each post laid out twice)? My recommendation: **1080×1350** as the master, because it works on Instagram and still displays on TikTok.\n2. **Brand files.** I found no brand identity file in the project. Your website uses **El Messiri** (headings) and **Tajawal** (body), with a teal (#008C95 / #005A70) and warm sand (#C9935A) palette. Is that the brand? And do you have the paper-art style files or examples (or a Canva Brand Kit)? The Art Director reads them before stage 3.\n3. **How to build.** **Canva** (real editable designs filed in your \"Home Orbit social media\" folder), **rendered PNGs** here (finished images you can post directly), or both. Recommendation: **both**. PNGs give you a guaranteed result with correct Arabic, and Canva gives you editable versions.\n\nOptional: send 3–6 of your recent posts (screenshots or Canva links), so the Visual Researcher can make sure this batch *doesn't* look like the last one.\n\n\n---\n### Anhar's answers\n- **Size:** 1080×1350 (4:5) for all 10.\n- **Fonts:** El Messiri (headings) + Tajawal (body).\n- **Brand kit:** it's in a docs file in Anhar's Claude project, not in Canva. ⚠ **The colours didn't come through in chat.** We need them before stage 3. For now, the website's teal (#008C95 / #005A70) and sand (#C9935A) are placeholders.\n- **Build:** both. Canva (filed in \"Home Orbit social media\") **and** rendered PNGs.\n"}, {"n": 2, "key": "direction", "title": "Visual direction", "subtitle": "The Visual Researcher studies what stops the scroll now, and proposes fresh directions.", "status": "done", "idea": {"title": "Recognisable, not identical", "body": "A feed where every post looks the same is visual apathy. Keep one through-line and vary the rest."}, "action": {"label": "Review the direction brief.", "phrase": "Direction looks right. Next."}, "report": "### Anhar's decisions on the direction\n- **Brand colours:** Deep Sea Blue #005A70 · Ocean Teal #00A9A5 · Pearl #F6F3EB · Sunrise Gold #C9935A.\n- **No realistic visuals. They don't perform.** The photo+paper hybrid is cut (p1, and the p4 alternate). Everything stays stylised paper art.\n\n---\n# Visual Direction: Batch 1 (10 static carousels)\n\n## 1. What's working now\n\n1. **Slide 1 does the work.** The first slide decides the swipe. Use one bold, high-contrast line plus a visible promise: the question big, the second clause small. ([trymypost](https://www.trymypost.com/blog/instagram-carousel-hook-design-principles-2026), [postnitro](https://postnitro.ai/blog/post/instagram-carousel-design))\n2. **One focal point that reads as a thumbnail.** One object or event, nothing competing. ([Adobe](https://www.adobe.com/express/learn/blog/social-media-photography-tips), [adlibrary](https://adlibrary.com/posts/scroll-stopping-ad-images))\n3. **Handmade beats polished.** 2026 forecasts point to paper texture and collage as a reaction against AI-smooth visuals. ([Creative Bloq](https://www.creativebloq.com/design/graphic-design/texture-warmth-and-tactile-rebellion-the-big-graphic-design-trends-for-2026), [Inkish](https://inkish.news/en/article/2026-design-trend-forecast-says-brands-will-win-with-imperfect-human-visuals))\n4. **One metaphor, layered paper, real shadow.** Eiko Ojala is the benchmark: minimal, lit, one idea per piece. ([Colossal](https://www.thisiscolossal.com/2017/10/new-paper-textured-editorial-illustrations-by-eiko-ojala/))\n5. **Step carousels with visible progress.** Numbering, one idea and ≤4 lines per slide, and a final slide that looks different. ([kivopost](https://kivopost.com/glossary/content-types-creative-formats-styles/step-by-step-carousel))\n6. **Colour-blocking in a checkerboard.** Flat colour fields are legible. Rotating 2–3 grounds across posts keeps the grid from blurring. ([colorpick](https://colorpick-app.pages.dev/blog/color-social-media-design))\n7. **Photo + paper hybrids.** Real photos with cut-paper overlays, a growing editorial pattern. ([visie](https://visie.io/article/the-art-of-the-mash-up-7-collage-illustrators-turning-chaos-into-beauty))\n\n**Arabic:**\n- Design RTL-native; don't mirror a Latin layout.\n- Numerals don't mirror.\n- Heavy weights get dark, so cap El Messiri at 700.\n- Swipe order runs right to left. ([type guide](https://englishtoarabic-org.pages.dev/calligraphy/typography/))\n\n**Caveat:** The performance numbers come from vendor blogs, so treat them as directional. That includes TikTok carousels \"+81% engagement vs video\" ([Fanpage Karma](https://www.fanpagekarma.com/insights/carousel-vs-video-performance-tiktok-instagram/)) and [Socialinsider's](https://www.socialinsider.io/data-geeks/Instagram-Carousel-Study.pdf) carousel ER. I found no study comparing text-led and illustrated carousels, so §5 tests it.\n\n## 2. Recent Home Orbit work\n\n**\"Too Much\" (animation and storyboard):**\n- A 9:16 side-view night room diorama: deep-teal wall, floor band, oval rug, window and moon.\n- Paper puppets for the mother and child.\n- Scattered props: checklists, a clock, toys.\n- Text on a teal strip rotated −1° at the top.\n- The \"paper\" is only stacked drop shadows on flat CSS shapes, with no grain or torn edges.\n\n**\"Leaving Grandma's\":**\n- The same side-view room diorama, warm and in daylight: cream, brown furniture, sofa, door, three figures.\n- 84px white rounded caption cards in Alexandria (off-brand), with emoji (💀😂), which is off-tone.\n\n**Repetition risk:**\n- The same wide room, the same puppets and the same top text label. Ten more dioramas would make the grid identical.\n- The paper also reads as vector rather than paper.\n\n## 3. The look for this batch\n\n**Through-line (recognisable):**\n- **Real paper material.** Visible grain, edges that are slightly irregular rather than vector-perfect, and a tight contact shadow plus a soft cast shadow. Shapes overlap.\n- **Type.** El Messiri 700 for hooks at 88–110px. Tajawal 500 for body at 46–54px. Max 3 lines per slide.\n- **Signature step tab.** Labels («أول شي», «الخطوة الثانية», «الحساب الثالث») sit on a small torn sand-paper tab, top-right, with paper progress dots.\n- **Endings.** Every conversion post ends on a sand ground with the same paper \"link in bio\" tag. Attention posts end on one quiet line.\n- **No faces on the child.** Show hands, his back, feet and objects. This is respectful, avoids puppets, and is easier to render.\n\n**What varies:** composition family, ground colour (checkerboard across the grid), point of view (side, top-down, macro), and hero scale.\n\n**Grounds:** sand #C9935A, light teal #DCE8EA, deep teal #005A70, paper white #F7F2EA, and deep brown #3A2410 (once).\n\n## 4. Per-post direction (posting order)\n\n| # | Post | First-slide idea | Family | Colour | Text |\n|---|---|---|---|---|---|\n| 1 | **p5 vacuum** | A huge paper vacuum. Torn-paper \"noise\" strips burst out. In a far corner, small paper hands cover ears. | One Big Object | Light teal, sand, deep-teal strips | Hook 100px top-right. In the steps the vacuum shrinks and moves away. |\n| 2 | **p7 iPad** | Split frame: a glowing iPad on the right (read first), a biscuit plate already waiting on the left. | Split | Deep teal + warm sand | Question over the iPad, «جهزي اللي بعده» over the plate. |\n| 3 | **p2 عزيمة** | Top-down paper majlis plan: cushions, TV, speaker, door. The seat by the door is circled in sand. | Top-down Map | Paper white, teal, brown lines | Each «الحساب» slide highlights one zone of the same map. |\n| 4 | **p10 crying** | One paper teardrop with three blank torn notes pinned around it. | Clue Board | Sand, white notes | Each step fills a note: the iPad off, a puzzle piece, a blender. |\n| 5 | **p3 bedtime** | Seamless panorama. A bed and mum's slipper beside it under a paper moon. Her chair moves across the slides toward the door. | Panorama Path | Deep-teal night, one warm lamp | White hook on the dark ground. Tabs ride above. |\n| 6 | **p6 shoes** | A giant paper clock. Small shoes sit at 12, and the quarter-hour before them is a sand wedge. | One Big Object | Deep brown, sand, white | The wedge shows «ربع الساعة». |\n| 7 | **p4 plate** | Overhead: nuggets, fries and toast, all golden paper, with a tiny empty plate beside. | Top-down Flat-lay | Light teal, golden | Slide 3 circles \"crunchy golden\". Slide 5 adds falafel. |\n| 8 | **p9 name vs fridge** | A huge glowing fridge door ajar. A tiny paper speech bubble holds his name in the corner. | Split / Scale | White + deep teal | The long hook is split: the first clause big, the second at body size. The bubble grows each step. |\n| 9 | **p1 park** | A real top-down photo of grass and a blanket. A paper car is pinned at the edge, with a paper path from the blanket. | Photo + Paper | Natural green + paper | Hook on a torn white strip. Items get packed in order: food bag, toys, blanket. |\n| 10 | **p8 aunt bedtime** | Type only: «مو كل رفض عناد» at around 130px in layered paper, with one story book below. | Type-first | Sand, deep-teal type | Inner slides are small object vignettes (book stays with mum, pyjamas to the aunt). |\n\n**Adjacency:** BO → Split → Map → Board → Panorama → BO → Flat-lay → Split → Hybrid → Type. No neighbours repeat, and light and dark grounds alternate across the grid.\n\n## 5. Fresh directions to test\n\n1. **Type-first big Arabic.**\n   - Try it on **p8** (a statement hook) and as an A/B slide 1 on **p10**.\n   - It's the cheapest option and the most legible, and it answers the text-versus-illustration question with our own data.\n2. **Single paper object hero.**\n   - Try it on **p5** and **p6**.\n   - It reads at thumbnail size, needs no puppets, and makes the clearest break from the dioramas.\n3. **Photo + paper hybrid.**\n   - Try it on **p1**, and as an alternate on **p4** with a real plate shot from above.\n   - The real setting makes it feel like her life. It needs licensed or own photos with no faces.\n\nThe p3 panorama is a small fourth test, aimed at swipe completion.\n\n## 6. Production realism (HTML/CSS → PNG)\n\n**Renders well in Chromium at 1080×1350:**\n- `clip-path` and SVG cut shapes.\n- Grain via SVG `feTurbulence` (fractalNoise at about 0.04 and 4–5 octaves, 6–10% opacity). See [Codrops](https://tympanus.net/codrops/2019/02/19/svg-filter-effects-creating-texture-with-feturbulence/) and [CSS-Tricks](https://css-tricks.com/?p=351302).\n- Torn edges via `feDisplacementMap` or jagged polygons.\n- Layered shadows.\n- Arabic RTL with El Messiri and Tajawal.\n- Tabs and dots, maps, clocks and flat food shapes.\n- Type-only slides.\n- Panoramas: render one wide canvas, then slice it.\n\n**Needs Canva, illustration or photos:**\n- Large figurative hands and bodies (keep them small and simplified, or use SVG illustration).\n- Realistic food.\n- The p1/p4 photo bases: source in Canva or stock, then composite paper in HTML.\n- A one-time real paper scan as an uploaded texture would beat procedural grain.\n\n**Rule:** 6–12 shapes per slide. Detail costs legibility.\n"}, {"n": 3, "key": "art", "title": "Art direction & brand", "subtitle": "The Art Director sets the through-line and a varied system per post.", "status": "needs-you", "idea": {"title": "One thread, many shapes", "body": "The brand is a home base, not a template."}, "action": {"label": "Approve the art direction.", "phrase": "Approved. Build it."}, "report": "## Director's summary\n- **Through-line:** cut paper on a flat colour ground: grain, torn edges, light from the top-right. Hooks in El Messiri at ~96px, body in Tajawal at 50–60px, never below 44px. A torn gold step tab, paper progress dots, no slide numbers.\n- **Grid:** dark and light grounds alternate in posting order. No two neighbours share a composition.\n- **p1 park:** the photo is replaced by a top-down paper route map (teal lawn, gold blanket, dashed path to a paper car).\n- **Conversion end slides:** gold ground, with the post's own last line on a pearl tag. No words added.\n- **Contrast-safe pairs only:** gold text on Deep Sea and white on Ocean Teal are banned (too low contrast).\n\n### ⚠ Decision needed: long slides\nTen slides are long enough that they can't stay *big* and readable at a glance. The designers **won't change your Arabic**. Choose one option per group:\n- **Red** (more than 5 lines at the minimum size, or the hook shrinks):\n  - p7 slide 6 (the bridge, 151 characters)\n  - p9 slide 1 hook (124)\n  - p3 slide 7 (123)\n  - p2 slide 7 (120)\n  - p7 slide 4 (111)\n- **Amber** (fits, but tight): p6 s5, p8 s8, p2 s3, p6 s7, p8 s1, p5 s5, p2 s2, p9 s8, p1 s4, p4 s6.\n\n**Options:**\n- **A.** Set them as they are, smaller and tighter. Fastest, but they'll read more like a wall of text.\n- **B.** Split each red slide into two slides at its existing line break or full stop. Same words, more slides.\n- **C.** You shorten the red ones yourself.\n\n**Recommendation:** **B** for the red ones, **A** for the amber ones.\n\n---\n\n# Art Direction: Batch 1\n\nValues: `art_tokens.json`.\n\n## 1. Through-line\n\nReal paper on flat colour, lit from the top-right. Composition, viewpoint, scale and ground change per post; the material never does.\n\n- **Grain:** one SVG filter on every shape. Mottle is fractalNoise 0.035, 3 octaves, 5%. Fibre is fractalNoise 0.9, 4 octaves, 7%, multiply. The ground gets 4%. Seeds are fixed.\n- **Edges:** torn edges are jagged polygons (6–12px amplitude, every 10–18px) over a pearl core offset 3px at 70%. Cut edges use feDisplacementMap at scale 3.\n- **Shadows:** every layer gets a contact shadow (−1 2 2px, ink 28%) and a cast shadow (−6 10 18px, ink 18%). On dark grounds both use #00141A at 45% and 35%. Each higher layer adds 4px of cast offset, plus a 1px white highlight at the top-right.\n- **Safe area:** margins are 96px at the sides, 120px at the top and 150px at the bottom, giving an 888×1080 text box. Keep key content 60px or more from the sides, because the profile grid crops to 3:4.\n- **Type** (px at 1080 wide, with line-height):\n\n| Role | Font | Size | LH |\n|---|---|---|---|\n| Hook | El Messiri 700 | 96 (88–110) | 1.35 |\n| Hook second clause | Tajawal 500 | 54 | 1.5 |\n| Type-first hook (p8) | El Messiri 700 | 120 | 1.3 |\n| Step label | El Messiri 600 | 44 | 1.2 |\n| Body lead | Tajawal 700 | 60 | 1.45 |\n| Body support (after \"\\n\") | Tajawal 500 | 50 | 1.5 |\n| Quiet end line | El Messiri 600 | 72 | 1.4 |\n| Tag | Tajawal 700 | 46 | 1.3 |\n| Floor | – | 44 | – |\n\n- **Step tab:** a torn gold strip at the top-right, 72px tall and rotated −2°, with ink text. It holds the slide's own label up to the colon («الخطوة الأولى:»). The rest follows as body, so nothing is duplicated.\n- **Dots:** 14px paper discs with 12px gaps, at bottom-centre 72px up. The current slide's dot is a 20px gold disc; the rest are the text colour at 40%. They run right to left, slide 1 has none, and there are no slide numbers.\n- **Conversion end:** a full gold ground with ink text. The motif returns at 25% size in the bottom-left. The existing last sentence sits on a pearl torn tag (−3°, punched hole, deep string): «الرابط في البايو.» on p6/p7/p8/p10, and «التقييم المجاني في البايو يمر عليها كلها.» on p9.\n- **Attention end:** own ground, quiet line centred at 72px, one motif accent.\n\n## 2. Colour\n\n- **Brand:** deep #005A70 · teal #00A9A5 · pearl #F6F3EB · gold #C9935A.\n- **Derived:** night #003F4F (deep −30%) · ink #0E2F38 · tealMist #DCEEEC · sandLight #EBD6BC · goldDeep #8A5A2B · tealDeep #007A77.\n- **Grounds:**\n  - Light: pearl, tealMist, sandLight.\n  - Dark: deep, night.\n  - Gold is a ground on end slides only. Teal is never a ground.\n- **Contrast** (WCAG 2.x): all text is 44px or larger, so the large-text threshold is 3:1, but I target 4.5:1.\n  - **Pass:** ink on pearl 12.8, ink on tealMist 11.8, ink on sandLight 10.0, ink on gold 5.3, deep on pearl 7.0, pearl on deep 7.0, pearl on night 10.4.\n  - **Accent only (≥60px):** gold on night 4.3.\n  - **Banned:** gold on deep 2.9, deep on gold 2.9, pearl or white on teal 2.6–2.9, teal on pearl 2.6.\n\n## 3. Per-post spec (posting order; grid D L D L D L D L D L)\n\n**1. p5 vacuum.** Night ground, D. One Big Object (macro).\n- Motif: a canister vacuum about 70% of the frame, bleeding off the bottom-left: pearl body ellipse, deep hose arc, gold wheels.\n- Five torn teal and gold \"noise\" strips fan from the nozzle. Two small pearl mitten-hands cover an ear at the top-left.\n- Slide 1: hook top-right in pearl, 96px, 3 lines.\n- Inner slides: the vacuum shrinks (70→45→25%) and drifts left. On s6 a pearl doorway stays open. Accent: gold.\n\n**2. p7 iPad.** Pearl ground with a tealMist right panel, L. Split frame with a torn seam.\n- Right: a deep iPad (28px radius) with a two-layer teal glow.\n- Left: a gold concentric plate holding four sandLight biscuits.\n- Slide 1: the question sits over the iPad in ink at 96px; «جهزي اللي بعده قبل ما تسحبيه» sits over the plate at 54px.\n- Inner slides: the plate side grows. On s4 a deep shower-head is crossed by a gold strip.\n\n**3. p2 عزيمة.** Deep ground, D. Top-down blueprint.\n- Motif: a majlis plan in pearl outline. A U of 8 sandLight cushions, a night TV bar, two speakers, and a door gap at the bottom-right. A torn gold ring marks the seat by the door.\n- Slide 1: hook top-right in pearl, 92px, over the empty centre.\n- Inner slides: each «الحساب» lifts one zone in gold: the arrival path, then the seat ring, then a gold bag holding a cup, a dish and a toy.\n\n**4. p10 crying.** SandLight ground, L. Clue board.\n- Motif: a cut deep teardrop (300px) at centre-low. Three blank pearl torn notes with gold pins sit around it.\n- Slide 1: hook top-right in ink, 96px.\n- Inner slides: each «شي» enlarges one note, which gains a flat deep icon: an iPad with an off-dot, then a puzzle piece, then a blender.\n\n**5. p3 bedtime.** Night ground, D. Panor pearl strip (−1.5°) across the top third, ink, 88px.\n- Inner slides: items travel the path. s3 a gold pin on the car; s4 the bag, then the ball, then the blanket lift off; s6 a juice box in the car.\n\n**10. p8 aunt.** Pearl ground, L. Type-first.\n- Motif: deep cut-paper letters over a gold duplicate offset −8px 8px, with one small closed storybook (gold cover).\n- Slide 1: «مو كل مرة… يعاندك.» at 120px, and the rest at 54px.\n- Inner slides: low vignettes. The book stays by a gold chair; striped pyjamas pass to a sandLight hand.\n\n**Adjacency:** macro → split → map → board → panorama → radial → flat-lay → scale → route → type; neighbouring grounds always differ in value.\n\n## 4. Brand check\n\nAll ten carry grain, double shadows, El Messiri hooks, gold tab and dots (plus the gold tag on conversion posts). Freshness against the side-view rooms:\n- **p5:** one cropped object, with no room and no puppets.\n- **p7:** a split object pair with no figures.\n- **p2:** a plan view, not an elevation.\n- **p10:** a symbolic board with no scene.\n- **p3:** the closest to a room, but a sliced panorama with no figures.\n- **p6:** a clock dial; time stands in for place.\n- **p4:** an overhead flat-lay of geometric food.\n- **p9:** extreme scale on a single object.\n- **p1:** a map with a path and markers, not a landscape.\n- **p8:** pure type and one prop.\n\n## 5. Arabic setting\n\n- `dir=rtl`, right-aligned. Centre only where specified, and never justify.\n- Letter-spacing is 0. No synthetic bold, and El Messiri no heavier than 700.\n- **Line breaks:**\n  - Every \"\\n\" is a hard break.\n  - Otherwise, break only at a comma, a full stop or a phrase boundary.\n  - Never split a construct pair, a preposition from its noun («بـ لا»), a quote, or a label from its colon.\n  - Use `text-wrap: balance` on hooks and `pretty` on body to avoid widows.\n- **Limits:** about 20 characters per line at 96px and 30–34 at 60px. A hook gets at most 4 lines, a slide at most 5. Add no numerals.\n- **Legibility gate** (checked on the PNG):\n  1. The hook reads at 270px wide.\n  2. No text is under 44px.\n  3. Contrast is 4.5:1 or better.\n  4. No text crosses a motif.\n  5. The safe area is respected.\n  6. A diff against `slides_ar` is empty.\n  7. The dots run right to left.\n\n## 6. Fit flags (not rewritten)\n\n**Red** (over 5 lines at 50px, or hook below 88px):\n- p7 s6 (151 characters)\n- p9 s1 hook (124)\n- p3 s7 (123)\n- p2 s7 (120)\n- p7 s4 (111)\n\n**Amber** (fits only at 50px, tight):\n- p6 s5 (107)\n- p8 s8 (107, no \"\\n\")\n- p2 s3 (103)\n- p6 s7 (103)\n- p8 s1 hook (101, needs the big/small split)\n- p5 s5 (101)\n- p2 s2 (99)\n- p9 s8 (98)\n- p1 s4 (95)\n- p4 s6 (95)\n\n**Split hooks:** p1 s1, p6 s1 (80 characters): question big, clause small.\n\n**No \"\\n\":** p8 s2–s7 break at full stops.\n"}, {"n": 4, "key": "build", "title": "Build", "subtitle": "Branch A builds the carousels. Branch B (video) isn't used this batch.", "status": "idle", "idea": {"title": "Built from the approved copy, verbatim", "body": "Arabic on the slides is never rewritten to fit a layout. It's flagged instead."}, "action": {"label": "Review the slides.", "phrase": "Looks good. QA it."}, "report": ""}, {"n": 5, "key": "repurpose", "title": "Repurposing", "subtitle": "Optional: cut-downs from the same ideas.", "status": "idle", "idea": {"title": "One idea, many pieces", "body": "Test formats without inventing new topics."}, "action": {"label": "Pick the cut-downs, or skip.", "phrase": "Make the cutdowns."}, "report": ""}, {"n": 6, "key": "qa", "title": "Creative QA", "subtitle": "Every piece scored; Arabic legibility is a gate.", "status": "idle", "idea": {"title": "Score is a flag, not proof", "body": "Your eye decides what ships."}, "action": {"label": "Review QA and ship.", "phrase": "Ship it."}, "report": ""}, {"n": 7, "key": "delivery", "title": "Delivery & library", "subtitle": "Final assets handed over; reusable elements saved.", "status": "idle", "idea": {"ti  h+=`<h3 class="sec">The production scorecard</h3><div class="card">`+S.scorecard.items.map(it=>`<div class="sc"><span>${esc(it.name)}</span><div class="bar"><i style="width:${it.score!=null?Math.round(100*it.score/it.weight):0}%"></i></div><b>${it.score!=null?it.score:it.weight}</b></div>`).join("")+`<div class="mono" style="margin-top:8px">Arabic legibility is a gate</div></div>`;
 const A=(S.pieces||[]).filter(p=>p.branch!="B"),B=(S.pieces||[]).filter(p=>p.branch=="B");
 h+=`<h3 class="sec">The pieces</h3>`;
 if(A.length)h+=`<h4 class="grp">Branch A · Static (${A.length})</h4>`+A.map(piece).join("");
 if(B.length)h+=`<h4 class="grp">Branch B · Video (${B.length})</h4>`+B.map(piece).join("");
 h+=`<footer>The department proposes. You decide at every checkpoint.</footer>`;
 document.getElementById("app").innerHTML=h;
 document.querySelectorAll(".st").forEach(b=>b.onclick=()=>{sel=+b.dataset.n;render()});
 document.querySelectorAll(".send").forEach(b=>b.onclick=()=>{const p=b.dataset.p;(navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(()=>{b.textContent="Copied ✓"},()=>{b.textContent=p})});
 document.getElementById("tg").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("cp-theme",r.dataset.theme)}catch(e){}};
}
function apply(s){const j=JSON.stringify(s);if(j===last)return;const prev=state&&state.currentStage;state=s;last=j;if(prev&&prev!==s.currentStage)sel=s.currentStage;render()}
function poll(){fetch("production.json",{cache:"no-store"}).then(r=>r.json()).then(apply).catch(()=>{if(!state)render()})}
document.addEventListener("DOMContentLoaded",()=>{if(window.__STATE__)apply(window.__STATE__);poll();setInterval(poll,2000)});
})();
</script>
<div class="wrap" id="app"></div>
</body>
</html>
